---
# chart: 1.20.1
# repo:  https://helm.cilium.io/
#
# Cilium is the CNI and, for now, the only network layer.
#
# k8sServiceHost / k8sServicePort / ipam are injected by
# ansible/playbooks/30-cluster.yml from the inventory - kubeProxyReplacement
# used to be too, back when standard mode (kube-proxy alongside Cilium) was
# the running config. It's set explicitly below now that this cluster has
# migrated (docs/03-cluster.md) - the inventory var only matters for a
# from-scratch rebuild starting in the same mode.

# 3 nodes, 2 GB each.
operator:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  prometheus:
    enabled: true

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}

# Native routing would be faster, but it requires the underlay to route the pod
# CIDR — which means teaching OPNsense about 10.244.0.0/16. VXLAN keeps pod
# networking entirely inside the cluster and off the firewall's plate.
routingMode: tunnel
tunnelProtocol: vxlan

ipv4:
  enabled: true
ipv6:
  enabled: false

# Node-to-node encryption.
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

# NetworkPolicy for intra-VLAN traffic.
policyEnforcementMode: default

hubble:
  enabled: true
  relay:
    enabled: true
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}
  ui:
    # Costs ~150Mi across two containers. Turn on when you need to look at
    # flows; leave off the rest of the time on 2 GB nodes.
    enabled: false
  metrics:
    enabled: [dns, drop, tcp, flow, port-distribution]

# Cilium ships its own LB, but MetalLB in L2 mode is simpler here and is what
# the OPNsense reservation range was carved out for.
l2announcements:
  enabled: false

# ingress-nginx's replacement (retired/archived upstream, 2026-03-24 - no
# more CVE patches). This is the CNI everything already runs on, and it
# already ships the cilium-envoy DaemonSet this depends on - no new
# component. Requires the Gateway API CRDs to exist before this agent starts
# (cluster/argocd/applications/00-gateway-api-crds.yaml, sync-wave -30,
# ahead of this Application's -20). gatewayClass.create defaults to "auto",
# which creates the GatewayClass now that the CRDs are present - left as
# the default rather than duplicating that logic here.
gatewayAPI:
  enabled: true

# Migrated from standard mode (kube-proxy alongside Cilium) 2026-09-01.
# Also what unblocks Gateway API: Cilium's controller refuses to start
# without this (confirmed live via PR #92 - the GatewayClass sat in
# Unknown/"Waiting for controller" forever, and the operator logged "Gateway
# API support requires kube-proxy-replacement enabled"). The ansible-injected
# k8sServiceHost/k8sServicePort (not in this file - see the header comment)
# are what let the agent reach the API server directly instead of through a
# Service that doesn't exist yet.
kubeProxyReplacement: true

bpf:
  masquerade: true

prometheus:
  enabled: true

# Restarting every pod to pick up a config change is disruptive on 3 nodes.
rollOutCiliumPods: true
