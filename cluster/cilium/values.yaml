---
# chart: 1.20.0
# repo:  https://helm.cilium.io/
#
# Cilium is the CNI and, for now, the only network layer.
#
# k8sServiceHost / k8sServicePort / ipam / kubeProxyReplacement are injected by
# ansible/playbooks/30-cluster.yml from the inventory.

# 3 nodes, 2 GB each.
operator:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  prometheus:
    enabled: true

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}

# Native routing would be faster, but it requires the underlay to route the pod
# CIDR — which means teaching OPNsense about 10.244.0.0/16. VXLAN keeps pod
# networking entirely inside the cluster and off the firewall's plate.
routingMode: tunnel
tunnelProtocol: vxlan

ipv4:
  enabled: true
ipv6:
  enabled: false

# Node-to-node encryption. nodeEncryption additionally covers host-to-host
# traffic (not just pod-to-pod) - the control-plane node is opted out of it
# automatically (Cilium's own bootstrap safeguard: you cannot WireGuard your
# way to the apiserver before reaching the apiserver to exchange keys), which
# conflicts with Cilium's separate, always-on special-cased tunnel routing for
# apiserver reachability and silently blackholes pod-to-ClusterIP apiserver
# traffic. Confirmed live via cilium monitor: SYNs to the apiserver ClusterIP
# get correctly DNAT'd (identity resolves to kube-apiserver) but are then
# routed onto cilium_vxlan and never re-emerge - no drop event, just gone.
# Pod-to-pod encryption is unaffected and stays on.
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: false

# NetworkPolicy for intra-VLAN traffic.
policyEnforcementMode: default

hubble:
  enabled: true
  relay:
    enabled: true
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}
  ui:
    # Costs ~150Mi across two containers. Turn on when you need to look at
    # flows; leave off the rest of the time on 2 GB nodes.
    enabled: false
  metrics:
    enabled: [dns, drop, tcp, flow, port-distribution]

# Cilium ships its own LB, but MetalLB in L2 mode is simpler here and is what
# the OPNsense reservation range was carved out for.
l2announcements:
  enabled: false

bpf:
  masquerade: true

prometheus:
  enabled: true

# Restarting every pod to pick up a config change is disruptive on 3 nodes.
rollOutCiliumPods: true
