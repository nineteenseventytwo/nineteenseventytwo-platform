---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-identity-webhook
  namespace: pod-identity-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# Read-only on ServiceAccounts, and nothing else.
#
# Upstream's manifest also grants secrets create/get/update/patch and
# certificatesigningrequests create/get/list/watch. Both belong to the
# `--in-cluster=true` mode, where the webhook mints its own serving cert
# through the CSR API and parks it in a Secret. This deployment runs
# `--in-cluster=false` and takes its cert from cert-manager, so neither
# permission is ever exercised — and a component that can create CSRs and
# write Secrets is not a thing to leave lying around unused.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-identity-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-identity-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-identity-webhook
subjects:
  - kind: ServiceAccount
    name: pod-identity-webhook
    namespace: pod-identity-webhook
