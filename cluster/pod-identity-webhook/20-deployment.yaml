---
# The same webhook EKS runs, on a kubeadm cluster.
#
# It watches ServiceAccounts for the `eks.amazonaws.com/role-arn` annotation.
# When a pod is created using an annotated ServiceAccount, it injects
# AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE and a projected service-account
# token with audience sts.amazonaws.com. Every AWS SDK picks those up with no
# application change, exchanges the token at STS, and caches an hour of
# credentials. Nothing is stored, and no Secret is created anywhere.
#
# docs/06-aws-federation.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-identity-webhook
  namespace: pod-identity-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name: pod-identity-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-identity-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-identity-webhook
    spec:
      serviceAccountName: pod-identity-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pod-identity-webhook
          image: public.ecr.aws/eks/amazon-eks-pod-identity-webhook:v0.6.17
          imagePullPolicy: IfNotPresent
          command:
            - /webhook
            # Port 8443, not the upstream default of 443. The image carries no
            # USER directive and so runs as root by default; binding a port
            # below 1024 as a non-root user would need NET_BIND_SERVICE, and
            # granting a capability to avoid changing a number is the wrong
            # trade. The Service maps 443 to this.
            - --port=8443
            # false = take the serving cert from the mounted cert-manager
            # secret instead of minting one through the CSR API. This is what
            # lets the ClusterRole above stay read-only.
            - --in-cluster=false
            - --annotation-prefix=eks.amazonaws.com
            - --token-audience=sts.amazonaws.com
            # Must match the api-audiences on the API server
            # (ansible/roles/kube_control_plane/templates/kubeadm-config.yaml.j2)
            # and the `aud` condition on every IAM role trust policy in
            # nineteenseventytwo-cloud. All three say sts.amazonaws.com.
            - --aws-default-region=eu-west-2
            # Use the regional STS endpoint rather than the global one in
            # us-east-1: lower latency from eu-west-2, and it keeps the
            # dependency inside the region the rest of the estate lives in.
            - --sts-regional-endpoint=true
            - --logtostderr
          ports:
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9999
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cert
              mountPath: /etc/webhook/certs
              readOnly: true
      volumes:
        - name: cert
          secret:
            secretName: pod-identity-webhook-cert
---
apiVersion: v1
kind: Service
metadata:
  name: pod-identity-webhook
  namespace: pod-identity-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ports:
    - name: https
      port: 443
      targetPort: 8443
  selector:
    app.kubernetes.io/name: pod-identity-webhook
