---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: pod-identity-webhook
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # cainjector copies the CA from the Certificate above into caBundle below
    # and keeps it current across renewals. Without this the API server has no
    # way to trust the webhook's serving cert and every call fails.
    cert-manager.io/inject-ca-from: pod-identity-webhook/pod-identity-webhook
webhooks:
  - name: pod-identity-webhook.amazonaws.com
    # Ignore, not Fail, and this is a deliberate trade in both directions.
    #
    # Fail would mean a broken or unreachable webhook blocks pod creation in
    # every selected namespace — on a three-node lab that turns one crashlooping
    # pod into an outage you cannot deploy your way out of.
    #
    # Ignore means the opposite failure: pods start cleanly with no AWS
    # credentials injected, and the symptom is Vault refusing to unseal or
    # Longhorn backups quietly failing, with nothing in the pod's own events to
    # explain it. If AWS access breaks for no visible reason, check this
    # webhook's pod before anything else.
    failurePolicy: Ignore
    clientConfig:
      service:
        name: pod-identity-webhook
        namespace: pod-identity-webhook
        path: /mutate
        port: 443
    # Scoped to the namespaces that actually federate to AWS. Every other pod
    # in the cluster skips this admission hop entirely, which on 2 GB nodes is
    # worth having, and it bounds what a compromised webhook could rewrite.
    # A new AWS-federated workload needs its namespace added here as well as
    # its role in the cloud repo: findings (07 Phase 10.4) was deployed
    # without it and got no credentials.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["argocd", "vault", "longhorn-system", "security", "findings"]
    # Longhorn instance-managers are left to the Fail entry below. The two
    # selectors must not overlap, or a matching pod is mutated twice.
    objectSelector:
      matchExpressions:
        - key: eks.amazonaws.com/skip-pod-identity-webhook
          operator: DoesNotExist
        - key: longhorn.io/component
          operator: NotIn
          values: ["instance-manager"]
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    sideEffects: None
    # v1beta1, not v1 — despite v1beta1 being the deprecated one. The webhook
    # binary (v0.6.17, the latest tag as of this writing) builds its response
    # as a bare v1beta1.AdmissionReview{} and never sets TypeMeta on it before
    # writing the HTTP response; grep the vendored source and there is no
    # APIVersion/Kind assignment anywhere in its Handle func. A v1-negotiated
    # apiserver strictly requires the response to declare
    # apiVersion: admission.k8s.io/v1, kind: AdmissionReview and rejects a
    # response missing them — confirmed live on this cluster's 1.36 apiserver:
    # "failed calling webhook ...: received invalid webhook response: expected
    # webhook response of admission.k8s.io/v1, Kind=AdmissionReview, got /,
    # Kind=", every single time, for every real admission call. Because
    # failurePolicy is Ignore, this fails silently — pods start with no AWS
    # credentials and the symptom is Vault refusing to unseal, with nothing in
    # the pod's own events to explain it. This is a known, still-open upstream
    # bug (aws/amazon-eks-pod-identity-webhook#225) with no fix released.
    #
    # v1beta1 AdmissionReview, despite the API being long deprecated as a
    # served resource, is still accepted by the apiserver as an admission
    # webhook wire format — confirmed live on 1.36: negotiating v1beta1 alone
    # gets a clean response and the correct AWS_ROLE_ARN /
    # AWS_WEB_IDENTITY_TOKEN_FILE injection, no apiserver error. v1 is
    # deliberately not listed as a fallback: it is not a safety net here, only
    # a silent way back into this exact bug if v1beta1 is ever unsupported by
    # a future apiserver, worse for being intermittent across upgrades rather
    # than an outright negotiation failure at admission-webhook-registration
    # time.
    admissionReviewVersions: ["v1beta1"]

  # The same webhook again, Fail, for Longhorn instance-managers only. They
  # run the backups, and they are long-lived: one created while the webhook
  # is down keeps no AWS credentials until someone deletes it. After the
  # 2026-11-08 power cut both came up before the webhook did, and every
  # nightly S3 backup failed for three days.
  #
  # With Fail, creating one is refused until the webhook answers, and
  # longhorn-manager retries until it does. That moves the failure from
  # silent to loud. The cost is that if the webhook stays broken, a node
  # whose instance-manager restarts cannot run its volumes. Nothing the
  # webhook needs lives on Longhorn (its cert is a cert-manager Secret, its
  # pods are stateless, one per worker), so there is no boot deadlock.
  # PodIdentityWebhookUnavailable and LonghornInstanceManagerAdmissionRejected
  # in cluster/monitoring/values.yaml say when this is biting.
  #
  # To back out in an emergency, delete this entry (or the whole object) and
  # let Argo restore it once the webhook is fixed; instance-managers are then
  # created without credentials, as before.
  - name: instance-manager.pod-identity-webhook.amazonaws.com
    failurePolicy: Fail
    clientConfig:
      service:
        name: pod-identity-webhook
        namespace: pod-identity-webhook
        path: /mutate
        port: 443
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["longhorn-system"]
    objectSelector:
      matchExpressions:
        - key: eks.amazonaws.com/skip-pod-identity-webhook
          operator: DoesNotExist
        - key: longhorn.io/component
          operator: In
          values: ["instance-manager"]
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    sideEffects: None
    # Same timeout as the default, and the same v1beta1 reason as above.
    timeoutSeconds: 10
    admissionReviewVersions: ["v1beta1"]
