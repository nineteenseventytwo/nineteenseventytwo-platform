---
# chart: 0.34.1
# repo:  https://helm.releases.hashicorp.com
#
# Vault OSS seals itself on every restart. On a Pi cluster that reboots, that
# means hand-unsealing at 11pm — so this uses AWS KMS auto-unseal. It costs
# pennies a month, removes the manual step entirely, and exercises KMS key
# policy, which is worth having done. ADR-0005.
global:
  enabled: true
  tlsDisable: true   # terminates at ingress-nginx; revisit if Vault is exposed

injector:
  # Not used — ESO is the consumption path. The injector would add a mutating
  # webhook and ~150Mi for a mechanism this cluster does not use.
  enabled: false

server:
  image:
    repository: hashicorp/vault
    tag: "2.0.4"
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {memory: 384Mi}

  dataStorage:
    enabled: true
    size: 4Gi
    storageClass: longhorn

  auditStorage:
    enabled: true
    size: 2Gi
    storageClass: longhorn

  # Single node. Raft HA across three 2 GB Pis costs more than the availability
  # it buys here; the data is on Longhorn with two replicas either way.
  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address     = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/vault/data"
      }

      # Auto-unseal, with no credential anywhere.
      #
      # The pod-identity-webhook injects AWS_ROLE_ARN and a projected token at
      # admission, from the annotation on the ServiceAccount below. Vault's AWS
      # SDK finds them, calls AssumeRoleWithWebIdentity, and gets an hour of
      # access to exactly this one key. There is no vault-kms Secret any more
      # and there is nothing to rotate — which is just as well, because the
      # DenyIAMUsersAndKeys SCP on the organisation root makes creating the
      # access key this used to want impossible.
      #
      # The alias, not the key ID: a key replacement in Terraform then is not
      # an edit here. Region and alias track nineteenseventytwo-cloud —
      # live/aws/platform-prod/kms.tf.
      seal "awskms" {
        region     = "eu-west-2"
        kms_key_id = "alias/nineteenseventytwo-vault-unseal"
      }

      # Audit device is enabled post-init (it cannot be set in config), see
      # cluster/vault/README.md.
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname = true
      }

  # IRSA. This annotation is the entire AWS configuration for this pod: the
  # webhook turns it into AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE and a
  # projected token with audience sts.amazonaws.com. The role's trust policy on
  # the AWS side pins `system:serviceaccount:vault:vault`, so this annotation
  # on any other ServiceAccount buys nothing.
  serviceAccount:
    create: true
    name: vault
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::972034964468:role/cluster/cluster-vault-unseal"

  # ingress-nginx's replacement. The Gateway itself already carries the
  # cert-manager annotation and owns the vault-tls Certificate
  # (cluster/gateway/00-gateway.yaml) - nothing to duplicate here.
  httproute:
    enabled: true
    hostnames: ["vault.eightbitsaxlounge.com"]   # tracks lab_domain
    parentRefs:
      - name: gateway
        namespace: gateway

ui:
  enabled: true

csi:
  enabled: false
