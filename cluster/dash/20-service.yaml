---
# ClusterIP only. cloudflared's ingress rule is the one client (ADR-0021).
apiVersion: v1
kind: Service
metadata:
  name: dash
  namespace: dash
  labels:
    app.kubernetes.io/name: dash
spec:
  selector:
    app.kubernetes.io/name: dash
  ports:
    - name: http
      port: 80
      targetPort: 8080
