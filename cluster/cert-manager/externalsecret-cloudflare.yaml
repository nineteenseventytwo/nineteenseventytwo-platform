---
# The Cloudflare token lives in Vault; ESO materialises it as an ordinary
# Kubernetes Secret here. cert-manager needs no Vault-specific annotations, and
# the same manifest works unchanged if the backend later becomes AWS Secrets
# Manager — that backend-swap property is the reason ESO was chosen over the
# Vault CSI driver or the Agent injector.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: platform/cloudflare
        property: api_token
