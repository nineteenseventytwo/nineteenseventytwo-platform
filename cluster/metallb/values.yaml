---
# chart: 0.16.1
# repo:  https://metallb.github.io/metallb
#
# L2 mode. The pool is carved out of VLAN 20 and MUST stay clear of the Kea
# DHCP pool (.100-.199) and the node reservations (.201-.204), or you get an
# address conflict that presents as intermittent service unavailability.
controller:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
speaker:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
  # memberlist gossips on 7946/tcp+udp between nodes. The hardening role opens
  # it for lab_subnet; if speakers cannot see each other you get split-brain
  # announcements rather than an obvious failure.
  frr:
    enabled: false

# frrk8s.enabled is a SEPARATE toggle from speaker.frr.enabled above, and
# defaults to true regardless of it — chart 0.16.x moved to frr-k8s
# (github.com/metallb/frr-k8s) as the BGP backend, replacing the older
# embedded-FRR approach speaker.frr.enabled used to fully control. Setting
# only speaker.frr.enabled: false, as this file did until now, left an
# entire unwanted FRR/BGP DaemonSet running anyway — 5 containers per pod,
# ~640Mi of limits.memory for a component this cluster (L2 mode, see header)
# has no use for. Confirmed live: this is what exhausted infra-quota's 1Gi
# limits.memory in metallb-system before metallb-controller could even be
# scheduled, blocking every speaker pod on "secret metallb-memberlist not
# found" (the controller creates that secret at runtime and never got the
# chance to). false here removes the frr-k8s DaemonSet entirely, matching
# the L2-only architecture this file already states.
frrk8s:
  enabled: false

prometheus:
  serviceAccount: kube-prometheus-stack-prometheus
  namespace: monitoring
