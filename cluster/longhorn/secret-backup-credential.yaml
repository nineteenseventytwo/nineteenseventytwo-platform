---
# Not a credential — a role ARN, same as the serviceAccount annotation in
# values.yaml. Longhorn's own backup-target client refuses an S3 target with
# an empty backupTargetCredentialSecret, full stop, even when the manager
# pod's own env already carries AWS_ROLE_ARN / AWS_WEB_IDENTITY_TOKEN_FILE
# from the pod-identity-webhook. AWS_IAM_ROLE_ARN here is what tells that
# client to use IRSA rather than demanding AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY — see longhorn/longhorn#1526.
apiVersion: v1
kind: Secret
metadata:
  name: longhorn-backup-credential
  namespace: longhorn-system
type: Opaque
stringData:
  AWS_IAM_ROLE_ARN: "arn:aws:iam::972034964468:role/cluster/cluster-longhorn-backup"
