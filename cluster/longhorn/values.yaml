---
# chart: 1.12.1
# repo:  https://charts.longhorn.io
#
# preUpgradeChecker.jobEnabled: the chart's own values.yaml says to disable
# this under Argo CD or any other GitOps tool, and means it - native Helm
# skips a pre-upgrade hook on a genuine first install (nothing to upgrade
# yet); Argo CD has no install-vs-upgrade distinction and runs every hook
# unconditionally on the very first sync. The hook Job's own pod spec
# references longhorn-service-account, a regular (non-hook) chart resource
# that does not exist yet on a first sync, so it fails every single
# attempt with "serviceaccount longhorn-service-account not found" - and
# since Argo CD blocks the rest of the sync-wave on hook success, nothing
# else in the chart, including that ServiceAccount, ever gets applied
# either. Confirmed live: deleting the stuck Job just gets an identical
# one recreated, failing identically, every time.
preUpgradeChecker:
  jobEnabled: false

# Worker SSDs only. Two replicas across two workers.
persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain   # a deleted PVC should not silently destroy data

defaultSettings:
  defaultReplicaCount: 2
  systemManagedComponentsNodeSelector: "node-role.kubernetes.io/worker:true"
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn
  replicaSoftAntiAffinity: false      # never put both replicas on one node
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 20
  # A rebuild saturates the Pi's single 1 GbE link and starves everything else.
  concurrentReplicaRebuildPerNodeLimit: 1
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  guaranteedInstanceManagerCPU: 10

# Volume backups to S3, via IRSA — not the AWS_ACCESS_KEY_ID /
# AWS_SECRET_ACCESS_KEY pair Longhorn's S3 docs lead with.
#
# backupTargetCredentialSecret cannot be empty: confirmed live, Longhorn's
# backup-target client refuses an S3 target outright ("could not access s3
# without credential secret") even once the pod-identity-webhook has injected
# AWS_ROLE_ARN / AWS_WEB_IDENTITY_TOKEN_FILE into the manager pod's own env —
# that env is not enough on its own. secret-backup-credential.yaml carries a
# single AWS_IAM_ROLE_ARN key, which is what tells this specific client path
# to use IRSA (longhorn/longhorn#1526) instead of demanding a real key pair.
# It is not a credential — the same role ARN is already committed below and
# in nineteenseventytwo-cloud's trust policy.
#
# The bucket, its lifecycle rules and the role are in nineteenseventytwo-cloud
# (live/aws/platform-prod). Backups are the one line item in the cost model
# with no natural ceiling — the bucket expires them at 90 days, but a schedule
# left on hourly will still find that out for you.
defaultBackupStore:
  backupTarget: "s3://nineteenseventytwo-longhorn-backups-972034964468@eu-west-2/"
  backupTargetCredentialSecret: "longhorn-backup-credential"
  pollInterval: 300

longhornManager:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
longhornUI:
  replicas: 1

# IRSA. The chart puts this on longhorn-service-account, which is exactly the
# subject the cluster-longhorn-backup role's trust policy pins. It also lands on
# longhorn-ui-service-account, which is harmless — the annotation is a request,
# and the trust policy on the AWS side is what decides.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::972034964468:role/cluster/cluster-longhorn-backup"

ingress:
  enabled: false   # reach it through port-forward until an auth story exists

# open-iscsi and nfs-common are installed by ansible/roles/kube_prereqs. The
# chart can install them via a DaemonSet, but node packages belong to Ansible.
csi:
  kubeletRootDir: /var/lib/kubelet
