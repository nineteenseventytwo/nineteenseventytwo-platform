---
# chart: 1.13.0
# repo:  https://charts.longhorn.io
#
# Worker SSDs only, two replicas across the two workers, S3 backups via IRSA.
# Findings: ../README.md#longhorn

# Argo CD runs this hook on a first sync and deadlocks the wave.
# See ../README.md#preupgradechecker
preUpgradeChecker:
  jobEnabled: false

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain   # a deleted PVC should not silently destroy data

defaultSettings:
  defaultReplicaCount: 2
  systemManagedComponentsNodeSelector: "node-role.kubernetes.io/worker:true"
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn
  replicaSoftAntiAffinity: false      # never put both replicas on one node
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 20
  # A rebuild saturates the Pi's single 1 GbE link and starves everything else.
  concurrentReplicaRebuildPerNodeLimit: 1
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  guaranteedInstanceManagerCPU: 10

# The credential secret holds a role ARN, not a key pair, and is required even
# under IRSA. See ../README.md#the-s3-backup-credential-secret-is-not-a-credential
defaultBackupStore:
  backupTarget: "s3://nineteenseventytwo-longhorn-backups-972034964468@eu-west-2/"
  backupTargetCredentialSecret: "longhorn-backup-credential"
  pollInterval: 300

longhornManager:
  # 256Mi was not enough: longhorn-manager on 1972-worker-1 was OOMKilled
  # (exit 137), and when the manager dies its volumes' engines go with it —
  # six faulted at once on 2026-09-18, replica rebuilds then failing with
  # connection-refused. Downstream that surfaces as a volume going read-only
  # *mid-write*, which is how it was found: a job wrote to its PVC fine, then
  # hit EROFS partway through copying a directory into it.
  #
  # Only the limit moves. The request stays at 128Mi deliberately: both
  # workers sit at ~91-93% of allocatable memory in requests already
  # (3056Mi and 3104Mi of ~3322Mi), so raising the request would eat most of
  # the remaining headroom and start costing scheduling. Raising the ceiling
  # alone lets the manager survive a spike without reserving more.
  #
  # The honest caveat: node limits are already ~300% of allocatable, so this
  # trades a predictable cgroup kill for a less predictable node-level one.
  # That is still the better trade while the manager is the thing dying and
  # taking volumes with it — but the real fix is less memory pressure on these
  # nodes, not a bigger ceiling. See ../README.md for what lives here.
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
longhornUI:
  replicas: 1
  # 1972-master-1 carries the standard control-plane NoSchedule taint and
  # sits at ~592Mi requested out of ~3.32Gi allocatable — almost entirely
  # idle, since only DaemonSets and the static control-plane pods tolerate
  # it. The UI is a stateless dashboard with no data-plane role — safe to
  # let it land there. longhornManager (systemManagedComponentsNodeSelector
  # above) and driver-deployer deliberately do NOT get this: those are the
  # I/O-heavy storage-serving components "Worker SSDs only" already keeps
  # off this node, for the same reason — replica rebuild traffic sharing a
  # node/disk with etcd is exactly the risk that selector avoids.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
      operator: Exists

# New in 1.13.0: the cluster-wide pod and PV controllers moved out of the
# longhorn-manager DaemonSet into this Deployment, one elected leader plus
# standbys. Three things differ from the chart default, for this cluster:
#
# replicas 2, not 3. Two workers and a control-plane node; a third standby
# buys nothing a second does not, and both workers are already at ~92% of
# allocatable memory in requests (see longhornManager above).
#
# Explicit resources. The chart ships `resources: ~` and longhorn-system has
# no LimitRange (policy/20-limitrange-default.yaml says why), so unset means
# BestEffort pods with no ceiling. Memory scales with the cluster's pod count
# (it caches every pod); this cluster runs on the order of a hundred.
#
# The control-plane toleration, same reasoning as longhornUI: it is a
# controller with no data-plane role and no PVC, so it can use
# 1972-master-1's idle memory instead of the workers'. The preferred
# anti-affinity in the chart default still spreads the two replicas.
longhornGlobalManager:
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
      operator: Exists

# IRSA. See ../README.md#irsa-annotation-placement
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::972034964468:role/cluster/cluster-longhorn-backup"

ingress:
  enabled: false   # reach it through port-forward until an auth story exists

# open-iscsi and nfs-common are installed by ansible/roles/kube_prereqs — node
# packages belong to Ansible, not to a chart DaemonSet.
csi:
  kubeletRootDir: /var/lib/kubelet
