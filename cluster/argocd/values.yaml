---
# chart: 10.10.5
# repo:  https://argoproj.github.io/argo-helm
#
# Argo CD on 2 GB nodes. The defaults assume a cluster with room to spare, so
# most of what follows is turning things down rather than on.

global:
  domain: "argocd.eightbitsaxlounge.com"   # tracks lab_domain in ansible group_vars

crds:
  install: true
  keep: true   # never let an uninstall take the Applications with it

configs:
  params:
    # Single replica of everything; HA is meaningless with one control plane.
    server.insecure: true              # TLS terminates at ingress-nginx
    application.namespaces: "*"
    # Poll interval. The default 3m is fine; webhooks would be better but the
    # lab has no inbound internet path, which is also why cert-manager uses
    # DNS-01. `make argocd-sync` forces a reconcile when you cannot wait.
    timeout.reconciliation: 180s
  cm:
    # Argo CD manages this repo only, including application workloads under
    # apps/ (ADR-0012). App repos publish images to GHCR; they hold no cluster
    # credential and get no Argo project of their own.
    application.resourceTrackingMethod: annotation
    # Appended to the chart's default resource.exclusions, not substituted for
    # them. Setting resource.exclusions here used to replace the whole default
    # list (Endpoints, EndpointSlices, Leases, the authz review kinds, CSRs,
    # cert-manager CertificateRequests, Cilium's internals) - the Cilium kinds
    # this file listed are all in the defaults anyway.
    #
    # Longhorn's runtime CRs are its own status bookkeeping, created by
    # longhorn-manager rather than by git: Argo tracks exactly one longhorn.io
    # object (platform-manifests' RecurringJob, which is not excluded). Engine,
    # Volume and BackupVolume alone were ~135k of the controller's ~220k watch
    # events over 12 days (argocd_cluster_events_total, 2026-11-14), every one
    # of them cached and processed for nothing.
    resourceExclusionsAdditional:
      - apiGroups: ["longhorn.io"]
        kinds:
          - Engine
          - Volume
          - Replica
          - BackupVolume
          - Backup
          - BackupTarget
          - Snapshot
          - VolumeAttachment
          - InstanceManager
          - Node
        clusters: ["*"]

controller:
  replicas: 1
  # 512Mi OOMKilled the controller on the very first live sync: comparing and
  # rendering the whole app-of-apps (11+ child Applications' worth of Helm
  # charts, cilium and kube-prometheus-stack among them) all at once is a
  # real memory spike, well above what steady-state reconciliation of any one
  # of them needs. 1Gi was sized for that one-time worst case at the time -
  # 2Gi now, because the fleet it compares in one pass on a from-scratch
  # sync has grown since: 17 Applications, and platform-policy alone renders
  # ~100 resources (NetworkPolicy x 25+, CiliumNetworkPolicy x 20+,
  # ResourceQuota/LimitRange x 14 each, ...). Confirmed live on build 0002:
  # 1Gi still OOMKilled (exitCode 137) mid-sync, repeatedly, which orphaned
  # in-progress sync operations on every restart - a stuck-looking
  # platform-policy sync with zero actual apply activity was this, not a
  # frozen controller. Kubernetes limits are a ceiling, not a reservation,
  # so headroom here does not cost anything once the initial sync settles.
  # Raising this without also raising the argocd infra-quota below just
  # trades an OOMKill for a quota-rejected pod - same mistake made twice
  # already this build (metallb-system, longhorn-system); don't make a
  # third here.
  #
  # The request is a different question from the limit: it is what the
  # scheduler plans with. Steady state is ~640Mi and syncs peak ~1.25Gi
  # (7 days to 2026-10-24); at 384Mi it was placed on worker-2 next to
  # Prometheus, the node thrashed, and the controller was OOMKilled by the
  # node rather than by its own 2Gi limit. 896Mi covers steady state with
  # room; the anti-affinity below keeps it off Prometheus's node when the
  # other worker has room. (1Gi did not fit: worker-2 had 986Mi unrequested
  # once Prometheus and Grafana's requests rose too, and the controller sat
  # Pending - 2026-10-24.)
  resources:
    requests: {cpu: 100m, memory: 896Mi}
    limits: {memory: 2Gi}
  # The live heap is ~250Mi at steady state, but with no memory limit known
  # to it the Go runtime sizes the heap off GOGC alone and had grown to
  # 1.2Gi reserved (go_memstats_sys_bytes, 2026-11-14) - after a sync peak it
  # holds on to far more than it is using, on the node that is already the
  # tightest. GOMEMLIMIT is a soft target, not a cap: past it the GC runs
  # harder rather than the process dying, so a from-scratch sync that really
  # needs more than this still gets it, up to the 2Gi limit above. Once a
  # week of steady state is in, the 896Mi request can come down to match.
  env:
    - name: GOMEMLIMIT
      value: 768MiB
  # Both workers run near 100% of requested memory, so a request this size
  # only reschedules if it can preempt; see priorityclass.yaml for the
  # 2026-11-01 outage this fixes.
  priorityClassName: platform-critical
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            namespaces: [monitoring]
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus

repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    # 384Mi OOMKilled it (exit 137, 2026-11-08; 4 restarts in 13 days):
    # rendering kube-prometheus-stack and cilium is a short burst well above
    # its ~60Mi steady state, too brief for a 30s scrape to catch - the 7-day
    # Prometheus max reads 228Mi. Still inside the argocd infra-quota:
    # 2Gi + 512 + 256 + 192 + 128Mi = ~3.1Gi of 4Gi.
    limits: {memory: 512Mi}

server:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  # 1972-master-1 carries the standard control-plane NoSchedule taint and
  # was sitting at ~592Mi requested out of ~3.32Gi allocatable - almost
  # entirely idle, since only DaemonSets and the static control-plane pods
  # tolerate it. server/applicationSet/redis are small, steady-state
  # components (no fleet-wide render burst) - safe to let the scheduler
  # place them there when it has room. controller and repo-server
  # deliberately do NOT get this: controller's own limit is 2Gi (see
  # below, sized for comparing the whole app-of-apps in one pass) and
  # repo-server does the actual git-clone + Helm-render work per sync -
  # both are exactly the bursty, memory-spiking profile that has no
  # business sharing a node with etcd.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
      operator: Exists
  # ingress-nginx's replacement. The Gateway itself already carries the
  # cert-manager annotation and owns the argocd-tls Certificate
  # (cluster/gateway/00-gateway.yaml) - nothing to duplicate here. Argo CD's
  # web UI talks grpc-web (HTTP/1.1-compatible), not native HTTP/2 gRPC - the
  # `argocd` CLI is never used against this hostname anywhere in this repo
  # (every Makefile target drives Argo CD through kubectl against the
  # Application CRD directly), so there's no ALPN/HTTP-2 concern to carry
  # over from ingress-nginx.
  httproute:
    enabled: true
    hostnames: ["argocd.eightbitsaxlounge.com"]   # tracks lab_domain
    parentRefs:
      - name: gateway
        namespace: gateway
        sectionName: argocd-https   # see cluster/README.md#one-gateway-one-ip

applicationSet:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 192Mi}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
      operator: Exists

notifications:
  enabled: false   # nothing to notify yet; re-enable with a real webhook

dex:
  enabled: false   # local admin only until an IdP exists

redis:
  # Redis makes no API calls; see ../README.md#argocd-redis-mounts-a-token-it-never-uses
  automountServiceAccountToken: false
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
      operator: Exists
