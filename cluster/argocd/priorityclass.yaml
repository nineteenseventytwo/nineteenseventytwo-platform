---
# Priority for the Argo CD application controller (controller.priorityClassName
# in values.yaml).
#
# On 2026-11-01 the second pod-identity-webhook replica (system-cluster-
# critical, #269) preempted the controller off worker-2. It then sat Pending
# for 9h, 4Mi short of a node, and at default priority it could not preempt
# anything back, so no Application was reconciled until a pod was moved by
# hand. With this class the controller displaces tenant pods instead of
# waiting behind them.
#
# Below longhorn-critical (1000000000) on purpose: a controller that is late
# by a reschedule costs nothing, while a Longhorn instance-manager evicted to
# make room for it detaches volumes.
#
# Applied by `make bootstrap-argocd` before the chart, not by Argo CD: the
# chart's pods are rejected at admission if the class does not exist yet.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical
value: 100000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  Platform control loops (Argo CD's application controller) that must
  reschedule onto a full worker by preempting tenant pods.
