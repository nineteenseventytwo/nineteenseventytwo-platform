---
# Auto-discovers application workloads. Every directory two levels under
# apps/ (apps/<name>/<env>/) becomes its own Argo CD Application — adding a
# new app or environment is "create the directory, add manifests, open a PR",
# with no Application YAML to hand-write. See apps/README.md and ADR-0012.
#
# Deliberately generates no Applications until apps/ has content — a git
# generator with zero matches is not an error, it is an empty ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/nineteenseventytwo/nineteenseventytwo-platform.git
        revision: main
        directories:
          - path: apps/*/*
  template:
    metadata:
      # apps/eightbitsaxlounge/dev -> app-eightbitsaxlounge-dev
      name: "app-{{index .path.segments 1}}-{{index .path.segments 2}}"
      annotations:
        argocd.argoproj.io/sync-wave: "100"
        # eightbitsaxlounge-state (a StatefulSet) stays perpetually
        # OutOfSync under Argo's default client-side diff: three rounds of
        # targeted ignoreDifferences additions (below) each provably
        # covered the entire real delta — confirmed via
        # `kubectl apply --server-side --dry-run=server` against the live
        # object — yet none cleared the status, even after a genuinely
        # fresh (noCache) comparison. Server-Side Diff compares against
        # the API server's own dry-run result instead of Argo's
        # client-side normalization heuristic, which is the documented
        # fix for exactly this class of server-defaulted-field mismatch.
        # Applies to every app this ApplicationSet generates (today, only
        # eightbitsaxlounge) — a reasonable default for any future app
        # too, not a special case worth branching the template over.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/nineteenseventytwo/nineteenseventytwo-platform.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        # eightbitsaxlounge-dev — must already exist via policy/tenants/,
        # which is why CreateNamespace is NOT set below. A workload landing
        # in a namespace with no quota is the exact failure this is meant to
        # prevent.
        namespace: "{{index .path.segments 1}}-{{index .path.segments 2}}"
      # Scoped by resource name, not by app — this template is shared
      # across every apps/*/* directory, and "eightbitsaxlounge-chat" is
      # specific enough not to collide with anything else under apps/.
      # chat is the one eightbitsaxlounge workload an operator still
      # scales imperatively at runtime (the "Chat Set Active Environment"
      # GitHub Actions workflow in nineteenseventytwo-eightbitsaxlounge,
      # toggling which of dev/prod's chat is the one live on the shared
      # Twitch conduit) — every other service in every app now runs at
      # its committed replica count in both environments simultaneously.
      # Without this, selfHeal reverts that scale back to whatever's
      # committed here on its next reconcile (up to every 3 minutes),
      # undoing the toggle within minutes of it running.
      ignoreDifferences:
        - kind: Deployment
          name: eightbitsaxlounge-chat
          jsonPointers:
            - /spec/replicas
        # eightbitsaxlounge-state has shown OutOfSync since its own
        # migration, surviving every hard-refresh, two prior fix attempts
        # (jqPathExpressions alone for the PVC template fields, then also
        # adding jsonPointers for the top-level StatefulSet spec fields)
        # and neither moved `.status.resources[].status` off OutOfSync,
        # confirmed live via a fresh hard-refresh against each attempt.
        # A `kubectl apply --server-side --dry-run=server` of this exact
        # manifest against the live object proves every one of the eight
        # fields below (four top-level, four inside volumeClaimTemplates)
        # is the *entire* remaining delta — nothing else changes. And a
        # side-by-side diff against eightbitsaxlounge-db's Deployment
        # (which Argo reports fully Synced with zero ignoreDifferences)
        # shows db has the exact same category of pod-template-level
        # server defaults (dnsPolicy, restartPolicy, schedulerName,
        # container probe/port/terminationMessage defaults) that Argo's
        # built-in normalizer already handles without help — ruling those
        # out here too. That leaves the ignoreDifferences mechanism itself
        # as the remaining variable: jsonPointers is proven working in
        # this app (the sibling entry above, `/spec/replicas` surviving
        # selfHeal for chat's toggle) while jqPathExpressions' `[]?`
        # wildcard array syntax for the embedded volumeClaimTemplates
        # entry was never independently confirmed to take effect. Since
        # there's exactly one template in this array, switching those
        # four to explicit-index jsonPointers removes jq entirely as a
        # variable for this next attempt.
        - kind: StatefulSet
          name: eightbitsaxlounge-state
          jsonPointers:
            - /spec/persistentVolumeClaimRetentionPolicy
            - /spec/podManagementPolicy
            - /spec/revisionHistoryLimit
            - /spec/updateStrategy
            - /spec/volumeClaimTemplates/0/apiVersion
            - /spec/volumeClaimTemplates/0/kind
            - /spec/volumeClaimTemplates/0/status
            - /spec/volumeClaimTemplates/0/spec/volumeMode
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
