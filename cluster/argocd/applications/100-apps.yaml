---
# Auto-discovers application workloads. Every directory two levels under
# apps/ (apps/<name>/<env>/) becomes its own Argo CD Application — adding a
# new app or environment is "create the directory, add manifests, open a PR",
# with no Application YAML to hand-write. See apps/README.md and ADR-0012.
#
# Deliberately generates no Applications until apps/ has content — a git
# generator with zero matches is not an error, it is an empty ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/nineteenseventytwo/nineteenseventytwo-platform.git
        revision: main
        directories:
          - path: apps/*/*
  template:
    metadata:
      # apps/eightbitsaxlounge/dev -> app-eightbitsaxlounge-dev
      name: "app-{{index .path.segments 1}}-{{index .path.segments 2}}"
      annotations:
        argocd.argoproj.io/sync-wave: "100"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/nineteenseventytwo/nineteenseventytwo-platform.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        # eightbitsaxlounge-dev — must already exist via policy/tenants/,
        # which is why CreateNamespace is NOT set below. A workload landing
        # in a namespace with no quota is the exact failure this is meant to
        # prevent.
        namespace: "{{index .path.segments 1}}-{{index .path.segments 2}}"
      # Scoped by resource name, not by app — this template is shared
      # across every apps/*/* directory, and "eightbitsaxlounge-chat" is
      # specific enough not to collide with anything else under apps/.
      # chat is the one eightbitsaxlounge workload an operator still
      # scales imperatively at runtime (the "Chat Set Active Environment"
      # GitHub Actions workflow in nineteenseventytwo-eightbitsaxlounge,
      # toggling which of dev/prod's chat is the one live on the shared
      # Twitch conduit) — every other service in every app now runs at
      # its committed replica count in both environments simultaneously.
      # Without this, selfHeal reverts that scale back to whatever's
      # committed here on its next reconcile (up to every 3 minutes),
      # undoing the toggle within minutes of it running.
      ignoreDifferences:
        - kind: Deployment
          name: eightbitsaxlounge-chat
          jsonPointers:
            - /spec/replicas
        # eightbitsaxlounge-state has shown OutOfSync since its own
        # migration, surviving every hard-refresh. Root-caused via the
        # Application API's managed-resources endpoint, comparing
        # targetState/normalizedLiveState/modified directly rather than
        # eyeballing a raw diff (a raw target-vs-normalized diff is noisy
        # even on resources Argo reports as in-sync — managedFields,
        # generation and pod-template defaulting show up there too but
        # don't set `modified`). Two distinct, additive causes, both
        # server-side defaulting Argo's normalizer doesn't know how to
        # reconcile for *this* kind:
        #   1. The embedded PVC template in volumeClaimTemplates gains
        #      apiVersion/kind/status (and spec.volumeMode) once
        #      Kubernetes creates the real PVC from it — fields the git
        #      manifest never sets.
        #   2. spec.persistentVolumeClaimRetentionPolicy,
        #      spec.podManagementPolicy, spec.revisionHistoryLimit and
        #      spec.updateStrategy are all server-defaulted at the top
        #      level of the StatefulSet spec and never set in git either.
        #      Deployment's analogous defaulted field (spec.strategy) IS
        #      handled by Argo's built-in normalizer (confirmed: db's
        #      Deployment reports modified:false despite a similar raw
        #      diff) — StatefulSet's equivalents apparently are not.
        - kind: StatefulSet
          name: eightbitsaxlounge-state
          jsonPointers:
            - /spec/persistentVolumeClaimRetentionPolicy
            - /spec/podManagementPolicy
            - /spec/revisionHistoryLimit
            - /spec/updateStrategy
          jqPathExpressions:
            - ".spec.volumeClaimTemplates[]?.apiVersion"
            - ".spec.volumeClaimTemplates[]?.kind"
            - ".spec.volumeClaimTemplates[]?.status"
            - ".spec.volumeClaimTemplates[]?.spec.volumeMode"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
