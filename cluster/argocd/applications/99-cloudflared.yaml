---
# cloudflared: the Cloudflare tunnel connector. ADR-0018 W5, ADR-0021.
# Namespace, quota, LimitRange and network policy come from policy/
# (platform-policy, wave 95) - CreateNamespace below is the same
# belt-and-braces every Application here carries.
#
# Wave 99, after platform-policy (95). It was 84 until 2026-10-27, which
# put it ahead of the Vault ClusterSecretStore its ExternalSecret reads
# (platform-manifests, wave 90). The parent app waits for each wave to be
# healthy, so on a rebuild it would have waited on this app forever (see
# 96-falco.yaml).
# The live cluster never hit it: platform-policy also syncs on its own.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "99"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  source:
    repoURL: https://github.com/nineteenseventytwo/nineteenseventytwo-platform.git
    targetRevision: main
    path: cluster/cloudflared
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 10m}
