---
# Runtime detection (07 Phase 10.1). Wave 96, after platform-policy (95),
# not beside the other infra apps. The falco namespace comes from policy/,
# with its privileged Pod Security label, and this app deliberately has no
# CreateNamespace: a namespace Argo created would get the cluster's baseline
# default and the Falco pods would be refused.
#
# The parent app waits for each wave's Applications to be healthy before the
# next wave. At wave 75 (the first version of this file) a rebuild would wait
# on Falco forever, for a namespace that only wave 95 creates. The live
# cluster got away with it only because policy/ syncs on its own as well.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "96"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  sources:
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: 9.2.0
      helm:
        releaseName: falco
        valueFiles:
          - $values/cluster/falco/values.yaml
    - repoURL: https://github.com/nineteenseventytwo/nineteenseventytwo-platform.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 10m}
