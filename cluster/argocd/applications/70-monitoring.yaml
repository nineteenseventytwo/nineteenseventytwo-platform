---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
    # Same fix as gateway-api-crds and gateway (00-gateway-api-crds.yaml,
    # 22-gateway.yaml): the HTTPRoute this Application now owns
    # (monitoring-grafana) carries server-populated status that trips Argo
    # CD's client-side diff into perpetual OutOfSync even though sync itself
    # succeeds and the live object matches. Confirmed live 2026-09-01.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.2
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/cluster/monitoring/values.yaml
    - repoURL: https://github.com/nineteenseventytwo/nineteenseventytwo-platform.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 10m}
