---
# The exporter's GitHub identity (07 Phase 10.4): its own GitHub App,
# "nineteenseventytwo-findings", with one repository permission - Code
# scanning alerts: read - installed on nineteenseventytwo-platform only. Not
# ARC's App (cluster/arc): that one holds the org's self-hosted-runner admin
# permission, and anyone with its key can register a runner and pick up CI
# jobs. A dashboard exporter must not carry that.
#
# The exporter signs a JWT with the key and exchanges it for a one-hour
# installation token, narrowed again to security_events:read in the request.
# Loaded once by hand: cluster/vault/README.md#findings-exporter.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: findings-exporter-github
  namespace: findings
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: findings-exporter-github
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef: {key: platform/findings-github-app, property: app_id}
    - secretKey: installation-id
      remoteRef: {key: platform/findings-github-app, property: installation_id}
    - secretKey: private-key
      remoteRef: {key: platform/findings-github-app, property: private_key}
