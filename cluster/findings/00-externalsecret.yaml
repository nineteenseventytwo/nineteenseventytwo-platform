---
# The exporter's GitHub token (07 Phase 10.4). A fine-grained token scoped to
# nineteenseventytwo-platform with "Code scanning alerts: read" and nothing
# else - it reads the Security tab's open alerts, and could not change them.
# Loaded once by hand: cluster/vault/README.md#findings-exporter.
#
# The exporter re-reads the file on every refresh, so rotating the token is a
# Vault write and, at most, refreshInterval of waiting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: findings-exporter-github
  namespace: findings
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: findings-exporter-github
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform/findings-exporter
        property: github_token
