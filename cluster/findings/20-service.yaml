---
# ClusterIP for the ServiceMonitor. Prometheus is the one client.
apiVersion: v1
kind: Service
metadata:
  name: findings-exporter
  namespace: findings
  labels:
    app.kubernetes.io/name: findings-exporter
spec:
  selector:
    app.kubernetes.io/name: findings-exporter
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
