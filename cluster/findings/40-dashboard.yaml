---
# yamllint disable rule:line-length
# (Generated dashboard JSON; its long lines are PromQL and Markdown.)
#
# The Findings dashboard (07 Phase 10.4), from findings-exporter's metrics.
# Grafana's dashboard sidecar watches every namespace for this label.
# Generated as one JSON document; edit the panels here, or export from
# Grafana and paste back - editable is false so the UI is not where it lives.
apiVersion: v1
kind: ConfigMap
metadata:
  name: findings-dashboard
  namespace: findings
  labels:
    grafana_dashboard: "1"
data:
  findings.json: |
    {
      "uid": "findings",
      "title": "Findings",
      "tags": [
        "security",
        "findings"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "editable": false,
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "How to read this",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 4
          },
          "options": {
            "mode": "markdown",
            "content": "Every finding source in one place (07 Phase 10.4). **Work top to bottom:** anything critical; then Falco (something *happened*) before Kubescape (something *changed*) before Prowler (AWS posture) before Trivy and Checkov (known CVEs and misconfigurations waiting for an upgrade). Age matters as much as count: a high finding open for months is a decision nobody wrote down.\n\nCounts only. Detail lives where it always has: Falco and Kubescape in Slack, Trivy and Checkov in the GitHub Security tab, Prowler in the findings bucket's HTML report. **Check *Source health* first**: a source that stopped refreshing shows yesterday's numbers."
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Critical, all sources",
          "description": "Open critical findings across every source.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(findings_open{severity=\"critical\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "High, all sources",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(findings_open{severity=\"high\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Falco (runtime) now",
          "description": "Active Falco alerts in Alertmanager: something happened on a node in the last 15 minutes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(findings_open{source=\"falco\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Kubescape regressions",
          "description": "Controls with newly failing resources since the accepted list (cluster/kubescape/00-accepted.yaml).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(findings_open{source=\"kubescape\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Sources down",
          "description": "Sources whose last refresh failed. Their counts are stale.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(findings_source_up == 0)",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Prowler report age",
          "description": "Daily scan at 05:00 UTC. Over ~50h means the workflow has stopped.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 4,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - max(findings_source_data_timestamp_seconds{source=\"prowler\"})",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 108000
                  },
                  {
                    "color": "red",
                    "value": 180000
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Open findings by source and severity",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (source, severity) (findings_open)",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "groupingToMatrix",
              "options": {
                "columnField": "severity",
                "rowField": "source",
                "valueField": "Value",
                "emptyValue": "zero"
              }
            },
            {
              "id": "organize",
              "options": {
                "indexByName": {
                  "source\\severity": 0,
                  "critical": 1,
                  "high": 2,
                  "medium": 3,
                  "low": 4,
                  "info": 5,
                  "unknown": 6
                },
                "renameByName": {
                  "source\\severity": "source"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "critical"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "transparent",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "high"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "transparent",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Oldest open finding, by source and severity",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "description": "How long the oldest open finding has been open. Prowler has no per-finding age (a report's timestamps are the scan's).",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - findings_oldest_open_timestamp_seconds{severity=~\"critical|high|medium\"}",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "endpoint": true,
                  "container": true
                },
                "renameByName": {
                  "Value": "open for"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "open for",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Top items: critical and high",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 24,
            "h": 10
          },
          "description": "The rule, control, image or check carrying the most critical and high findings. An image here is usually one chart bump that clears dozens.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(30, sum by (source, severity, item) (findings_open{severity=~\"critical|high\"}))",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "severity": 0,
                  "source": 1,
                  "item": 2,
                  "Value": 3
                },
                "renameByName": {
                  "Value": "open"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "open",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Critical and high over time, by source",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (source) (findings_open{severity=~\"critical|high\"})",
              "refId": "A",
              "legendFormat": "{{source}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 12,
          "type": "table",
          "title": "Source health",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 26,
            "w": 8,
            "h": 8
          },
          "description": "up = last refresh succeeded. Refreshes: Alertmanager 1m, GitHub 15m, Prowler 1h.",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "findings_source_up",
              "refId": "A",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "time() - findings_source_last_success_timestamp_seconds",
              "refId": "B",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "source",
                "mode": "outer"
              }
            },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "source",
                    "Value #A",
                    "Value #B"
                  ]
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "Value #A": "up",
                  "Value #B": "since last success"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "since last success"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "up"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
