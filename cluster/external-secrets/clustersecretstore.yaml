---
# Kubernetes auth: ESO presents its ServiceAccount token, Vault validates it
# against the cluster's TokenReview API and returns a short-lived Vault token.
# No static Vault credential is stored anywhere — which is the whole point, and
# the thing that avoids "Vault credentials in GitHub secrets protecting the
# Vault that holds the credentials".
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "kv"
      version: v2
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
