---
# chart: postfinance/kubelet-csr-approver 1.2.14
# repo:  https://postfinance.github.io/kubelet-csr-approver
#
# Approves kubernetes.io/kubelet-serving CSRs, which kubeadm does not.
# Findings: ../README.md#kubelet-csr-approver
namespace: kubelet-csr-approver

# This cluster's node names and nothing else — console isn't a kubelet (ADR-0007).
providerRegex: "^1972-(master|worker)-[0-9]+$"

providerIpPrefixes:
  - 192.168.20.0/24

# Node hostnames don't resolve on this network; left false every CSR fails.
# See ../README.md#bypassdnsresolution-must-be-true-here
bypassDnsResolution: true

metrics:
  serviceMonitor:
    enabled: true
