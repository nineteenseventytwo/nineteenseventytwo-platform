---
# Nightly Kubescape NSA scan, compared with the accepted list (07 Phase 10.2,
# ADR-0017). One pod, two steps sharing an emptyDir: the `scan` init container
# writes Kubescape's JSON to /scan; `gate` (images/kubescape-gate) diffs it
# with 00-accepted.yaml and alerts once per control with new failures. A
# failed scan or gate fails the Job, so KubeJobFailed fires instead.
# Read-only RBAC (policy/43-kubescape.yaml); why both versions are pinned and
# why host scanning is off: ../README.md#kubescape
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubescape
  namespace: kubescape
  annotations:
    # The same two decisions are accepted on the Kubescape side in
    # 00-accepted.yaml (C-0270, C-0034).
    checkov.io/skip1: "CKV_K8S_11=CPU limits come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip2: "CKV_K8S_38=reading the API server is this workload's whole job"
spec:
  # 03:30 UTC: an hour after the 02:30 Longhorn backup, before anyone is up.
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubescape
        spec:
          serviceAccountName: kubescape
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: scan
              image: quay.io/kubescape/kubescape-cli:v4.0.15@sha256:16f1383351936d4085f9eec4a01a08abe34e531629d2e849d3893aaed2c74052
              args:
                - scan
                - framework
                - nsa
                - --controls-version=v2.0.38
                - --host-scan=false
                - --keep-local
                - --format=json
                - --output=/scan/results.json
                - --logger=warning
                - --cache-dir=/cache
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 768Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: scan, mountPath: /scan}
                - {name: cache, mountPath: /cache}
          containers:
            - name: gate
              image: ghcr.io/nineteenseventytwo/kubescape-gate@sha256:71be0470f38f9052934b11bb45338d94d476146639a78fa7c1ac0c3c5b4f28c1
              env:
                - name: GATE_ALERTMANAGER
                  value: http://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: scan, mountPath: /scan, readOnly: true}
                - {name: accepted, mountPath: /accepted, readOnly: true}
          volumes:
            - name: scan
              emptyDir: {sizeLimit: 64Mi}
            - name: cache
              emptyDir: {sizeLimit: 128Mi}
            - name: accepted
              configMap:
                name: kubescape-accepted
