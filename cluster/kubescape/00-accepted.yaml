# The list images/kubescape-gate compares each nightly scan against
# (07 Phase 10.2, ADR-0017). Mounted into the CronJob at /accepted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubescape-accepted
  namespace: kubescape
