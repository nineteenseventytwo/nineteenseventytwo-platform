    # ADR-0017: a scan is clean when its failures match a reviewed list, not when
    # its score clears a number. images/kubescape-gate compares each nightly scan
    # with this file and alerts, per control, on any pair not listed here.
    #
    # Format: one "C-NNNN namespace/Kind/name" per line ("/Kind/name" for
    # cluster-scoped objects). Hex runs of 8+ in a name are written as "*"
    # (generated names: Longhorn instance-managers, ARC listeners).
    #
    # To accept a new finding, add it in a PR under the control with its reason.
    # Argo syncs the change; the next nightly run reads it.
    # The gate also logs accepted pairs that no longer fail ("stale"): delete
    # those.
    #
    # Snapshot of the 2026-10-27 scan: Kubescape v4.0.15, controls v2.0.38
    # (both pinned in 10-cronjob.yaml; a bump of either is a re-snapshot).

