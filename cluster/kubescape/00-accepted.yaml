    C-0002 /ClusterRoleBinding/argocd-application-controller
    C-0002 /ClusterRoleBinding/cluster-admin   # Kubernetes built-in, binds system:masters
    C-0002 /ClusterRoleBinding/kubeadm:cluster-admins
    C-0002 /ClusterRoleBinding/longhorn-support-bundle
    C-0002 arc-runners/RoleBinding/lab-deploy-gha-rs-kube-mode

