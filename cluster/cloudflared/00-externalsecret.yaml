---
# The tunnel's credential and its config, materialised from Vault
# (kv/platform/cloudflared) into one Secret the Deployment mounts.
#
# The config is templated here rather than stored in Vault whole, so what the
# tunnel can reach - the ingress rules - is reviewed in git. Only the values
# come from Vault:
#   tunnel_id         UUID from `cloudflared tunnel create`
#   credentials_json  the credentials file that command writes
#   access_team       the Zero Trust team name (<team>.cloudflareaccess.com)
#   access_aud        the Access application's AUD tag
# None but credentials_json is secret; keeping them together means one Vault
# write sets the tunnel up, and the IDs never have to be re-derived.
#
# `access.required` makes cloudflared itself reject any request without a
# valid Access JWT for this AUD, before it reaches the origin - the "validated,
# not merely present" check 8.2 asks for (ADR-0021).
#
# Changing the ingress list does not reach the running connector by itself.
# ESO re-renders the Secret as soon as Argo applies the changed spec (a change
# made only in Vault waits for refreshInterval), but cloudflared reads its
# config only at startup. Once the Secret has updated, delete the pod. The
# ReplicaSet replaces it, and nothing Argo manages changes, so selfHeal has
# nothing to fight.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloudflared
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: "{{ .credentials_json }}"
        config.yaml: |
          tunnel: {{ .tunnel_id }}
          credentials-file: /etc/cloudflared/credentials.json
          no-autoupdate: true
          metrics: 0.0.0.0:2000
          ingress:
            - hostname: dash.eightbitsaxlounge.com
              service: http://dash.dash.svc.cluster.local:80
              originRequest:
                access:
                  required: true
                  teamName: {{ .access_team }}
                  audTag: [{{ .access_aud }}]
            - service: http_status:404
  dataFrom:
    - extract:
        key: platform/cloudflared
