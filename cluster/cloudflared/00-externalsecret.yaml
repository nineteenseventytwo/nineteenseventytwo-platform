---
# The tunnel's credential and its config, from Vault (kv/platform/cloudflared)
# into one Secret the Deployment mounts. The config is templated here so the
# ingress rules - what the tunnel can reach - are reviewed in git; only
# tunnel_id, credentials_json, access_team and access_aud come from Vault.
# `access.required` makes cloudflared itself reject a request without a valid
# Access JWT for this AUD (ADR-0021).
# Changing the ingress list needs a pod restart: ../README.md#cloudflared
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloudflared
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: "{{ .credentials_json }}"
        config.yaml: |
          tunnel: {{ .tunnel_id }}
          credentials-file: /etc/cloudflared/credentials.json
          no-autoupdate: true
          metrics: 0.0.0.0:2000
          ingress:
            - hostname: dash.eightbitsaxlounge.com
              service: http://dash.dash.svc.cluster.local:80
              originRequest:
                access:
                  required: true
                  teamName: {{ .access_team }}
                  audTag: [{{ .access_aud }}]
            - service: http_status:404
  dataFrom:
    - extract:
        key: platform/cloudflared
