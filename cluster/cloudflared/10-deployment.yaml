---
# cloudflared - the tunnel connector (07's 8.1, ADR-0021). Dials out to
# Cloudflare's edge; nothing dials in. Its routing is the ingress list in
# 00-externalsecret.yaml, and its network reach is allow-cloudflared-egress in
# policy/10-default-deny.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
  annotations:
    # ADR-0016: requests/limits come from the namespace LimitRange.
    checkov.io/skip1: "CKV_K8S_10=requests come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip2: "CKV_K8S_11=limits come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip3: "CKV_K8S_12=requests come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip4: "CKV_K8S_13=limits come from the namespace LimitRange (ADR-0016)"
spec:
  # One connector. It holds four connections to two edge locations by itself;
  # a second replica protects against a node loss that takes dash down with
  # it anyway.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret volumes are root-owned; fsGroup is what lets uid 65532 read
        # the mounted config at mode 0440.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          # cloudflared 2026.10.3 (multi-arch index). Pinned by digest.
          image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
          imagePullPolicy: IfNotPresent
          args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run"]
          ports:
            - containerPort: 2000
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
          # /ready answers 200 only while at least one edge connection is up,
          # so readiness tracks the tunnel, not just the process.
          readinessProbe:
            httpGet: {path: /ready, port: 2000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
      volumes:
        - name: config
          secret:
            secretName: cloudflared
            defaultMode: 288   # 0440 - yamllint forbids implicit octal
