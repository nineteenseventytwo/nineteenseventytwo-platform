---
# chart: 0.14.2  (gha-runner-scale-set)
#
# Scale sets are defined by CAPABILITY, not by repo. "A runner for whichever
# repo is queueing" is a non-problem once registration is org-scoped — that is
# the whole point of ADR-0001.
#
# lab-deploy: Ansible and kubectl. No docker socket, no dind. This is the
# common case and the least privileged one.
githubConfigUrl: "https://github.com/nineteenseventytwo"
githubConfigSecret: arc-github-app

# The chart's own lookup-based auto-discovery (matching a Deployment by
# app.kubernetes.io/part-of=gha-rs-controller) failed against Argo CD's
# repo-server — confirmed live, reproducible across repeated hard-refreshes,
# not a stale cache. Set explicitly rather than granting repo-server
# broader list RBAC just for this. Matches 80-arc-controller.yaml's
# releaseName (arc-controller) + the chart's fixed SA-name suffix.
controllerServiceAccount:
  name: arc-controller-gha-rs-controller
  namespace: arc-systems

# Scale to zero when idle. On three 2 GB nodes, an idle runner is memory you
# do not have.
minRunners: 0
maxRunners: 3

runnerScaleSetName: lab-deploy

containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    accessModes: [ReadWriteOnce]
    storageClassName: longhorn
    resources:
      requests:
        storage: 4Gi

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0
        command: ["/home/runner/run.sh"]
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 512Mi}
