---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef: {key: platform/github-app, property: app_id}
    - secretKey: github_app_installation_id
      remoteRef: {key: platform/github-app, property: installation_id}
    - secretKey: github_app_private_key
      remoteRef: {key: platform/github-app, property: private_key}
