---
# The shared entry point every app attaches an HTTPRoute to — ingress-nginx's
# replacement (ADR-0015). One Gateway, one LoadBalancer IP, SNI-separated
# listeners. Findings: ../README.md#the-shared-gateway
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  # Pins the LB IP so the OPNsense Unbound overrides stay valid. Goes through
  # an annotation, not spec.addresses — see
  # ../README.md#pinning-the-loadbalancer-ip-goes-through-an-annotation-not-specaddresses
  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: "192.168.20.241"
  listeners:
    # Redirects to HTTPS (10-http-redirect.yaml). No hostname filter — it has
    # to match whatever Host header shows up.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

    # One listener per hostname on 443, separated by SNI. Each app's HTTPRoute
    # attaches by hostname match alone. See ../README.md#one-gateway-one-ip
    - name: argocd-https
      port: 443
      protocol: HTTPS
      hostname: "argocd.eightbitsaxlounge.com" # tracks lab_domain
      tls:
        certificateRefs:
          - name: argocd-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: grafana-https
      port: 443
      protocol: HTTPS
      hostname: "grafana.eightbitsaxlounge.com" # tracks lab_domain
      tls:
        certificateRefs:
          - name: grafana-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: vault-https
      port: 443
      protocol: HTTPS
      hostname: "vault.eightbitsaxlounge.com" # tracks lab_domain
      tls:
        certificateRefs:
          - name: vault-tls
      allowedRoutes:
        namespaces:
          from: All
