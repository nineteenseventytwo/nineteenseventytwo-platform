---
# Replicates ingress-nginx's default force-ssl-redirect behaviour: a plain
# HTTP request to any host gets a 301 to the same path over HTTPS. No
# hostnames field - the http listener it attaches to (00-gateway.yaml) has no
# hostname filter of its own, so this matches whatever Host header arrives,
# the same as the redirect did for every app under the old shared controller.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
