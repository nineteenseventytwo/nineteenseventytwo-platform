---
# Alertmanager's Slack receiver reads this by file path
# (alertmanagerSpec.secrets in values.yaml mounts it, config.receivers'
# api_url_file points at it) rather than the URL appearing in values.yaml
# directly — this repo is public, and a Slack incoming webhook URL is a bearer
# credential: anyone holding it can post into the channel it targets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-alerts
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: slack-alerts
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: platform/slack-alerts
        property: webhook_url
