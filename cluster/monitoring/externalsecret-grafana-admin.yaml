---
# Grafana admin credentials live in Vault, not here — see the secret
# inventory in docs/04-secrets.md. cluster/monitoring/values.yaml points
# grafana.admin.existingSecret at the Secret this materialises; the chart
# reads admin-user/admin-password from it directly, so the key names below
# have to match those exactly, not Vault's own kv/platform/grafana property
# names, which happen to be the same here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana
        property: admin-password
