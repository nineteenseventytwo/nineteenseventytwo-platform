---
# chart: 88.6.2  (kube-prometheus-stack)
# repo:  https://prometheus-community.github.io/helm-charts
#
# The heaviest thing in the cluster by some distance. Everything below is
# trimmed for 2 GB nodes; the defaults will OOM a worker.

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    # retentionSize is enforced only by deleting whole blocks at compaction.
    # The WAL is not retention-managed: it is truncated after head
    # compaction (~2h), so a crash loop or stalled compaction grows it past
    # this number, and a full disk then stops Prometheus starting at all —
    # which is what happened: 8GB on 10Gi left ~2.7GB of slack, the volume
    # filled, and Prometheus crash-looped for about a week on "no space left
    # on device" (2026-10-12 to 2026-10-19). ~70% of the volume, so the WAL
    # has ~7GB to grow into before the disk is the limit.
    retentionSize: 14GB
    # Requests are what the scheduler believes; at 512Mi it believed a
    # Prometheus that really peaks ~820Mi, and put it on worker-2 beside the
    # Argo CD controller and Grafana - all three under-requested, ~2.4Gi of
    # real peak on one node. Worker-2 thrashed (1000+ major page faults/s,
    # NodeMemoryMajorPagesFaults, 2026-10-24) while worker-1 sat 33% free.
    # Request = observed 7-day peak; the limit keeps ~45% headroom over it.
    # (Raising the limit needs monitoring's LimitRange max raised with it.)
    resources:
      requests: {cpu: 200m, memory: 896Mi}
      limits: {memory: 1280Mi}
    # The operator's default startup probe allows 15 minutes (60 x 15s). A
    # large WAL replays slower than that on a Pi — 2026-10-19's took ~12
    # minutes to reach the halfway point — so the kubelet killed it mid-replay,
    # it restarted from scratch, and the WAL never got truncated. 30 minutes
    # lets a long replay finish; a Prometheus that genuinely cannot start
    # still fails, just later.
    maximumStartupDurationSeconds: 1800
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          # Raised from 10Gi with retentionSize above. The live PVC was
          # expanded in place first (Longhorn allows expansion); this keeps
          # a rebuild from recreating the 10Gi volume that filled. The
          # StatefulSet's volumeClaimTemplate is immutable, so on an
          # existing cluster this change alone does not resize anything.
          resources:
            requests:
              storage: 20Gi
    # Pick up ServiceMonitors from every namespace, not just this one — the
    # addons each declare their own.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 60s        # 30s doubles the series count for little gain

alertmanager:
  alertmanagerSpec:
    replicas: 1
    # Its SA is bound to nothing; see ../README.md#alertmanager-holds-a-token-that-grants-nothing
    automountServiceAccountToken: false
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {memory: 128Mi}
    # No control-plane toleration here (unlike prometheusOperator/kube-
    # state-metrics below) — Longhorn's own systemManagedComponentsNode-
    # Selector (cluster/longhorn/values.yaml, "Worker SSDs only") keeps
    # the Longhorn CSI node plugin off 1972-master-1 entirely, so nothing
    # with a Longhorn-backed PVC can ever mount one there:
    #
    #   AttachVolume.Attach failed ...: CSINode 1972-master-1 does not
    #   contain driver driver.longhorn.io
    #
    # This one has storage.volumeClaimTemplate below (storageClassName:
    # longhorn) — added and then reverted the same day (2026-09-11) after
    # the identical mistake genuinely broke grafana (below): a toleration
    # let the scheduler put it on master-1, where it could never attach
    # its PVC, no matter what rollout strategy it used. This CR's own
    # tolerations never actually got exercised before the revert, only
    # because nothing had triggered the operator to reschedule it yet —
    # not because it would have been safe.
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
    # Mounts the ExternalSecret-materialised Secret at
    # /etc/alertmanager/secrets/slack-alerts/ — config.receivers below reads
    # the URL from there by file path (api_url_file), never inline. This repo
    # is public; a Slack incoming webhook URL is a bearer credential anyone
    # holding it can post into the channel it targets with.
    secrets:
      - slack-alerts
  config:
    # 36 PrometheusRules already ship with this chart and were already
    # evaluating — a null receiver meant every one of them fired into
    # nothing, which is worse than no alerting because it looks like it
    # works. group_wait/group_interval/repeat_interval are the chart's own
    # defaults, made explicit rather than left implicit now that this
    # actually sends somewhere a human will see it.
    route:
      receiver: slack-alerts
      group_by: ["namespace", "alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # Meta-alerts that exist to drive Alertmanager, not to be read. The
      # chart's own default route sends *everything* to "null", so it never
      # needed to name them; with slack-alerts as the default receiver, every
      # alert not routed away lands in Slack - and InfoInhibitor did, once
      # alerting started working (2026-10-22): it fires per namespace while
      # any severity=info alert is up there, purely so the chart's inhibit
      # rules can suppress those info alerts. It is doing that job (the
      # CPUThrottlingHigh info alerts were inhibited by it); only its own
      # notification was wrong. The chart's bare inhibit rule meant to silence
      # it (target InfoInhibitor, no source) matches nothing in Alertmanager
      # 0.34, so routing is the fix.
      #
      # Setting `routes` replaces the chart's list, so Watchdog -> null is
      # restated here. When the dead-man's switch exists, Watchdog moves to
      # its receiver instead - it is always firing so that its absence pages.
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      # The chart's default route.routes (untouched above, since we only set
      # route's top-level keys) still ships a Watchdog -> "null" sub-route.
      # Helm replaces receivers wholesale rather than merging list items, so
      # overriding this list without keeping "null" left that sub-route
      # pointing at a receiver that no longer existed — confirmed live via
      # the operator's "undefined receiver \"null\" used in route" error.
      - name: "null"
      - name: slack-alerts
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-alerts/webhook-url
            send_resolved: true
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}*{{ .Labels.severity | toUpper }}*
              ({{ .Labels.namespace }}) {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

grafana:
  enabled: true
  replicas: 1
  # Ahead of the chart: 88.6.2 ships 13.2.0, whose Go stdlib, grpc and
  # x/net carry 273 fixable highs in the image scan; 13.2.4 carries 61.
  # A patch release on the same minor, so no migration. Drop this override
  # when the chart bump catches up (92.x ships 13.2.4) — leaving it would
  # silently pin grafana behind every later chart.
  image:
    tag: "13.2.4"
  # 256Mi OOMKilled under real interactive use (exitCode 137, confirmed live
  # on build 0003) - ran fine for ~10 hours at idle/scrape-only load, then
  # crashed once someone actually opened the UI and browsed dashboards.
  # 512Mi leaves headroom for real session/rendering load; monitoring's own
  # infra-quota had ~1.25Gi free at the time (2816Mi/4Gi used), so this
  # doesn't need a quota bump alongside it.
  # Request raised to the observed peak (~320Mi, 2026-10-24) for the same
  # reason as Prometheus's above: an honest request is what stops the
  # scheduler stacking the heavy pods on one node.
  resources:
    requests: {cpu: 50m, memory: 320Mi}
    limits: {memory: 512Mi}
  # No control-plane toleration (see alertmanager's comment above for why:
  # persistence below is a Longhorn-backed PVC, and Longhorn's CSI node
  # plugin is deliberately absent from 1972-master-1). Briefly added one
  # on 2026-09-11 and it broke grafana live: the scheduler put the new
  # pod on master-1, where it could never attach its volume —
  # "CSINode 1972-master-1 does not contain driver driver.longhorn.io" —
  # leaving grafana with zero running pods until the toleration was
  # reverted and the pod deleted so a fresh one would schedule onto a
  # worker instead.
  #
  # deploymentStrategy stays Recreate even without the toleration: it's
  # still a ReadWriteOnce PVC, so any future cross-worker rescheduling
  # (e.g. a drained/cordoned node) hits the same old-pod-holds-the-volume
  # deadlock already fixed for eightbitsaxlounge-chat. Recreate costs
  # nothing at steady state and removes that class of failure entirely.
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 2Gi
  # ingress-nginx's replacement. The Gateway itself already carries the
  # cert-manager annotation and owns the grafana-tls Certificate
  # (cluster/gateway/00-gateway.yaml) - nothing to duplicate here.
  route:
    main:
      enabled: true
      hostnames: ["grafana.eightbitsaxlounge.com"]   # tracks lab_domain
      parentRefs:
        - name: gateway
          namespace: gateway
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
  # Stateless, no PVC — unlike grafana/alertmanager above, this one has
  # nothing that could hit Longhorn's CSI-driver-absent-on-master-1 wall,
  # so the toleration is safe. Confirmed live 2026-09-11: rescheduled onto
  # 1972-master-1 immediately once Recreate below removed the quota
  # blocker, no issues.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
      operator: Exists
  # infra-quota's limits.memory is at its 4Gi hard cap with zero headroom
  # (see grafana's comment above) — RollingUpdate's surge pod is flatly
  # quota-rejected. No PVC on this one, but the quota problem alone is
  # enough reason.
  strategy:
    type: Recreate

nodeExporter:
  enabled: true
prometheus-node-exporter:
  # hostNetwork/hostPID/hostPath/hostPort — genuinely privileged, and the rest
  # of this namespace deliberately isn't (pod-security.kubernetes.io/enforce:
  # baseline on monitoring). node-exporter-system carries the privileged
  # label instead (policy/00-namespaces.yaml); Prometheus already reaches it
  # fine since it's scraped by host IP, not namespace (see
  # allow-prometheus-scrape-egress in policy/10-default-deny.yaml).
  namespaceOverride: node-exporter-system
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 64Mi}

kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 128Mi}
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule
      operator: Exists
  # Same infra-quota headroom problem as prometheusOperator/grafana above.
  # This subchart's own key: a plain string, not {type: Recreate} like the
  # others — confirmed against its actual deployment.yaml template
  # (`strategy.type: {{ .Values.updateStrategy | default "RollingUpdate"
  # }}`), since `strategy:`/`deploymentStrategy:` are silently ignored here.
  updateStrategy: Recreate

# kubeadm puts these on 127.0.0.1 by default; the ClusterConfiguration in
# kube_control_plane binds them to 0.0.0.0 so these scrape targets work.
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true
kubeEtcd:
  enabled: true
kubeProxy:
  # kube-proxy was removed from this cluster 2026-09-01
  # (docs/03-cluster.md's kube-proxy-replacement migration) - there is no
  # longer a target for this ServiceMonitor to scrape.
  enabled: false
