---
# sshd. Password auth is already off from cloud-init; this makes it enforced
# state rather than first-boot state, and adds the CA hook for Phase D.
hardening_ssh_port: 22
hardening_ssh_allow_users:
  - "{{ admin_user }}"
hardening_ssh_ca_key_path: /etc/ssh/ca.pub
# Trust certificates signed by Vault's ssh-client-signer CA (bootstrap/ssh/ca.pub)
# in addition to authorized_keys, which this never disables on its own.
#
# Phase A state for build 0003 (REBUILD.md step 0.7): false, until the new
# Vault exists and issues a new CA in Phase E. Reset here after build 0002
# left this true on main — the previous build's own ca.pub belongs to a Vault
# that no longer exists once the cluster is re-imaged, and step 0.7 requires
# both flags false at the start of a build, not just this one. See
# ../../../README.md#the-ca-cutover-and-why-main-is-not-a-state-a-rebuild-can-start-from
hardening_ssh_trust_ca: true

# Reconciles authorized_keys to exactly hardening_ssh_authorized_keys, so
# certificates become the only way in. Flipping back to false does not restore
# the old keys.
#
# Phase A state for build 0003 (REBUILD.md step 0.7): false. Flip true again,
# in its own PR, only in Phase E once the new CA is proven working both ways —
# see ../../../README.md#the-ca-cutover-and-why-main-is-not-a-state-a-rebuild-can-start-from
hardening_ssh_retire_legacy_keys: false
hardening_ssh_authorized_keys: []

# ufw. The firewall between VLANs is OPNsense's job; this is defence in depth
# on the node itself, and it is what stops a compromised pod from reaching a
# neighbour's sshd.
hardening_ufw_enabled: true
hardening_ufw_default_incoming: deny
hardening_ufw_default_outgoing: allow

# Only true where ansible itself runs from a container on the target host
# (console, via the runner_host compose stack) — see the task comment.
hardening_ufw_allow_docker_bridge_ssh: false

# Kubernetes control plane and node ports, per the upstream port requirements.
hardening_ufw_cluster_rules:
  - { port: "6443", proto: tcp, comment: "kube-apiserver" }
  - { port: "2379:2380", proto: tcp, comment: "etcd" }
  - { port: "10250", proto: tcp, comment: "kubelet API" }
  - { port: "10256", proto: tcp, comment: "kube-proxy health" }
  - { port: "30000:32767", proto: tcp, comment: "NodePort range" }
  - { port: "4240", proto: tcp, comment: "cilium health" }
  - { port: "4244", proto: tcp, comment: "hubble peer service" }
  - { port: "8472", proto: udp, comment: "cilium vxlan" }
  - { port: "51871", proto: udp, comment: "cilium wireguard" }
  - { port: "7946", proto: tcp, comment: "metallb memberlist" }
  - { port: "7946", proto: udp, comment: "metallb memberlist" }

# lab_subnet covers node-to-node. The pod CIDR is here for the same-node
# hairpin, which ufw ate silently — see
# ../../../README.md#why-the-pod-cidr-is-an-allowed-source-for-the-cluster-ports
hardening_ufw_cluster_sources:
  - "{{ lab_subnet }}"
  - "{{ kubernetes_pod_cidr }}"

hardening_sysctls:
  # Standard network hardening. Note ip_forward is deliberately absent here —
  # kube_prereqs sets it to 1 on cluster nodes and would fight this role.
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv6.conf.all.accept_redirects: 0
  # Carried over from /etc/ufw/sysctl.conf, which this role disables.
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv6.conf.all.accept_source_route: 0
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1

# Split out because the kernel takes max(conf.all, conf.<iface>), so a non-zero
# `all` silently promotes Cilium's own interfaces to strict mode and breaks pod
# networking on a *running* cluster. Cluster nodes get 0 on `all`.
# See ../../../README.md#rp_filter-has-to-be-split-out-and-cluster-nodes-need-0-on-all
hardening_sysctls_rp_filter:
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 2

hardening_sysctls_rp_filter_cluster:
  net.ipv4.conf.all.rp_filter: 0
  net.ipv4.conf.default.rp_filter: 2
