---
- name: Install the hardened sshd drop-in
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  notify: Restart sshd

# Phase D. Nodes trust the Vault SSH CA instead of a list of keys: no
# authorized_keys drift, revocation that works, and an audit trail.
- name: Install the SSH CA public key
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../bootstrap/ssh/ca.pub"
    dest: "{{ hardening_ssh_ca_key_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: hardening_ssh_trust_ca | bool
  notify: Restart sshd

- name: Apply sysctl hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-hardening.conf
    sysctl_set: true
    state: present
    reload: true
  loop: >-
    {{ (hardening_sysctls | combine(
          hardening_sysctls_rp_filter_cluster
          if (kubelet_node | default(false))
          else hardening_sysctls_rp_filter)) | dict2items }}
  loop_control:
    label: "{{ item.key }}"
  become: true

- name: Configure ufw
  when: hardening_ufw_enabled | bool
  become: true
  block:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present

    # ufw re-applies /etc/ufw/sysctl.conf every time it reloads, which lands
    # after this role's own sysctl task and silently wins. Its file sets
    # log_martians=0, so the log_martians: 1 above was never actually in
    # effect — and because ansible re-set it on every run only for ufw to
    # revert it again, `Apply sysctl hardening` reported changed forever,
    # which is precisely the signal that would otherwise reveal drift.
    # Emptying IPT_SYSCTL makes this role the single owner of sysctls; the
    # settings ufw was contributing are folded into hardening_sysctls so
    # nothing is lost.
    - name: Stop ufw from managing sysctls
      ansible.builtin.lineinfile:
        path: /etc/default/ufw
        regexp: '^IPT_SYSCTL='
        line: "IPT_SYSCTL="
        backrefs: false

    - name: Set default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: "{{ hardening_ufw_default_incoming }}" }
        - { direction: outgoing, policy: "{{ hardening_ufw_default_outgoing }}" }

    # SSH from the workstation VLAN only. VLAN 20 -> VLAN 10 is blocked at
    # OPNsense; this is the reciprocal restriction on the node itself.
    - name: Allow SSH from the workstation subnet
      community.general.ufw:
        rule: allow
        src: "{{ workstation_subnet }}"
        port: "{{ hardening_ssh_port }}"
        proto: tcp
        comment: "ssh from VLAN 10"

    # make publish-oidc, make kubeconfig's own kubectl smoke-checks, and
    # anything else run directly on the workstation (as opposed to via the
    # containerized ansible-runner, which reaches the API server over SSH from
    # inside the lab subnet and never needed this) talk to the apiserver
    # straight from VLAN 10. Scoped to just this one port rather than folded
    # into hardening_ufw_cluster_rules/_sources, which would also open etcd,
    # kubelet, and the whole Cilium mesh to the workstation for no reason —
    # none of those are ever dialled from outside the lab subnet.
    - name: Allow the workstation to reach the apiserver directly
      community.general.ufw:
        rule: allow
        src: "{{ workstation_subnet }}"
        port: "6443"
        proto: tcp
        comment: "kube-apiserver from VLAN 10"
      when: kubelet_node | default(false)

    - name: Allow SSH from the console node
      community.general.ufw:
        rule: allow
        src: "{{ hostvars['1972-console-1'].ansible_host }}"
        port: "{{ hardening_ssh_port }}"
        proto: tcp
        comment: "ansible from 1972-console-1"

    # Ansible runs inside a container on console's own docker bridge here, so
    # a play against console is a hairpin connection back to the same host.
    # Docker's hairpin NAT does not reliably rewrite the source to console's
    # LAN address for that case, so sshd sees the container's bridge IP
    # instead — which matches neither allow rule above. 172.16.0.0/12 covers
    # Docker's whole classic bridge range rather than one exact subnet, so
    # this does not quietly break again if the configured address pool
    # (docker role, default-address-pools) ever actually takes effect and the
    # live subnet shifts.
    - name: Allow SSH from the docker bridge range
      community.general.ufw:
        rule: allow
        src: "172.16.0.0/12"
        port: "{{ hardening_ssh_port }}"
        proto: tcp
        comment: "ansible hairpin from consoles runner containers"
      when: hardening_ufw_allow_docker_bridge_ssh | default(false)

    # Intra-VLAN 20 traffic is switch-local — OPNsense never sees it. Node
    # isolation here and NetworkPolicy in-cluster are the only controls that do.
    - name: Allow cluster ports between lab nodes
      community.general.ufw:
        rule: allow
        src: "{{ item.0 }}"
        port: "{{ item.1.port }}"
        proto: "{{ item.1.proto }}"
        comment: "{{ item.1.comment }}"
      loop: "{{ hardening_ufw_cluster_sources | product(hardening_ufw_cluster_rules) | list }}"
      loop_control:
        label: "{{ item.1.comment }} {{ item.1.port }}/{{ item.1.proto }} from {{ item.0 }}"
      when: kubelet_node | default(false)

    # Cilium programs its own eBPF datapath and pod traffic must not be
    # filtered by ufw's FORWARD chain.
    - name: Allow forwarding for pod traffic
      community.general.ufw:
        rule: allow
        route: true
        src: "{{ kubernetes_pod_cidr }}"
      when: kubelet_node | default(false)

    - name: Enable ufw
      community.general.ufw:
        state: enabled
