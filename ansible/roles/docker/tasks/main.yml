---
- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# deb822_repository needs this to parse/write DEB822-format sources — a real
# dependency apt_repository never had. Declared explicitly rather than
# assumed present.
- name: Install python3-debian, required by deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: Install the Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  become: true

# The predecessor of this task (apt_repository) wrote docker.list, a
# one-line-format file; deb822_repository writes docker.sources and has no
# awareness of that older file. Leaving both in place defines the same
# repository twice, which recent apt versions treat as an error rather than
# a redundancy — remove the legacy file rather than let the two coexist.
- name: Remove the legacy one-line Docker apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

# apt speaks dpkg architecture names — amd64, arm64, armhf — while
# ansible_facts.architecture reports the kernel's: x86_64, aarch64. The
# expression here used to special-case aarch64 -> arm64 and pass everything
# else through unchanged, which was right for every host this estate had,
# because all of them are arm64 (ADR-0011).
#
# The first x86_64 host it met was the GPU host, and it wrote
# `Architectures: x86_64` into docker.sources. apt has no such architecture,
# matched nothing in the repository, and said so as:
#
#     No package matching 'docker-ce' is available
#
# which reads like a missing package rather than a malformed source — the
# repository was added successfully, it just described an architecture that
# does not exist.
#
# Ask dpkg instead of extending the mapping. It is the tool that consumes the
# answer, so it cannot disagree with it, and a lookup table would need a new
# entry for the next architecture rather than already being correct. arm64
# hosts are unaffected: dpkg returns arm64 there, which is what the old
# expression produced.
- name: Read the dpkg architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: docker_dpkg_architecture
  changed_when: false
  check_mode: false

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/ubuntu"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: ["{{ docker_dpkg_architecture.stdout }}"]
    signed_by: /etc/apt/keyrings/docker.asc
  become: true

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  become: true

# The conditional combine matters: an unconditional one would write
# `"runtimes": {}` on every host that has no extra runtimes, marking this task
# changed and restarting docker across the whole cluster to add an empty
# object. Written this way, a host with no extras gets exactly what it got
# before.
- name: Configure the Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | combine({'runtimes': docker_extra_runtimes} if docker_extra_runtimes else {}) | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart docker

# Three separate proxy configs are needed when Squid is enforced: the shell
# environment, the docker *daemon* (systemd drop-in, not /etc/environment), and
# containerd. Missing the daemon one is the classic "docker pull hangs but curl
# works" afternoon.
- name: Configure egress proxy for the Docker daemon
  when: egress_proxy_enabled | bool
  become: true
  block:
    - name: Ensure the docker service drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the docker daemon proxy drop-in
      ansible.builtin.template:
        src: proxy.conf.j2
        dest: /etc/systemd/system/docker.service.d/proxy.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart docker

    - name: Write the shell environment proxy settings
      ansible.builtin.template:
        src: environment-proxy.sh.j2
        dest: /etc/profile.d/10-egress-proxy.sh
        owner: root
        group: root
        mode: "0644"

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  become: true

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true
  become: true
