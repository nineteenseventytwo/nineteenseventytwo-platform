---
- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# deb822_repository needs this to parse/write DEB822-format sources — a real
# dependency apt_repository never had. Declared explicitly rather than
# assumed present.
- name: Install python3-debian, required by deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: Install the Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  become: true

# The predecessor of this task (apt_repository) wrote docker.list, a
# one-line-format file; deb822_repository writes docker.sources and has no
# awareness of that older file. Leaving both in place defines the same
# repository twice, which recent apt versions treat as an error rather than
# a redundancy — remove the legacy file rather than let the two coexist.
- name: Remove the legacy one-line Docker apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/ubuntu"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_facts.architecture == 'aarch64' else ansible_facts.architecture }}"]
    signed_by: /etc/apt/keyrings/docker.asc
  become: true

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  become: true

- name: Configure the Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart docker

# Three separate proxy configs are needed when Squid is enforced: the shell
# environment, the docker *daemon* (systemd drop-in, not /etc/environment), and
# containerd. Missing the daemon one is the classic "docker pull hangs but curl
# works" afternoon.
- name: Configure egress proxy for the Docker daemon
  when: egress_proxy_enabled | bool
  become: true
  block:
    - name: Ensure the docker service drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the docker daemon proxy drop-in
      ansible.builtin.template:
        src: proxy.conf.j2
        dest: /etc/systemd/system/docker.service.d/proxy.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart docker

    - name: Write the shell environment proxy settings
      ansible.builtin.template:
        src: environment-proxy.sh.j2
        dest: /etc/profile.d/10-egress-proxy.sh
        owner: root
        group: root
        mode: "0644"

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  become: true

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true
  become: true
