---
- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_facts.architecture == 'aarch64' else ansible_facts.architecture }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present
  become: true

- name: Install Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  become: true

- name: Configure the Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart docker

# Three separate proxy configs are needed when Squid is enforced: the shell
# environment, the docker *daemon* (systemd drop-in, not /etc/environment), and
# containerd. Missing the daemon one is the classic "docker pull hangs but curl
# works" afternoon.
- name: Configure egress proxy for the Docker daemon
  when: egress_proxy_enabled | bool
  become: true
  block:
    - name: Ensure the docker service drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write the docker daemon proxy drop-in
      ansible.builtin.template:
        src: proxy.conf.j2
        dest: /etc/systemd/system/docker.service.d/proxy.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart docker

    - name: Write the shell environment proxy settings
      ansible.builtin.template:
        src: environment-proxy.sh.j2
        dest: /etc/profile.d/10-egress-proxy.sh
        owner: root
        group: root
        mode: "0644"

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  become: true

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
    daemon_reload: true
  become: true
