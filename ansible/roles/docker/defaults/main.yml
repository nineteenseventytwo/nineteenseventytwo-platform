---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Extra container runtimes to register with the daemon. Empty everywhere but
# the GPU host, which needs nvidia — see group_vars/gpu.yml for why it is
# declared as data here rather than applied with `nvidia-ctk runtime
# configure`. An empty dict produces byte-identical daemon.json to before, so
# no existing host sees a change.
docker_extra_runtimes: {}

docker_users:
  - "{{ admin_user }}"

# An unbounded log-driver is how you fill a Pi's SSD overnight — a disk risk,
# independent of how much RAM the host has.
docker_daemon_options:
  log-driver: "json-file"
  log-opts:
    max-size: "20m"
    max-file: "3"
  live-restore: true
  default-address-pools:
    # Keep docker's bridges out of the lab subnet and the pod CIDR.
    - base: "172.31.0.0/16"
      size: 24
