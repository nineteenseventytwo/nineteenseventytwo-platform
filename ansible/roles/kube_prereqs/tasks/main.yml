---
# Memory cgroups are enabled by cloud-init at first boot. If a node was imaged
# some other way, fail loudly here rather than letting the kubelet fail with a
# message that does not mention cgroups.
- name: Assert memory cgroups are enabled
  ansible.builtin.assert:
    that:
      - ansible_facts.cmdline.get('cgroup_enable', '') == 'memory'
      - ansible_facts.cmdline.get('cgroup_memory', '') == '1'
    fail_msg: >-
      Memory cgroups are not enabled on {{ inventory_hostname }}. Append
      `cgroup_enable=memory cgroup_memory=1` to /boot/firmware/cmdline.txt
      (one line, no wrapping) and reboot. kubelet will not start without it.
    success_msg: "memory cgroups enabled"
  when: kubelet_node | default(false)

- name: Assert swap is off
  ansible.builtin.assert:
    that:
      - ansible_facts.swaptotal_mb | int == 0
    fail_msg: >-
      Swap is still enabled on {{ inventory_hostname }}. The `common` role masks
      swap.target; re-run it and reboot. kubelet refuses to start with swap on.
  when: kubelet_node | default(false)

- name: Load required kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ kube_prereqs_required_modules }}"
  become: true

- name: Persist required kernel modules
  ansible.builtin.template:
    src: modules-k8s.conf.j2
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Apply Kubernetes sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ kube_prereqs_required_sysctls | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  become: true

- name: Ensure the apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# deb822_repository needs this to parse/write DEB822-format sources — a real
# dependency apt_repository never had. Present on both real host types
# already (Ubuntu 24.04's own base image), but declared explicitly rather
# than assumed, same lesson as the containerd.io fix just above: an
# undeclared cross-task dependency is exactly what broke that one.
- name: Install python3-debian, required by deb822_repository
  ansible.builtin.apt:
    name: python3-debian
    state: present
  become: true

- name: Install the Kubernetes apt key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    owner: root
    group: root
    mode: "0644"
  become: true

# The predecessor of this task (apt_repository) wrote kubernetes.list, a
# one-line-format file; deb822_repository writes kubernetes.sources and has
# no awareness of that older file. Leaving both in place defines the same
# repository twice, which recent apt versions treat as an error rather than
# a redundancy — remove the legacy file rather than let the two coexist.
- name: Remove the legacy one-line Kubernetes apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent
  become: true

# suites: ["/"] with no components is the DEB822 form of the old repo line's
# trailing "/" — a "flat" repository, where the URI is the complete path and
# there is no separate distribution/component structure to declare.
- name: Add the Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/"
    suites: ["/"]
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.asc
  become: true

# containerd.io is a Docker-packaged build, not Debian's own `containerd` —
# the pkgs.k8s.io repo above doesn't carry it either. The `docker` role adds
# this same repo, but only on hosts: cicd (it installs the full docker-ce
# daemon + CLI + buildx + compose, none of which a cluster node wants); this
# role needs the repo on its own rather than depending on a sibling role
# having already run on a different host group.
- name: Install the Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Remove the legacy one-line Docker apt source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/ubuntu"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_facts.architecture == 'aarch64' else ansible_facts.architecture }}"]
    signed_by: /etc/apt/keyrings/docker.asc
  become: true

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name: "{{ kube_prereqs_packages }}"
    state: present
    update_cache: true
  become: true

- name: Hold the Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true

- name: Ensure the config and drop-in directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/containerd
    - /etc/containerd/certs.d
    - /etc/systemd/system/containerd.service.d
    - /etc/systemd/system/kubelet.service.d
  become: true

- name: Configure containerd
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart containerd

- name: Configure the containerd egress proxy
  ansible.builtin.template:
    src: containerd-proxy.conf.j2
    dest: /etc/systemd/system/containerd.service.d/proxy.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: egress_proxy_enabled | bool
  notify: Restart containerd

# Reserved memory keeps a runaway pod from evicting the kubelet on a 2 GB node.
- name: Configure kubelet resource reservations
  ansible.builtin.template:
    src: kubelet-reserved.conf.j2
    dest: /etc/systemd/system/kubelet.service.d/20-reserved.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart kubelet

- name: Enable containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
  become: true
