---
# containerd comes from the Docker repo (containerd.io), already added by the
# `docker` role. Cluster nodes get containerd configured for the kubelet even
# though dockerd itself is not what runs pods.
kube_prereqs_packages:
  - kubelet
  - kubeadm
  - kubectl
  - containerd.io
  - open-iscsi     # Longhorn
  - nfs-common     # Longhorn RWX

kube_prereqs_required_modules:
  - overlay
  - br_netfilter

kube_prereqs_required_sysctls:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1

kube_prereqs_kubelet_system_reserved_memory: "256Mi"
kube_prereqs_kubelet_kube_reserved_memory: "256Mi"
kube_prereqs_kubelet_eviction_hard_memory: "150Mi"
