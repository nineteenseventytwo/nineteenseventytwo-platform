---
# The GPU host: an Ansible-managed Linux box on VLAN 20 that serves inference
# to the cluster. Not a cluster node — see the inventory's `gpu` group and
# ADR-0011.

# Pinned by digest, like every other image this repo runs. A tag means
# something different each week, and the weekly vulnerability scan cannot say
# anything useful about a moving target.
#
# ollama/ollama 0.34.4, resolved 2026-09-24. The index carries linux/amd64 and
# linux/arm64; this host is amd64.
gpu_host_ollama_image: "docker.io/ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551"

# The model composer asks for. Provisional: D-C defers the choice to a bake-off
# on this hardware, because the 8 GB card is the binding constraint and a
# laptop's unified memory cannot stand in for it.
gpu_host_model: "llama3.1:8b"

# Where model weights live. Several at 4–8 GB each, so not on the root
# filesystem by accident.
gpu_host_data_dir: /var/lib/ollama

# Ollama's own port, published on loopback only — and deliberately **not**
# 11434. The proxy below is what owns 11434, on every interface, because that
# is the port the cluster is already configured to call (composer's
# LLM_BASE_URL and its NetworkPolicy egress rule both name it). Giving Ollama
# the same number put two listeners on it: docker-proxy on 127.0.0.1:11434 and
# Caddy on 0.0.0.0:11434. Linux resolves that by most-specific match, so a
# loopback request reached Ollama *directly* and skipped the proxy entirely —
# which is what this playbook's own verification tasks do, so the control they
# exist to prove was never on the path being tested.
gpu_host_ollama_port: 11435

# The port the cluster actually talks to.
gpu_host_proxy_port: 11434
# caddy 2.11.4-alpine, resolved 2026-09-24.
gpu_host_proxy_image: "docker.io/library/caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b"

# Only the cluster nodes may ask for inference. Narrow by address rather than
# by subnet: this path has no firewall in front of it (see tasks/main.yml).
gpu_host_allowed_clients:
  - 192.168.20.202
  - 192.168.20.203
  - 192.168.20.204

# The interface the DHCP reservation is keyed on. Defaults to whatever carries
# the default route, which is the one that has to land on 192.168.20.210.
gpu_host_dhcp_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"

gpu_host_nvidia_ctk_keyring: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
