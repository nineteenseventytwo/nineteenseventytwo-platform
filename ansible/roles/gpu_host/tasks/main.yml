---
# Prepares the PC's Linux boot to serve inference.
#
# Salvaged from the composer repo's infra/ansible/playbooks/setup-gpu-node.yaml
# before that directory was deleted:
#   git show 7e8390c:infra/ansible/playbooks/setup-gpu-node.yaml
# The driver and container-toolkit tasks below are that file's, kept because
# they were working and there is no virtue in rewriting them. What is dropped
# is everything that joined the host to the cluster — kubeadm, the kubelet, the
# device plugin, the node label — because D1(b) decided the host stays outside
# it and ADR-0011 depends on that staying true.

# ADR-0011 and D-A both turn on this host not being a cluster node, and the
# role was written for that: the salvaged playbook's kubeadm, kubelet, device
# plugin and node label were all dropped. But *not joining* is not the same as
# *undoing*, and the host was surveyed on 2026-09-24 still carrying the remains
# of the abandoned GPU-worker attempt — kubelet, kubeadm, kubectl and cri-tools
# installed, the kubelet unit enabled, and the pkgs.k8s.io v1.35 apt repo still
# configured while the cluster runs 1.37.
#
# It had never joined anything: /etc/kubernetes held nothing but an empty
# manifests/, so the kubelet sat in `activating (auto-restart)` failing with
# exit 1 every few seconds, and had done since boot. Harmless in effect, wrong
# in kind. The single property this host must have is that it is provably not a
# node, and "there is a kubelet, it is enabled, and it is trying" is not that.
# Nor is the stale apt repo, which puts node packages back on the next
# `apt upgrade`. Removing them is part of preparing the host, not tidying it.
- name: Remove the remains of any cluster-join attempt
  when: ansible_os_family == "Debian"
  block:
    # Guarded rather than `failed_when: false`: on a host that never had a
    # kubelet the systemd module errors on the unit not existing, and
    # swallowing that would also swallow a genuine failure to stop a running
    # one — which is the case that matters here.
    - name: Check for a kubelet unit
      ansible.builtin.stat:
        path: /usr/lib/systemd/system/kubelet.service
      register: gpu_host_kubelet_unit

    - name: Stop and disable the kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: stopped
        enabled: false
      when: gpu_host_kubelet_unit.stat.exists

    # autoremove is deliberately off. With `state: absent` the apt module
    # applies it system-wide, not just to these packages' own dependencies,
    # and this is a desktop with a graphical session — cri-tools is named
    # explicitly instead so the removal stays exactly as wide as it says.
    - name: Purge the cluster-node packages
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
          - cri-tools
        state: absent
        purge: true
        autoremove: false

    - name: Remove the kubernetes apt repository
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent

    - name: Remove the kubernetes configuration directory
      ansible.builtin.file:
        path: /etc/kubernetes
        state: absent

- name: Install the NVIDIA driver
  when: ansible_os_family == "Debian"
  block:
    - name: Install ubuntu-drivers-common
      ansible.builtin.apt:
        name: ubuntu-drivers-common
        state: present
        update_cache: true

    # Ask whether the driver works, rather than whether apt thinks it is
    # installed. That is the property this role actually needs, it is
    # self-healing when a kernel update breaks the module, and it is the only
    # test that does not reboot a working host.
    #
    # `ubuntu-drivers autoinstall` cannot be run unconditionally. It prints no
    # string meaning "nothing to do" — verified on the host, its output when
    # the driver is already present is three lines about *not* restarting
    # anything — so the previous `'already installed' not in stdout` was
    # always true. Worse, it creates /var/run/reboot-required on every run
    # whether or not it changed anything, which the next task then acted on.
    # The two together rebooted the GPU host on every converge: inference down
    # for ~70s and the model evicted from VRAM, to change a ufw rule.
    - name: Check whether a working NVIDIA driver is already present
      ansible.builtin.command:
        cmd: nvidia-smi --query-gpu=driver_version --format=csv,noheader
      register: gpu_host_driver_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Auto-install the recommended NVIDIA driver
      ansible.builtin.command:
        cmd: ubuntu-drivers autoinstall
      when: gpu_host_driver_check.rc != 0
      changed_when: true

    - name: Check whether the driver install needs a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: gpu_host_reboot_required
      when: gpu_host_driver_check.rc != 0

    # Both conditions, not just the flag. /var/run/reboot-required is written
    # by unattended-upgrades and any other package that wants one, so acting
    # on it alone would let an unrelated kernel update reboot an inference
    # host in the middle of a converge that had no business touching it.
    - name: Reboot if the driver install requires it
      ansible.builtin.reboot:
        reboot_timeout: 300
      when:
        - gpu_host_driver_check.rc != 0
        - gpu_host_reboot_required.stat.exists | default(false)

- name: Install the NVIDIA container toolkit
  when: ansible_os_family == "Debian"
  block:
    - name: Fetch the NVIDIA container toolkit signing key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /tmp/nvidia-ctk-gpgkey.asc
        mode: "0644"

    - name: Dearmor the NVIDIA signing key
      ansible.builtin.command:
        cmd: "gpg --dearmor -o {{ gpu_host_nvidia_ctk_keyring }} /tmp/nvidia-ctk-gpgkey.asc"
        creates: "{{ gpu_host_nvidia_ctk_keyring }}"

    # The salvaged version piped curl into sed into tee. Written as a file
    # instead: the repository line is a known constant, so fetching it at run
    # time only made the task depend on the network twice and defeated
    # --check. It also carried an unpipefailed pipe, where a failed curl would
    # have written an empty sources file and the apt install would then have
    # failed somewhere less obvious.
    - name: Add the NVIDIA container toolkit repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        mode: "0644"
        content: |
          deb [signed-by={{ gpu_host_nvidia_ctk_keyring }}] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /

    - name: Install the NVIDIA container toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true
      notify: Restart docker

# Written, deliberately not applied. `netplan apply` renews the lease, and the
# address it renews *to* is the one this play is connected over — so applying
# it here would cut the connection mid-converge, on the one task whose whole
# purpose is to change which address the host answers on. It takes effect on
# the next boot, which for a host that is rebooted for the driver install a few
# tasks from now is not a wait.
#
# This cannot fix a host that is currently in the pool, because Ansible reaches
# it at the address it is not yet using. Getting there the first time is a
# manual step. What this does is stop it drifting back after a reinstall, and
# say in the tree why the setting exists at all.
# Renamed from 99-dhcp-identifier.yaml once it grew a second setting that has
# nothing to do with DHCP. netplan reads every file in the directory, so the
# old one left behind would still be applied — and would still be declaring
# this interface, from a filename describing only half of what it does.
- name: Remove the superseded netplan drop-in
  ansible.builtin.file:
    path: /etc/netplan/99-dhcp-identifier.yaml
    state: absent

- name: Configure the interface for DHCP identity and wake-on-LAN
  ansible.builtin.template:
    src: 99-gpu-host.yaml.j2
    dest: /etc/netplan/99-gpu-host.yaml
    owner: root
    group: root
    # netplan warns, loudly and on every invocation, about world-readable
    # configuration.
    mode: "0600"

- name: Create the model cache directory
  ansible.builtin.file:
    path: "{{ gpu_host_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Ollama binds to loopback only. Everything the cluster sees goes through the
# proxy, because Ollama has no authentication and its API includes model
# management: anything that can reach it can POST /api/pull and DELETE
# /api/delete, not merely run inference. Exposing the port would expose the
# admin surface with it.
- name: Run Ollama, bound to loopback
  community.docker.docker_container:
    name: ollama
    image: "{{ gpu_host_ollama_image }}"
    state: started
    restart_policy: unless-stopped
    device_requests:
      - driver: nvidia
        count: -1
        capabilities: [[gpu]]
    published_ports:
      - "127.0.0.1:{{ gpu_host_ollama_port }}:11434"
    volumes:
      - "{{ gpu_host_data_dir }}:/root/.ollama"

# The container being "started" is not the same as Ollama's HTTP server
# answering, and the pull below goes through that server. On a fresh host the
# gap is real, and losing the race surfaces as a connection refused from inside
# `docker exec` — which reads like a broken image rather than a timing problem.
- name: Wait for Ollama to answer
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ gpu_host_ollama_port }}"
    timeout: 60

# `ollama pull` prints per-layer progress whether or not it had to fetch
# anything, so its output cannot distinguish a no-op from a 5 GB download — the
# previous `'already exists' not in stdout` test reported changed on every
# converge, which is the signal that would otherwise show real drift. Ask what
# is already resident instead. check_mode: false because this reads and changes
# nothing, and without it a dry run leaves the register undefined and fails the
# next task's `when` rather than the task it was asking about.
- name: List the models already present
  ansible.builtin.command:
    cmd: docker exec ollama ollama list
  register: gpu_host_model_list
  changed_when: false
  check_mode: false

- name: Pull the model
  ansible.builtin.command:
    cmd: "docker exec ollama ollama pull {{ gpu_host_model }}"
  when: gpu_host_model not in gpu_host_model_list.stdout
  changed_when: true

# The template task below writes into this directory and will not create it
# — ansible.builtin.template fails outright on a missing parent rather than
# creating one, which is the behaviour you want from it and the reason this
# task has to exist.
- name: Create the proxy configuration directory
  ansible.builtin.file:
    path: /etc/ollama-proxy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the proxy configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/ollama-proxy/Caddyfile
    mode: "0644"
  notify: Restart ollama proxy

- name: Run the inference proxy
  community.docker.docker_container:
    name: ollama-proxy
    image: "{{ gpu_host_proxy_image }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - /etc/ollama-proxy/Caddyfile:/etc/caddy/Caddyfile:ro

# ⚠️ The host firewall is one of only two controls on this path. The cluster
# nodes (192.168.20.202-204) and this host (192.168.20.210) are all on VLAN 20,
# so the traffic is switch-local: OPNsense never sees it and no firewall rule
# there can constrain it (docs/01-network-validation.md, test 11). The other
# control is composer's NetworkPolicy. There is no third layer.
#
# Which is why the install and the enable below are not housekeeping. Ubuntu
# ships ufw but leaves it inactive, and adding a rule does not activate it — so
# without these, the deny at the end of this block was written to /etc/ufw and
# never enforced. The claim above would have been false in exactly the
# direction that matters: one control, not two, and nothing to say so.
#
# The `hardening` role does this for cluster nodes, and the composer standup
# plan's P2 said to apply it here too. It is deliberately not in
# 40-gpu-host.yml: it also reconciles authorized_keys to
# hardening_ssh_authorized_keys, which is empty, leaving the Vault SSH CA as
# the only way in. That is right for a headless Pi Ansible owns outright. On a
# dual-boot desktop that spends half its life in Windows it is a lockout
# waiting for the next CA rotation, and the machine is not always sitting where
# someone can walk to it. So this role owns its own firewall, narrowly.
#
# This filters what it is meant to only because the proxy runs with
# `network_mode: host` — its listener is an ordinary host socket and traverses
# ufw's INPUT chain. Docker's own iptables rules bypass ufw for *published*
# ports, so moving the proxy to `published_ports` would silently take this
# whole block off the path.
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}

# Before `Enable ufw`, not after. Default-deny incoming takes effect the moment
# ufw comes up, and Ansible is connected over this very port — enabling first
# would cut the play's own transport and leave the host unreachable until
# someone booted it to Windows or attached a keyboard.
- name: Allow SSH from the workstation subnet
  community.general.ufw:
    rule: allow
    src: "{{ workstation_subnet }}"
    port: "22"
    proto: tcp
    comment: "ssh from VLAN 10"

- name: Allow SSH from the console node
  community.general.ufw:
    rule: allow
    src: "{{ hostvars['1972-console-1'].ansible_host }}"
    port: "22"
    proto: tcp
    comment: "ansible from 1972-console-1"

- name: Allow inference only from the cluster nodes
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ gpu_host_proxy_port }}"
    proto: tcp
  loop: "{{ gpu_host_allowed_clients }}"

- name: Deny inference from anywhere else
  community.general.ufw:
    rule: deny
    port: "{{ gpu_host_proxy_port }}"
    proto: tcp

- name: Enable ufw
  community.general.ufw:
    state: enabled
