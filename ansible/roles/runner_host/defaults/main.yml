---
runner_host_home: /opt/github-runner
runner_host_image: "{{ gha_runner_image }}:{{ runner_host_image_tag }}"
# The gha-runner image's own version, read from images/gha-runner/version.txt
# rather than repeated here — a hardcoded copy drifted and shipped a runner
# with no vault CLI. Deliberately pinned, not :stable.
# See ../../../README.md#the-runner-image-tag-is-read-from-versiontxt-not-repeated
runner_host_image_tag: "{{ lookup('file', playbook_dir + '/../../images/gha-runner/version.txt') | trim }}"
# AppRole credentials for sign-ci.sh, plus ansible-console's *public* key.
# Deliberately not ~/.ssh — see
# ../../../README.md#the-vault-ci-directory-is-not-ssh-on-purpose
runner_host_vault_ci_dir: "{{ runner_host_home }}/vault-ci"
runner_host_ephemeral: true
runner_host_replicas: 2
runner_host_scope: org
runner_host_user: github-runner
runner_host_labels:
  - self-hosted
  - linux
  - arm64
  - lab-network
runner_host_mount_docker_socket: true

# Runners hold no durable state (§3.1). The only thing worth persisting is a
# buildx cache directory, and even that is optional — the registry-backed cache
# is the real answer.
runner_host_workdir: /opt/github-runner/_work
