---
- name: Create the unprivileged runner user
  ansible.builtin.user:
    name: "{{ runner_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ runner_home }}"
    create_home: true
  become: true

# Socket mount is approximately root on the host. The dedicated unprivileged
# user narrows what a compromised job sees on disk; it does not narrow what it
# can do through the socket. ADR-0006 says so plainly, and ARC dind is the exit.
- name: Add the runner user to the docker group
  ansible.builtin.user:
    name: "{{ runner_user }}"
    groups: docker
    append: true
  become: true
  when: runner_mount_docker_socket | bool

- name: Create the runner directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "0750"
  loop:
    - "{{ runner_home }}"
    - "{{ runner_workdir }}"
  become: true

# The GitHub App private key replaces hand-pasted registration tokens, which
# expire after an hour and are why the old script took two of them as arguments.
# The container mints its own token at start; no human in the loop.
- name: Install the GitHub App private key
  ansible.builtin.copy:
    content: "{{ github_app_private_key }}"
    dest: "{{ runner_home }}/github-app.pem"
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "0400"
  become: true
  no_log: true
  notify: Restart runner stack

- name: Render the runner compose stack
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ runner_home }}/compose.yml"
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "0640"
  become: true
  notify: Restart runner stack

- name: Render the runner environment file
  ansible.builtin.template:
    src: runner.env.j2
    dest: "{{ runner_home }}/runner.env"
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "0640"
  become: true
  no_log: true
  notify: Restart runner stack

- name: Install the systemd unit for the runner stack
  ansible.builtin.template:
    src: github-runner.service.j2
    dest: /etc/systemd/system/github-runner.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart runner stack

- name: Enable the runner stack
  ansible.builtin.systemd:
    name: github-runner
    enabled: true
    state: started
    daemon_reload: true
  become: true
