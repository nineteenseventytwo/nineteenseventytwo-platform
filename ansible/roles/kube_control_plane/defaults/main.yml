---
kube_control_plane_kubeconfig: /etc/kubernetes/admin.conf
kube_control_plane_encryption_key_path: /etc/kubernetes/enc/encryption-config.yaml
kube_control_plane_admission_config_path: /etc/kubernetes/admission/admission-config.yaml

# 30-cluster.yml's kubernetes.core.helm_repository/helm tasks (Cilium) run on
# hosts: control_plane and shell out to a real `helm` binary on the target —
# nothing installs one there. Same version images/ansible-runner/Dockerfile
# pins, so the CLI driving these tasks and the CLI actually running them agree.
kube_control_plane_helm_version: v4.2.3

# Lets kubernetes.core.helm diff against the live release instead of falling
# back to its own cruder idempotency check (the source of the "install helm
# diff >= 3.4.1 for better results" warning on every Cilium run).
kube_control_plane_helm_diff_version: v3.15.11

# Pod Security Standards, enforced at admission for every namespace that does
# not opt out with labels. `baseline` cluster-wide with `restricted` warnings
# is the setting that catches problems without breaking Longhorn and Cilium,
# both of which legitimately need privileged pods.
kube_control_plane_pss_default_enforce: baseline
kube_control_plane_pss_default_audit: restricted
kube_control_plane_pss_default_warn: restricted
kube_control_plane_pss_exempt_namespaces:
  - kube-system
  - cilium-secure
  - longhorn-system
  - metallb-system
