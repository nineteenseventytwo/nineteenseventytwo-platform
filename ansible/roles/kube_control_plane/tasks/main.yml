---
# ---------------------------------------------------------------------------
# The service-account issuer is fixed at `kubeadm init` and cannot be changed
# afterwards without rebuilding the control plane and invalidating every
# projected token in the cluster. Both checks below exist because that mistake
# is silent: the cluster comes up perfectly and IRSA simply never works, and by
# the time you notice, the fix is a rebuild.
# ---------------------------------------------------------------------------
- name: Assert the OIDC issuer is well formed before it becomes permanent
  ansible.builtin.assert:
    that:
      - cluster_oidc_issuer is defined
      - cluster_oidc_issuer is string
      - cluster_oidc_issuer.startswith('https://')
      - not cluster_oidc_issuer.endswith('/')
      - cluster_oidc_audience is defined
    fail_msg: >-
      cluster_oidc_issuer must be a plain https:// URL with no trailing slash
      (got: {{ cluster_oidc_issuer | default('undefined') }}). AWS compares the
      issuer character for character against the discovery document, and a
      trailing slash produces an invalid-token error that says nothing about
      URLs. This is baked in permanently at kubeadm init — fix it now, not
      after. See docs/06-aws-federation.md.
    quiet: true

- name: Create the control plane config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /etc/kubernetes/enc
    - /etc/kubernetes/admission
  become: true

- name: Generate an etcd encryption key
  ansible.builtin.set_fact:
    kube_control_plane_etcd_encryption_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}"
  when: kube_control_plane_etcd_encryption_key is not defined
  no_log: true

- name: Check whether etcd encryption is already configured
  ansible.builtin.stat:
    path: "{{ kube_control_plane_encryption_key_path }}"
  register: kube_control_plane_encryption_stat
  become: true

- name: Write the etcd encryption config
  ansible.builtin.template:
    src: encryption-config.yaml.j2
    dest: "{{ kube_control_plane_encryption_key_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  when: not kube_control_plane_encryption_stat.stat.exists
  no_log: true

- name: Write the PSS admission config
  ansible.builtin.template:
    src: admission-config.yaml.j2
    dest: "{{ kube_control_plane_admission_config_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Write the kubeadm config
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Check whether the control plane is already initialised
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kube_control_plane_admin_conf_stat
  become: true

# If the control plane already exists, kubeadm init is skipped and the
# rendered config above is inert — so a changed issuer would sit in git looking
# applied while the running cluster still trusts the old one. Catch that here
# rather than in an AccessDenied six months later.
- name: Read the issuer of the running control plane
  ansible.builtin.shell:
    cmd: >-
      grep -oP '(?<=--service-account-issuer=)\S+'
      /etc/kubernetes/manifests/kube-apiserver.yaml || true
  register: kube_control_plane_running_issuer
  changed_when: false
  become: true
  when: kube_control_plane_admin_conf_stat.stat.exists

- name: Assert the running issuer still matches the configured one
  ansible.builtin.assert:
    that:
      - kube_control_plane_running_issuer.stdout | trim == cluster_oidc_issuer
    fail_msg: >-
      This control plane was initialised with service-account-issuer
      '{{ kube_control_plane_running_issuer.stdout | trim | default("<unset>", true) }}'
      but the inventory now asks for '{{ cluster_oidc_issuer }}'. Ansible will
      NOT change this — the issuer is fixed at kubeadm init. Reconcile the two
      deliberately: either restore the inventory value, or accept that changing
      it means tearing down and rebuilding the control plane, which invalidates
      every projected service-account token and every IAM role trust policy
      built on the old issuer. See docs/06-aws-federation.md.
    quiet: true
  when: kube_control_plane_admin_conf_stat.stat.exists

- name: Run kubeadm init
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs
  become: true
  when: not kube_control_plane_admin_conf_stat.stat.exists
  register: kube_control_plane_kubeadm_init
  changed_when: kube_control_plane_kubeadm_init.rc == 0

- name: Install kubeconfig for the admin user
  become: true
  block:
    - name: Create the .kube directory
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.kube"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"

    - name: Copy admin.conf into place
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ admin_user }}/.kube/config"
        remote_src: true
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"

- name: Fetch the kubeconfig to the controller
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../../build/kubeconfig"
    flat: true
  become: true
  tags: [kubeconfig]

# 30-cluster.yml's "Container network interface" play runs
# kubernetes.core.helm_repository/helm against this same host right after this
# role finishes — those modules are thin wrappers around a real `helm` binary
# on the target, not something the ansible-runner container's own helm
# satisfies. kube_prereqs_packages never included it (helm isn't in Debian's
# or Kubernetes' apt repos under that name), so nothing has ever put one here.
#
# Same story one level down: kubernetes.core.k8s_info/k8s (used later in
# 30-cluster.yml — waiting for Cilium, waiting for nodes, applying baseline
# policy) are Python modules that execute *on this host*, and need the
# `kubernetes` Python library present here to even import, independent of
# whatever's inside the ansible-runner container running the playbook itself.
- name: Install python3-kubernetes, required by kubernetes.core modules
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present
  become: true

- name: Check the installed helm version
  ansible.builtin.command:
    cmd: helm version --short
  register: kube_control_plane_helm_check
  changed_when: false
  failed_when: false
  tags: [cni]

- name: Install helm
  when: kube_control_plane_helm_version not in (kube_control_plane_helm_check.stdout | default(''))
  become: true
  tags: [cni]
  block:
    - name: Download and extract helm
      ansible.builtin.unarchive:
        src: >-
          https://get.helm.sh/helm-{{ kube_control_plane_helm_version }}-linux-{{
          'arm64' if ansible_facts.architecture == 'aarch64' else ansible_facts.architecture }}.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install the helm binary
      ansible.builtin.copy:
        src: >-
          /tmp/linux-{{ 'arm64' if ansible_facts.architecture == 'aarch64' else ansible_facts.architecture }}/helm
        dest: /usr/local/bin/helm
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Clean up the extracted archive
      ansible.builtin.file:
        path: >-
          /tmp/linux-{{ 'arm64' if ansible_facts.architecture == 'aarch64' else ansible_facts.architecture }}
        state: absent

# Without this, kubernetes.core.helm falls back to a cruder idempotency check
# and reports every Cilium release as changed whether or not it actually is.
- name: Check the installed helm-diff plugin version
  ansible.builtin.command:
    cmd: helm plugin list
  register: kube_control_plane_helm_diff_check
  changed_when: false
  failed_when: false
  become: true
  tags: [cni]

- name: Install the helm-diff plugin
  when: kube_control_plane_helm_diff_version.lstrip('v') not in (kube_control_plane_helm_diff_check.stdout | default(''))
  become: true
  tags: [cni]
  block:
    - name: Remove any existing helm-diff plugin
      ansible.builtin.command:
        cmd: helm plugin uninstall diff
      failed_when: false
      changed_when: true

    # helm-diff's GitHub releases carry no provenance file, and helm 4
    # verifies plugin sources by default — without --verify=false this fails
    # with "plugin source does not support verification".
    - name: Install the pinned helm-diff plugin
      ansible.builtin.command:
        cmd: >-
          helm plugin install https://github.com/databus23/helm-diff
          --version {{ kube_control_plane_helm_diff_version }} --verify=false
      changed_when: true

- name: Generate a worker join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  become: true
  register: kube_control_plane_kubeadm_join
  changed_when: false
  no_log: true

- name: Publish the join command to the workers
  ansible.builtin.set_fact:
    kube_control_plane_kube_join_command: "{{ kube_control_plane_kubeadm_join.stdout }}"
  no_log: true
