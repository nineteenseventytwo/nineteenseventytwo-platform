[defaults]
inventory            = inventory/lab
roles_path           = roles
collections_path     = ~/.ansible/collections
host_key_checking    = True
retry_files_enabled  = False
# community.general.yaml was removed in community.general 12.0.0; the builtin
# default callback's result_format=yaml option has replaced it since 2.13.
stdout_callback      = default
callback_result_format = yaml
callbacks_enabled    = profile_tasks, timer
interpreter_python   = /usr/bin/python3
forks                = 8
# Nodes are 2 GB Pis; fact caching keeps repeated runs off their CPUs.
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = /tmp/.ansible_facts
fact_caching_timeout = 3600
# No vault_password_file: this repo uses SOPS+age, not ansible-vault. An empty
# value here resolves to this file's own directory as the "password file" and
# ansible-core 2.21 fails hard on that, whereas the same empty setting under
# older ansible-core was harmlessly ignored — leave the key out entirely.
# SOPS-encrypted group_vars are decrypted by the community.sops vars plugin.
vars_plugins_enabled = host_group_vars,community.sops.sops

[inventory]
enable_plugins = yaml, ini
unparsed_is_failed = True

[ssh_connection]
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
control_path = /tmp/.ansible-cp-%%h-%%p-%%r

[privilege_escalation]
become        = False
become_method = sudo
