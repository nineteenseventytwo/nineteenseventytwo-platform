---
kubelet_node: false
longhorn_node: false

runner_host_ephemeral: true
runner_host_replicas: 2
runner_host_scope: "org"
runner_host_labels:
  - self-hosted
  - linux
  - arm64
  - lab-network

runner_host_mount_docker_socket: true
runner_host_user: "github-runner"

# Ansible runs against this host from inside its own runner containers —
# see the hardening role's task comment for why that needs a dedicated rule.
hardening_ufw_allow_docker_bridge_ssh: true

console_memory_guard_mb: 2048

# The one key that survives the CA cutover. errors='ignore' is load-bearing:
# this is evaluated on every run regardless of hardening_ssh_retire_legacy_keys,
# so a plain lookup() would hard-fail every console run until a break-glass key
# existed. It also means a missing file empties console's authorized_keys too —
# cat the file, do not trust this comment, before retiring legacy keys.
# See ../../../README.md#the-ca-cutover-and-why-main-is-not-a-state-a-rebuild-can-start-from
hardening_ssh_authorized_keys: >-
  {{ [lookup('file', playbook_dir + '/../../bootstrap/ssh/break-glass.pub', errors='ignore')]
     | select('string') | reject('equalto', '') | list }}
