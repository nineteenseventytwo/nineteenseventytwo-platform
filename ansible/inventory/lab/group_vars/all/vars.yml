---
# Lab-wide variables. Anything secret goes in secrets.sops.yml alongside this
# file (SOPS+age, decrypted by the community.sops vars plugin at run time).

ansible_user: mchellmer
admin_user: mchellmer

# ---------------------------------------------------------------------------
# Network — VLAN 20. Must agree with the OPNsense config; see
# docs/01-network-validation.md for the tests that prove it.
# ---------------------------------------------------------------------------
lab_vlan_id: 20
lab_subnet: "192.168.20.0/24"
lab_prefix_length: 24
lab_gateway: "192.168.20.1"
lab_dns:
  - "192.168.20.1"          # Unbound on OPNsense
lab_mtu: 1500
lab_dhcp_pool: "192.168.20.100-192.168.20.199"
lab_metallb_pool: "192.168.20.240-192.168.20.250"

# Node fqdn is `{{ inventory_hostname }}.lab_domain`. The cluster's own tool
# hostnames are hand-written, not templated from this — changing it means
# editing both places. See ../../../../README.md#lab_domain-is-not-templated-into-the-cluster-values
lab_domain: "eightbitsaxlounge.com"

lab_timezone: "Europe/London"
lab_locale: "en_GB.UTF-8"

# VLAN 10 — your workstation side. Referenced by the hardening role's ufw rules
# so SSH is reachable from the workstation and nowhere else.
workstation_subnet: "192.168.10.0/24"

# ---------------------------------------------------------------------------
# GitHub / registry
# ---------------------------------------------------------------------------
github_org: "nineteenseventytwo"
registry: "ghcr.io/nineteenseventytwo"

ansible_runner_image: "{{ registry }}/ansible-runner"
gha_runner_image: "{{ registry }}/gha-runner"

# ---------------------------------------------------------------------------
# AWS federation. Mirrors nineteenseventytwo-cloud/config/aws.json, the source
# of truth. No credential appears here or anywhere in this repo.
#
# cluster_oidc_issuer is a ONE-WAY DOOR — baked into the API server at
# `kubeadm init`. See ../../../../README.md#cluster_oidc_issuer-is-a-one-way-door
# and docs/06-aws-federation.md.
# ---------------------------------------------------------------------------
cluster_oidc_issuer: "https://oidc.{{ lab_domain }}"
cluster_oidc_audience: "sts.amazonaws.com"

aws_region: "eu-west-2"
aws_account_platform_prod: "972034964468"

# Roles created by live/aws/platform-prod once publish_cluster_oidc is on.
# These are ARNs, not secrets — they go on ServiceAccount annotations in
# cluster/*/values.yaml, and the trust policy on the far side is what decides.
aws_cluster_role_arns:
  vault_unseal: "arn:aws:iam::{{ aws_account_platform_prod }}:role/cluster/cluster-vault-unseal"
  longhorn_backup: "arn:aws:iam::{{ aws_account_platform_prod }}:role/cluster/cluster-longhorn-backup"
  prowler: "arn:aws:iam::{{ aws_account_platform_prod }}:role/cluster/cluster-prowler"

# S3 bucket the cluster publishes its OIDC discovery documents into, and the
# bucket Longhorn writes volume backups to. Names are derived in the cloud repo
# as <org>-<purpose>-<account id>; kept literal here so `make publish-oidc`
# does not need Terraform on the workstation.
aws_jwks_bucket: "nineteenseventytwo-oidc-{{ aws_account_platform_prod }}"
aws_longhorn_bucket: "nineteenseventytwo-longhorn-backups-{{ aws_account_platform_prod }}"

# ---------------------------------------------------------------------------
# Versions. Pinned so replaying an old commit does what it did then.
# ---------------------------------------------------------------------------
# Minor only — this is also the apt repo URL component.
kubernetes_version: "1.37"
# Trivy-scan the image before raising this. 1.37.0 has had no patch release yet;
# the previous pin sat at 1.36.4 rather than .0 for Go stdlib CVEs.
kubernetes_version_patch: "0"
# Pinned rather than left to kubeadm's version map, which lags the release and
# falls back with only a warning. One patch ahead of kubeadm's default.
# See ../../../../README.md#etcd-is-pinned-because-kubeadms-version-map-lags-the-release
etcd_version: "3.7.1-0"
containerd_version: "latest"
# Must match cluster/cilium/values.yaml's `# chart:` and 00-cilium.yaml's
# targetRevision. This one is what 30-cluster.yml installs pre-Argo.
# See ../../../../README.md#ciliums-version-lives-in-three-places-and-they-must-agree
cilium_version: "1.20.1"

# Cilium replaces Flannel, so pick a pod CIDR that does not collide with the
# lab subnet or with Cilium's default cluster-pool.
kubernetes_pod_cidr: "10.244.0.0/16"
kubernetes_service_cidr: "10.96.0.0/12"
kubernetes_apiserver_extra_sans:
  - "kubernetes.{{ lab_domain }}"
  - "1972-master-1.{{ lab_domain }}"

# Only affects a from-scratch build; cluster/cilium/values.yaml is what drives
# the live cluster. See ../../../../README.md#cilium_kube_proxy_replacement-only-matters-for-a-from-scratch-build
cilium_kube_proxy_replacement: true

# ---------------------------------------------------------------------------
# Egress proxy. Not enforced yet, but written down so Phase B does not fight it
# when it is. Three separate configs are needed when this flips on: shell env,
# the docker daemon, and containerd. See the `docker` role.
# ---------------------------------------------------------------------------
egress_proxy_enabled: false
egress_proxy_url: "http://192.168.20.1:3128"
egress_proxy_no_proxy:
  - "localhost"
  - "127.0.0.1"
  - "{{ lab_subnet }}"
  - "{{ kubernetes_pod_cidr }}"
  - "{{ kubernetes_service_cidr }}"
  - ".{{ lab_domain }}"
