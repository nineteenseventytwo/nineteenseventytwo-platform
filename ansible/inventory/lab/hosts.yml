---
# The lab: four Raspberry Pis on VLAN 20 (switch ports 5-8, PVID 20).
#
# This file is the single source of truth for hostnames, addresses and roles.
# bootstrap/cloud-init/render.sh reads it, the playbooks read it, and the
# network test matrix reads it. Change an address here and nowhere else.
#
# Addressing authority is OPNsense/Kea (ADR-0009). The `ansible_host` values
# below must match the Kea reservations; they are not what assigns them.
# DHCP pool  .100-.199   reservations .201-.204   MetalLB .240-.250

all:
  children:

    # ---------------------------------------------------------------------
    # Bootstrap node. Builds the cluster, so it is deliberately not in it.
    # RPi 4 / 1 GB — will not take a kubelet plus a runner. ADR-0007.
    # ---------------------------------------------------------------------
    cicd:
      hosts:
        1972-console:
          ansible_host: 192.168.20.201
          mac_eth0: "d8:3a:dd:8e:2d:d7"
          pi_model: "rpi4"
          # RPi 4 boots from USB only if the EEPROM BOOT_ORDER says so.
          # Verify with `rpi-eeprom-config` BEFORE retiring the SD card.
          requires_eeprom_boot_order: true

    # ---------------------------------------------------------------------
    # Kubernetes cluster. RPi 5 / 2 GB each.
    # ---------------------------------------------------------------------
    cluster:
      children:
        control_plane:
          hosts:
            1972-master-1:
              ansible_host: 192.168.20.202
              mac_eth0: "d8:3a:dd:eb:19:52"
              pi_model: "rpi5"
        workers:
          hosts:
            1972-worker-1:
              ansible_host: 192.168.20.203
              mac_eth0: "2c:cf:67:40:d6:92"
              pi_model: "rpi5"
            1972-worker-2:
              ansible_host: 192.168.20.204
              mac_eth0: "2c:cf:67:40:d7:a1"
              pi_model: "rpi5"

    # ---------------------------------------------------------------------
    # Windows host for the eightbitsaxlounge midi-api. Not a cluster node.
    # Sits on a tagged trunk: VLAN 10 when booted to Windows, VLAN 20 when
    # booted to Linux. Only the Windows side is in scope here.
    # ---------------------------------------------------------------------
    midi:
      hosts:
        1972-midi-pc:
          ansible_host: 192.168.10.50
          ansible_user: mchel
          ansible_connection: ssh
          ansible_shell_type: powershell
          ansible_become: false

    # ---------------------------------------------------------------------
    # x86 GPU node. Scaffolded and intentionally empty — ADR-0008.
    # Populating this group makes multi-arch image builds mandatory the same
    # day, so it is a deliberate decision, not a config edit.
    # ---------------------------------------------------------------------
    gpu:
      hosts: {}
