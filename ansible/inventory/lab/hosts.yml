---
# The lab: four Raspberry Pis on VLAN 20 (switch ports 5-8, PVID 20).
#
# This file is the single source of truth for hostnames, addresses and roles.
# bootstrap/cloud-init/render.sh reads it, the playbooks read it, and the
# network test matrix reads it. Change an address here and nowhere else.
#
# Addressing authority is OPNsense/Kea (ADR-0009). The `ansible_host` values
# below must match the Kea reservations; they are not what assigns them.
# DHCP pool  .100-.199   reservations .201-.204   MetalLB .240-.250

all:
  children:

    # ---------------------------------------------------------------------
    # Bootstrap node. Builds the cluster, so it is deliberately not in it —
    # see ADR-0007. RPi 5 / 2 GB / SSD, same hardware as the cluster nodes;
    # kept out for architectural reasons (circular bootstrap dependency), not
    # resource scarcity.
    # ---------------------------------------------------------------------
    cicd:
      hosts:
        1972-console-1:
          ansible_host: 192.168.20.201
          mac_eth0: "98:fe:54:0a:10:59"
          pi_model: "rpi5"

    # ---------------------------------------------------------------------
    # Kubernetes cluster. RPi 5 / 2 GB each.
    # ---------------------------------------------------------------------
    cluster:
      children:
        control_plane:
          hosts:
            1972-master-1:
              ansible_host: 192.168.20.202
              mac_eth0: "d8:3a:dd:eb:19:52"
              pi_model: "rpi5"
        workers:
          hosts:
            1972-worker-1:
              ansible_host: 192.168.20.203
              mac_eth0: "2c:cf:67:40:d6:92"
              pi_model: "rpi5"
            1972-worker-2:
              ansible_host: 192.168.20.204
              mac_eth0: "2c:cf:67:40:d7:a1"
              pi_model: "rpi5"

    # ---------------------------------------------------------------------
    # One PC, two boots, two groups.
    #
    # Ethernet is VLAN 20 at 192.168.20.210 in **both** boots; Wi-Fi is
    # VLAN 10. The previous entry here said 192.168.10.50 and described the
    # VLAN as following the boot — both wrong since the addressing was fixed
    # after the eightbitsaxlounge migration, and wrong in a way that mattered:
    # the eightbitsaxlounge midi manifests have always pointed at
    # 192.168.20.210, so this file disagreed with the cluster about where the
    # host is.
    #
    # Windows serves the eightbitsaxlounge midi device service; Linux serves
    # inference. They are mutually exclusive by boot, which is accepted — the
    # two are used at different times.
    # ---------------------------------------------------------------------
    midi:
      hosts:
        1972-midi-pc:
          ansible_host: 192.168.20.210
          ansible_user: mchel
          ansible_connection: ssh
          ansible_shell_type: powershell
          ansible_become: false

    # ---------------------------------------------------------------------
    # The same PC, booted to Linux, serving inference for composer.
    #
    # **Not a cluster node, and populating this group does not make it one.**
    # ADR-0011 stands: no kubelet, no cluster workloads scheduled here, so no
    # multi-arch obligation. The earlier comment warned that filling this group
    # made multi-arch mandatory "the same day" — true of a host that runs
    # cluster workloads, which this is not. It is an Ansible-managed host that
    # happens to serve HTTP on VLAN 20, the same relationship the cluster has
    # with OPNsense or the console Pi.
    #
    # It must not inherit group_vars/cluster.yml, which sets kubelet_node and
    # the kube prereqs — that would install a kubelet with nothing to join.
    # ---------------------------------------------------------------------
    gpu:
      hosts:
        1972-gpu-1:
          ansible_host: 192.168.20.210
          ansible_user: mchellmer
