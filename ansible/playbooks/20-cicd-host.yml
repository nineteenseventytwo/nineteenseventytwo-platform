---
# Stand up the runner stack on 1972-console-1.
#
#   make deploy-cicd
#
# Runners are org-scoped, App-authenticated and ephemeral (§3.1, §3.4). Nothing
# durable lives in a runner: state is git, the registry, and the secrets store.
- name: Configure the CI/CD host
  hosts: cicd
  gather_facts: true

  pre_tasks:
    - name: Fail early if the GitHub App credentials are missing
      ansible.builtin.assert:
        that:
          - github_app_client_id is defined
          - github_app_installation_id is defined
          - github_app_private_key is defined
        fail_msg: >-
          github_app_client_id / github_app_installation_id /
          github_app_private_key are not all set. They live in
          ansible/inventory/lab/group_vars/all/secrets.sops.yml — copy the
          .example, fill it in, and `sops --encrypt --in-place` it.
          See docs/02-cicd.md.

  roles:
    - role: docker
      tags: [docker]
    - role: runner_host
      tags: [runner]

  tasks:
    # console -> nodes, non-interactive. Generated on the console and never
    # checked in; that is the whole reason it is generated here and not
    # rendered from a template.
    #
    # group: docker, mode: 0640, not owner-only. deploy-nodes.yml /
    # deploy-cluster.yml mount this key by host path into the ansible-runner
    # container from *inside* the containerized self-hosted runner — a sibling
    # container spawned over the shared docker socket, not a process running
    # as admin_user. That sibling gets --group-add <docker gid> (Makefile), so
    # group-readable is what actually lets CI use this key at all. Docker-group
    # membership already means root-equivalent host control on its own
    # (trivial via `docker run --privileged`), so this doesn't hand out
    # meaningfully more than that group already implies.
    - name: Generate the ansible-console SSH key
      community.crypto.openssh_keypair:
        path: "/home/{{ admin_user }}/.ssh/ansible-console"
        type: ed25519
        comment: "ansible-console"
        owner: "{{ admin_user }}"
        group: docker
        mode: "0640"
      become: true
      register: console_key
      tags: [ssh]

    - name: Read the console public key
      ansible.builtin.slurp:
        src: "/home/{{ admin_user }}/.ssh/ansible-console.pub"
      become: true
      register: console_pubkey
      tags: [ssh]

    # sign-ci.sh runs *inside* the runner container, which does not mount
    # /home/{{ admin_user }}/.ssh and should not — it only ever needs the
    # public half to hand Vault for signing. Copying it into the mounted
    # credential directory is what makes the private key's absence from that
    # container a non-issue rather than a blocker.
    #
    # Skipped under --check: the runner_host role only *simulates* creating
    # the destination directory in check mode, so this copy would fail with
    # "Destination directory does not exist" — a dry-run artifact, not a real
    # problem. Check mode cannot meaningfully validate a copy into a directory
    # it also did not create, so it reports nothing here rather than a red
    # failure that means nothing.
    - name: Publish the console public key for the runner container
      ansible.builtin.copy:
        src: "/home/{{ admin_user }}/.ssh/ansible-console.pub"
        dest: "{{ runner_host_vault_ci_dir }}/ansible-console.pub"
        remote_src: true
        owner: "{{ runner_host_user }}"
        group: "{{ runner_host_user }}"
        mode: "0444"
      become: true
      when: not ansible_check_mode
      tags: [ssh]

- name: Authorise the console key on every node
  hosts: cicd:cluster
  gather_facts: false
  tags: [ssh]
  tasks:
    - name: Install the console public key
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ hostvars['1972-console-1'].console_pubkey.content | b64decode }}"
        state: present
        comment: "ansible-console"
      become: true
