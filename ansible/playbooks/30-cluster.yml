---
# Build the cluster. Everything after `kubeadm init` is a Helm release with a
# values file in cluster/, reconciled by Argo CD — see docs/03-cluster.md.
#
#   make deploy-cluster
#
# Build order (§4.2):
#   kube_prereqs -> kubeadm init -> Cilium -> join workers -> default-deny
- name: Kubernetes prerequisites
  hosts: cluster
  gather_facts: true
  roles:
    - role: kube_prereqs
      tags: [prereqs]

- name: Control plane
  hosts: control_plane
  gather_facts: true
  roles:
    - role: kube_control_plane
      tags: [control-plane, kubeconfig]

# Cilium goes on before the workers join so they come up with a working
# datapath rather than sitting NotReady while you wonder what broke.
- name: Container network interface
  hosts: control_plane
  gather_facts: false
  tags: [cni]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Add the Cilium Helm repository
      kubernetes.core.helm_repository:
        name: cilium
        repo_url: https://helm.cilium.io/
      become: true

    - name: Install Cilium
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        chart_version: "{{ cilium_version }}"
        release_namespace: kube-system
        values_files:
          - "{{ playbook_dir }}/../../cluster/cilium/values.yaml"
        # kube-proxy replacement needs the API server address explicitly,
        # because it cannot be reached through a Service that does not exist
        # yet. Standard mode first is a supported migration path (§4.3).
        values: >-
          {{
            {
              'k8sServiceHost': hostvars['1972-master-1'].ansible_host,
              'k8sServicePort': 6443,
              'kubeProxyReplacement': cilium_kube_proxy_replacement,
              'ipam': {'operator': {'clusterPoolIPv4PodCIDRList': [kubernetes_pod_cidr]}},
            }
          }}
        wait: true
        wait_timeout: 10m
      become: true

- name: Join the workers
  hosts: workers
  gather_facts: true
  roles:
    - role: kube_worker
      tags: [join]

- name: Baseline cluster policy
  hosts: control_plane
  gather_facts: false
  tags: [policy]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Wait for every node to become Ready
      kubernetes.core.k8s_info:
        kind: Node
      register: cluster_nodes
      until: >-
        cluster_nodes.resources | length == groups['cluster'] | length and
        cluster_nodes.resources
          | map(attribute='status.conditions')
          | map('selectattr', 'type', 'equalto', 'Ready')
          | map('map', attribute='status')
          | map('first')
          | reject('equalto', 'True') | list | length == 0
      retries: 30
      delay: 10
      become: true

    # Default-deny in every namespace
    - name: Apply baseline policy
      kubernetes.core.k8s:
        state: present
        src: "{{ item }}"
      loop: "{{ query('fileglob', playbook_dir + '/../../policy/*.yaml') | sort }}"
      become: true

    - name: Apply tenant namespaces, quotas and RBAC
      kubernetes.core.k8s:
        state: present
        src: "{{ item }}"
      loop: "{{ query('fileglob', playbook_dir + '/../../policy/tenants/*.yaml') | sort }}"
      become: true
