---
# Build the cluster. Everything after `kubeadm init` is a Helm release with a
# values file in cluster/, reconciled by Argo CD — see docs/03-cluster.md.
#
#   make deploy-cluster
#
# Build order (§4.2):
#   kube_prereqs -> kubeadm init -> Cilium -> join workers -> default-deny
- name: Kubernetes prerequisites
  hosts: cluster
  gather_facts: true
  roles:
    - role: kube_prereqs
      tags: [prereqs]

- name: Control plane
  hosts: control_plane
  gather_facts: true
  roles:
    - role: kube_control_plane
      tags: [control-plane, kubeconfig]

# Cilium goes on before the workers join so they come up with a working
# datapath rather than sitting NotReady while you wonder what broke.
- name: Container network interface
  hosts: control_plane
  gather_facts: false
  tags: [cni]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Add the Cilium Helm repository
      kubernetes.core.helm_repository:
        name: cilium
        repo_url: https://helm.cilium.io/
      become: true

    # kubernetes.core.helm runs the real `helm` binary on the target host
    # (1972-master-1), not on the control node running ansible-playbook — a
    # playbook_dir-based path resolves correctly as a *string* wherever the
    # Jinja templating happens, but the file it points at only exists inside
    # the ansible-runner container, never on the remote host. helm's own
    # --values flag has no concept of "fetch this from the controller" the
    # way values_files might suggest; the file has to already be sitting on
    # the machine helm actually runs on.
    - name: Copy the Cilium values file to the control plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../cluster/cilium/values.yaml"
        dest: /tmp/cilium-values.yaml
        mode: "0644"
      become: true

    - name: Install Cilium
      kubernetes.core.helm:
        name: cilium
        chart_ref: cilium/cilium
        chart_version: "{{ cilium_version }}"
        release_namespace: kube-system
        values_files:
          - /tmp/cilium-values.yaml
        # kube-proxy replacement needs the API server address explicitly,
        # because it cannot be reached through a Service that does not exist
        # yet. Standard mode first is a supported migration path (§4.3).
        values: >-
          {{
            {
              'k8sServiceHost': hostvars['1972-master-1'].ansible_host,
              'k8sServicePort': 6443,
              'kubeProxyReplacement': cilium_kube_proxy_replacement,
              'ipam': {'operator': {'clusterPoolIPv4PodCIDRList': [kubernetes_pod_cidr]}},
            }
          }}
        wait: false
      become: true

    # Not helm's own `wait: true` — that waits for every resource the release
    # creates, including hubble-relay, which has no toleration for the
    # control-plane's NoSchedule taint and cannot schedule anywhere until a
    # worker joins. Workers join in the very next play, but "so they come up
    # with a working datapath" (the reason Cilium goes on first at all) only
    # actually depends on the CNI agent and the operator — hubble-relay is
    # observability, not datapath, and gating worker-join on it means a
    # guaranteed wait_timeout failure on every single bootstrap.
    - name: Wait for the Cilium DaemonSet to be ready
      kubernetes.core.k8s_info:
        kind: DaemonSet
        name: cilium
        namespace: kube-system
      register: kube_control_plane_cilium_ds
      until: >-
        kube_control_plane_cilium_ds.resources | length > 0 and
        (kube_control_plane_cilium_ds.resources[0].status.numberReady | default(0)) ==
        (kube_control_plane_cilium_ds.resources[0].status.desiredNumberScheduled | default(-1))
      retries: 30
      delay: 10
      become: true

    - name: Wait for the Cilium operator to be ready
      kubernetes.core.k8s_info:
        kind: Deployment
        name: cilium-operator
        namespace: kube-system
      register: kube_control_plane_cilium_operator
      until: >-
        kube_control_plane_cilium_operator.resources | length > 0 and
        (kube_control_plane_cilium_operator.resources[0].status.readyReplicas | default(0)) ==
        (kube_control_plane_cilium_operator.resources[0].status.replicas | default(-1))
      retries: 30
      delay: 10
      become: true

- name: Join the workers
  hosts: workers
  gather_facts: true
  roles:
    - role: kube_worker
      tags: [join]

- name: Baseline cluster policy
  hosts: control_plane
  gather_facts: false
  tags: [policy]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Wait for every node to become Ready
      kubernetes.core.k8s_info:
        kind: Node
      register: cluster_nodes
      until: >-
        cluster_nodes.resources | length == groups['cluster'] | length and
        cluster_nodes.resources
          | map(attribute='status.conditions')
          | map('selectattr', 'type', 'equalto', 'Ready')
          | map('map', attribute='status')
          | map('first')
          | reject('equalto', 'True') | list | length == 0
      retries: 30
      delay: 10
      become: true

    # kubeadm labels the control-plane node with node-role.kubernetes.io/
    # control-plane automatically; it has never done the same for workers -
    # that label is a convention every consumer downstream is free to assume
    # but nothing upstream actually sets. cluster/longhorn/values.yaml's
    # systemManagedComponentsNodeSelector already assumed it existed, which
    # left every Longhorn CSI sidecar (attacher, provisioner, resizer,
    # snapshotter) permanently Pending - "0/3 nodes are available: 1 node(s)
    # had untolerated taint(s), 2 node(s) didn't match Pod's node affinity"
    # - since the two nodes that could otherwise take them never carried the
    # label the selector was written against. Runs from the control plane
    # because a worker's own kubelet.conf has no permission to label any
    # node, including itself.
    # node.longhorn.io/create-default-disk: cluster/longhorn/values.yaml sets
    # defaultSettings.createDefaultDiskLabeledNodes: true - a deliberate
    # opt-in ("only create a disk on nodes I explicitly say to", rather than
    # every eligible node automatically) that only does anything once
    # something actually applies the label it is gated on. Nothing did, so
    # Longhorn never created a disk on either worker: both Node.longhorn.io
    # objects showed disks: {} indefinitely, and every PVC sat detached with
    # "un-schedulable replicas" - there is nowhere for a replica to live
    # without a disk to put it on. Same root cause class as the role label
    # above, one field over: a values.yaml decision that assumed a label
    # some prior step would set, when nothing ever did.
    - name: Label worker nodes
      kubernetes.core.k8s:
        kind: Node
        name: "{{ item }}"
        definition:
          metadata:
            labels:
              node-role.kubernetes.io/worker: "true"
              node.longhorn.io/create-default-disk: "true"
      loop: "{{ groups['workers'] }}"
      become: true

    # kubernetes.core.k8s also runs on the remote host — same story as the
    # Cilium values file two plays back. query('fileglob') is a lookup plugin
    # and always evaluates on the control node (nothing makes a lookup run
    # remotely), which is exactly why it correctly finds these files locally;
    # they then need to exist somewhere the k8s module — running on
    # 1972-master-1 — can actually read them from. One recursive copy handles
    # both this loop and the tenants/ one below; mode: preserve keeps
    # whatever permission bits the manifests already have rather than forcing
    # one uniform mode across the whole tree.
    - name: Copy the policy directory to the control plane
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../policy/"
        dest: /tmp/policy/
        mode: preserve
      become: true

    # Default-deny in every namespace
    - name: Apply baseline policy
      kubernetes.core.k8s:
        state: present
        src: "/tmp/policy/{{ item | basename }}"
      loop: "{{ query('fileglob', playbook_dir + '/../../policy/*.yaml') | sort }}"
      become: true

    - name: Apply tenant namespaces, quotas and RBAC
      kubernetes.core.k8s:
        state: present
        src: "/tmp/policy/tenants/{{ item | basename }}"
      loop: "{{ query('fileglob', playbook_dir + '/../../policy/tenants/*.yaml') | sort }}"
      become: true

# One-time migration for an EXISTING cluster still running kube-proxy
# (docs/03-cluster.md's "flip it later" path). A from-scratch rebuild never
# needs this: with cilium_kube_proxy_replacement already true, kubeadm init
# skips installing kube-proxy in the first place (kube_control_plane role).
#
# `never` alongside the custom tag, deliberately: deploy-cluster runs this
# whole playbook with no --tags filter, and Ansible runs every task that
# isn't `never`-tagged in that case. Without it this would delete kube-proxy
# on every single ordinary deploy-cluster run. Invoke explicitly and only
# once: `make remove-kube-proxy`.
#
# Cilium's own documented order (docs.cilium.io - Kubernetes Without
# kube-proxy): remove kube-proxy and its iptables rules FIRST, then flip
# cluster/cilium/values.yaml's kubeProxyReplacement and let Argo CD roll
# Cilium with the replacement active. The two mechanisms track Service
# routing independently (separate conntrack/NAT state) - this is a genuine
# hard cutover, not a gradual one. Expect a brief window with no Service
# routing at all between this running and Cilium's replacement coming up;
# minimise it by having the values.yaml change merged and ready to
# force-sync immediately after this completes, not sequenced days apart.
- name: Remove kube-proxy (kube-proxy-replacement migration)
  hosts: control_plane
  gather_facts: false
  tags: [kube-proxy-removal, never]
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Delete the kube-proxy DaemonSet
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: DaemonSet
        name: kube-proxy
        namespace: kube-system
        state: absent
      become: true

    # Deleting the ConfigMap too, not just the DaemonSet, is what stops
    # kubeadm reinstalling kube-proxy on a future `kubeadm upgrade` (k8s
    # 1.19+, per Cilium's own migration guide).
    - name: Delete the kube-proxy ConfigMap
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: kube-proxy
        namespace: kube-system
        state: absent
      become: true

- name: Clean up kube-proxy's iptables rules on every node
  hosts: cluster
  gather_facts: false
  tags: [kube-proxy-removal, never]
  tasks:
    # Idempotent: on a node with no KUBE- chains left, this restores the
    # same ruleset unchanged. Safe to re-run if a node was missed the first
    # time.
    - name: Strip KUBE- iptables chains
      ansible.builtin.shell:
        cmd: set -o pipefail && iptables-save | grep -v KUBE | iptables-restore
        executable: /bin/bash
      become: true
      changed_when: true

# Applies kubeadm-config.yaml.j2's etcd listen-metrics-urls to an EXISTING
# control plane, where the role skips kubeadm init and the template is inert.
# A rebuild needs none of this: kubeadm init renders the flag in.
#
# `never`-tagged for the same reason as kube-proxy-removal above: run it
# explicitly, once: `make etcd-metrics`. Re-running is a no-op once the flag
# is live.
#
# Regenerates only the etcd static-pod manifest, from the same template the
# role renders, then uploads the ClusterConfiguration so a later
# `kubeadm upgrade` keeps the flag instead of silently dropping it. The
# kubelet restarts etcd when the manifest changes; this is a single-member
# etcd, so the apiserver is unavailable for those seconds - pick a quiet
# moment, not mid-deploy.
- name: Expose etcd metrics on the node IP
  hosts: control_plane
  gather_facts: true
  tags: [etcd-metrics, never]
  vars_files:
    - ../roles/kube_control_plane/defaults/main.yml
    - ../roles/kube_prereqs/defaults/main.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Read the running etcd manifest
      ansible.builtin.slurp:
        src: /etc/kubernetes/manifests/etcd.yaml
      register: etcd_metrics_manifest
      become: true

    - name: Decide whether there is anything to do
      ansible.builtin.set_fact:
        etcd_metrics_live: "{{ ('http://' ~ ansible_host ~ ':2381') in (etcd_metrics_manifest.content | b64decode) }}"
        # Parsed, not regex-matched: the first version used regex_search with
        # backslash escapes that had to survive YAML and Jinja both, and did
        # not - it failed safely, before changing anything.
        etcd_metrics_running_tag: >-
          {{ ((etcd_metrics_manifest.content | b64decode | from_yaml).spec.containers
              | selectattr('name', 'equalto', 'etcd') | first).image.split(':') | last }}

    # Regenerating the manifest from config would also move etcd to whatever
    # etcd_version says. That is an etcd upgrade, not a metrics change, and
    # must not ride along unannounced.
    - name: Refuse if the running etcd does not match etcd_version
      ansible.builtin.assert:
        that: etcd_metrics_running_tag == etcd_version
        fail_msg: >-
          Running etcd is {{ etcd_metrics_running_tag }} but etcd_version is
          {{ etcd_version }}. Regenerating the manifest would upgrade etcd too.
          Reconcile etcd_version with the running cluster first.
        quiet: true
      when: not etcd_metrics_live

    - name: Apply the flag
      when: not etcd_metrics_live
      become: true
      block:
        - name: Render the current kubeadm config
          ansible.builtin.template:
            src: ../roles/kube_control_plane/templates/kubeadm-config.yaml.j2
            dest: /etc/kubernetes/kubeadm-config.yaml
            owner: root
            group: root
            mode: "0600"
            backup: true

        # Outside manifests/ deliberately: the kubelet runs every file in
        # that directory as a static pod, a backup included.
        - name: Keep the current etcd manifest for a manual rollback
          ansible.builtin.copy:
            src: /etc/kubernetes/manifests/etcd.yaml
            dest: /etc/kubernetes/etcd.yaml.pre-metrics
            remote_src: true
            mode: "0600"

        - name: Regenerate the etcd static-pod manifest
          ansible.builtin.command:
            cmd: kubeadm init phase etcd local --config /etc/kubernetes/kubeadm-config.yaml
          changed_when: true

        - name: Wait for etcd to answer on the node IP
          ansible.builtin.uri:
            url: "http://{{ ansible_host }}:2381/health"
          register: etcd_metrics_health
          until: etcd_metrics_health.status == 200
          retries: 30
          delay: 5

        - name: Upload the ClusterConfiguration so kubeadm upgrade keeps the flag
          ansible.builtin.command:
            cmd: kubeadm init phase upload-config kubeadm --config /etc/kubernetes/kubeadm-config.yaml
          changed_when: true

# Applies kubeadm-config.yaml.j2's apiServer.extraEnvs (GOMEMLIMIT) to an
# EXISTING control plane; `never`-tagged, run with `make apiserver-memlimit`.
# The API is down ~30-60s. Why it dry-runs and refuses on drift:
# ../README.md#changing-a-live-apiserver-manifest
- name: Cap the apiserver's Go heap (GOMEMLIMIT)
  hosts: control_plane
  gather_facts: true
  tags: [apiserver-memlimit, never]
  vars_files:
    - ../roles/kube_control_plane/defaults/main.yml
    - ../roles/kube_prereqs/defaults/main.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Read the running apiserver manifest
      ansible.builtin.slurp:
        src: /etc/kubernetes/manifests/kube-apiserver.yaml
      register: apiserver_manifest
      become: true

    - name: Decide whether there is anything to do
      ansible.builtin.set_fact:
        apiserver_live: "{{ (apiserver_manifest.content | b64decode | from_yaml).spec.containers | first }}"

    - name: Check what is already set
      ansible.builtin.set_fact:
        apiserver_memlimit_live: >-
          {{ (apiserver_live.env | default([]) | selectattr('name', 'equalto', 'GOMEMLIMIT')
              | map(attribute='value') | list) == [kube_control_plane_apiserver_gomemlimit] }}

    - name: Apply the limit
      when: not apiserver_memlimit_live
      become: true
      block:
        - name: Render the current kubeadm config
          ansible.builtin.template:
            src: ../roles/kube_control_plane/templates/kubeadm-config.yaml.j2
            dest: /etc/kubernetes/kubeadm-config.yaml
            owner: root
            group: root
            mode: "0600"
            backup: true

        # --dry-run writes the manifest to a random temp directory and names
        # it only in a stderr warning; KUBEADM_INIT_DRYRUN_DIR pins it instead
        # of parsing that (the first version parsed stdout and found nothing).
        - name: Render the new apiserver manifest without applying it
          ansible.builtin.command:
            cmd: >-
              kubeadm init phase control-plane apiserver
              --config /etc/kubernetes/kubeadm-config.yaml
              --dry-run
          environment:
            KUBEADM_INIT_DRYRUN_DIR: /etc/kubernetes/tmp/apiserver-memlimit-dryrun
          changed_when: false

        - name: Read the dry-run manifest
          ansible.builtin.slurp:
            src: /etc/kubernetes/tmp/apiserver-memlimit-dryrun/kube-apiserver.yaml
          register: apiserver_rendered

        - name: Refuse unless the env is the only change
          vars:
            rendered: "{{ (apiserver_rendered.content | b64decode | from_yaml).spec.containers | first }}"
          ansible.builtin.assert:
            that:
              - rendered.image == apiserver_live.image
              - rendered.command == apiserver_live.command
              - rendered.volumeMounts == apiserver_live.volumeMounts
            fail_msg: >-
              The template renders a different apiserver than the one running
              (image, flags or mounts), so regenerating it would change more
              than GOMEMLIMIT. Reconcile kubeadm-config.yaml.j2 with the
              running /etc/kubernetes/manifests/kube-apiserver.yaml first.
            quiet: true

        # Outside manifests/ deliberately: the kubelet runs every file in
        # that directory as a static pod, a backup included.
        - name: Keep the current apiserver manifest for a manual rollback
          ansible.builtin.copy:
            src: /etc/kubernetes/manifests/kube-apiserver.yaml
            dest: /etc/kubernetes/kube-apiserver.yaml.pre-memlimit
            remote_src: true
            mode: "0600"

        - name: Regenerate the apiserver static-pod manifest
          ansible.builtin.command:
            cmd: kubeadm init phase control-plane apiserver --config /etc/kubernetes/kubeadm-config.yaml
          changed_when: true

        - name: Wait for the apiserver to come back
          ansible.builtin.command:
            cmd: kubectl get --raw /readyz
          register: apiserver_ready
          until: apiserver_ready.rc == 0
          retries: 36
          delay: 5
          changed_when: false

        - name: Upload the ClusterConfiguration so kubeadm upgrade keeps the env
          ansible.builtin.command:
            cmd: kubeadm init phase upload-config kubeadm --config /etc/kubernetes/kubeadm-config.yaml
          changed_when: true
