---
name: deploy-nodes

# checkov:skip=CKV_GHA_7: check_mode toggles fixed, committed playbooks, not what runs or from where. The real boundary is `environment: lab` below.
on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/deploy-nodes.yml"
  workflow_dispatch:
    inputs:
      check_mode:
        description: "Dry run (--check --diff) instead of converging"
        type: boolean
        default: false

# Definition of done for Phase B (§3.6): push to main -> hosted arm runner
# builds and pushes ansible-runner -> self-hosted runner pulls it -> nodes
# converge. No SSH from a laptop involved.
permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-nodes        # never two converges at once
  cancel-in-progress: false

jobs:
  deploy:
    # `lab-network` is the label that means "can reach 192.168.20.x". It is the
    # only reason this job is self-hosted.
    runs-on: [self-hosted, linux, arm64, lab-network]
    environment: lab
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The age key decrypts group_vars/all/secrets.sops.yml. It is the only
      # *staged* credential this workflow handles: the SSH key is
      # ansible-console, which lives on this host and never enters GitHub, and
      # known_hosts is public and committed at ansible/files/known_hosts. See
      # docs/04-secrets.md.
      - name: Stage the age key
        run: |
          install -d -m 700 "$RUNNER_TEMP/age"
          printf '%s' "${{ secrets.SOPS_AGE_KEY }}" > "$RUNNER_TEMP/age/keys.txt"
          chmod 600 "$RUNNER_TEMP/age/keys.txt"

      # This job runs inside the containerized self-hosted runner, as that
      # image's own baked-in user — not as mchellmer, who owns
      # ansible-console. The ansible-runner container the Makefile spawns is
      # a *sibling* container over the shared docker socket, so --user alone
      # can't bridge that identity gap; group membership does instead
      # (ansible-console is group:docker mode:0640 — 20-cicd-host.yml). This
      # reads the real gid rather than hardcoding it, since it's a property
      # of this specific host, not a constant.
      # The gid of the *host's* docker group, not this container's. These
      # steps run inside the containerized runner, which has its own unrelated
      # docker group (123 here) while the key ansible-runner must read is bind
      # mounted from the host and keeps the host's numeric gid (988). Adding
      # the container-local gid granted a group that owned nothing, so ssh
      # could not read the key and reported "Load key ...: Permission denied"
      # followed by a misleading "Permission denied (publickey)".
      #
      # The docker socket is itself bind mounted from the host, so its gid as
      # seen in here *is* the host's docker gid — and 20-cicd-host.yml
      # group-owns the key by docker for exactly this reason.
      - name: Read the docker group gid
        id: dockergid
        run: |
          echo "value=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_OUTPUT"

      # The work itself is a make target, identical to what runs on a
      # workstation. Everything above this line is orchestration.
      - name: Converge the nodes
        env:
          ANSIBLE_RUNNER: ghcr.io/${{ github.repository_owner }}/ansible-runner:stable
          SSH_KEY: /home/mchellmer/.ssh/ansible-console
          DOCKER_GID: ${{ steps.dockergid.outputs.value }}
          CHECK: ${{ inputs.check_mode && '1' || '' }}
        run: make deploy-nodes

      - name: Shred the staged credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/age"
