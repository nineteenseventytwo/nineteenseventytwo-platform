---
name: deploy-nodes

# checkov:skip=CKV_GHA_7: check_mode toggles fixed, committed playbooks, not what runs or from where. The real boundary is `environment: lab` below.
on:
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/deploy-nodes.yml"
  workflow_dispatch:
    inputs:
      check_mode:
        description: "Dry run (--check --diff) instead of converging"
        type: boolean
        default: false

# Definition of done for Phase B (§3.6): push to main -> hosted arm runner
# builds and pushes ansible-runner -> self-hosted runner pulls it -> nodes
# converge. No SSH from a laptop involved.
permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-nodes        # never two converges at once
  cancel-in-progress: false

jobs:
  deploy:
    # `lab-network` is the label that means "can reach 192.168.20.x". It is the
    # only reason this job is self-hosted.
    runs-on: [self-hosted, linux, arm64, lab-network]
    environment: lab
    steps:
      - uses: actions/checkout@v4

      - name: Read the ansible-runner version
        id: version
        run: echo "value=$(cat images/ansible-runner/version.txt)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The age key decrypts group_vars/all/secrets.sops.yml. It is the only
      # credential this workflow stages: the SSH key is ansible-console, which
      # lives on this host and never enters GitHub, and known_hosts is public
      # and committed at ansible/files/known_hosts. See docs/04-secrets.md.
      - name: Stage the age key
        run: |
          install -d -m 700 "$RUNNER_TEMP/age"
          printf '%s' "${{ secrets.SOPS_AGE_KEY }}" > "$RUNNER_TEMP/age/keys.txt"
          chmod 600 "$RUNNER_TEMP/age/keys.txt"

      # The work itself is a make target, identical to what runs on a
      # workstation. Everything above this line is orchestration.
      - name: Converge the nodes
        env:
          ANSIBLE_RUNNER: ghcr.io/${{ github.repository_owner }}/ansible-runner:${{ steps.version.outputs.value }}
          SSH_KEY: /home/mchellmer/.ssh/ansible-console
          CHECK: ${{ inputs.check_mode && '1' || '' }}
        run: make deploy-nodes

      - name: Shred the staged credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/age"
