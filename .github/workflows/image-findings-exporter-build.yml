---
name: image-findings-exporter-build

# Same trigger as the other images: publishing is tied to bumping
# images/findings-exporter/version.txt on a branch. The Go tests run inside
# the Dockerfile's build stage, so an image that fails them is never pushed -
# lint.yml's `go` job is what runs them on every PR.
on:
  push:
    branches-ignore: [main]
    paths: ["images/findings-exporter/version.txt"]

permissions:
  contents: read

concurrency:
  group: image-findings-exporter-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing in _build-image.yml
    uses: ./.github/workflows/_build-image.yml
    with:
      image: findings-exporter

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # With no source configured the exporter still serves: /healthz answers
      # and /metrics carries its HELP lines. That proves an arm64 binary that
      # starts and listens, which the build cannot prove on its own.
      - name: Verify the published image
        run: |
          set -euo pipefail
          IMAGE="${{ needs.build.outputs.image_ref }}"
          docker run -d --name fe -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 20); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/metrics | tee metrics.txt
          grep -q '^# HELP findings_open ' metrics.txt
          docker rm -f fe
