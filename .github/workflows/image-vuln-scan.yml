---
name: image-vuln-scan

# Nothing in this repo re-scans a deployed image for newly-disclosed CVEs
# after it's built — _build-image.yml only scans the two images this repo
# builds itself, and only once, at build time. Every third-party chart's
# image (Cilium, cert-manager, Longhorn, Vault, kube-prometheus-stack,
# Argo CD, MetalLB, External Secrets, kubelet-csr-approver,
# Prowler) has never been scanned for vulnerabilities by anything in this
# pipeline, at any point. This is what actually closes that gap, on a
# schedule, against whatever the cluster is genuinely running - not a
# hand-maintained list of images that drifts the moment a chart is upgraded.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # The only step that needs the lab network at all: finding out what's
  # actually running. The scan itself is `trivy image <ref>` against a
  # public registry - it never talks to the cluster, so it doesn't need
  # this runner or this credential. No `environment: lab` gate here,
  # deliberately: this is a read-only list, not a deployment, and gating a
  # weekly automated scan behind a human approval defeats the point of it
  # being automated.
  enumerate:
    # ARC scale set in-cluster, not the compose stack on 1972-console-1 —
    # ADR-0006's stated exit, taken for this workflow first. lab-deploy is
    # containerMode: kubernetes, so there is no docker socket here at all.
    # That is the whole point, and it is also why the tooling below arrives
    # as a job container rather than as a sibling container.
    runs-on: lab-deploy
    # lab-deploy's own runner image is the stock actions-runner: no kubectl,
    # no Ansible, no docker. The tools come from ansible-runner instead, run
    # *as* the job container, and RUNNER_LOCAL=1 tells the Makefile to invoke
    # them straight off PATH rather than wrapping each one in `docker run`.
    # Same targets, same image, one less layer of indirection — and no socket.
    container:
      image: ghcr.io/${{ github.repository_owner }}/ansible-runner:stable
    env:
      RUNNER_LOCAL: "1"
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v7

      - name: Stage the read-only kubeconfig
        run: |
          install -d -m 700 "$RUNNER_TEMP/kube"
          printf '%s' "${{ secrets.IMAGE_INVENTORY_KUBECONFIG }}" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"

      # Every unique image reference actually running, cluster-wide. Not
      # every image a Deployment/CronJob *could* run - a scaled-to-zero
      # workload (lab-dind) contributes nothing here, which matches "what
      # do I actually need to worry about right now" rather than "what
      # exists in a manifest somewhere".
      # kubectl, jq and make all come from the job container above, so this
      # is a direct call now - no sibling container, no docker socket. The
      # target itself is unchanged, which is the property worth keeping: the
      # thing CI runs is still the thing you run by hand.
      - name: List every running image, deduplicated
        id: list
        # Explicit bash. In a job container the runner picks the shell by
        # probing the image, and it settled on `sh -e` here even though bash
        # is installed — which made `set -o pipefail` a hard error under dash:
        #
        #   set: Illegal option -o pipefail
        #
        # Naming the shell is cheaper than depending on that probe.
        shell: bash
        run: |
          set -euo pipefail
          # $RUNNER_TEMP, not the runner.temp expression: an expression is
          # evaluated by the runner and yields the *runner's* path
          # (/home/runner/_work/_temp), while inside this container the same
          # directory is mounted at /__w/_temp. The env var is the one the
          # runner rewrites per container, so it is what agrees with the
          # staging step above — which writes through $RUNNER_TEMP too.
          export KUBECONFIG="$RUNNER_TEMP/kube/config"
          images=$(make list-running-images | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: Shred the staged credential
        if: always()
        run: rm -rf "$RUNNER_TEMP/kube"

  scan:
    needs: enumerate
    # Hosted, not self-hosted: trivy image pulls from each image's own
    # public registry directly, the same as `docker pull` would - it never
    # needs a path into VLAN 20, only the internet _build-image.yml's own
    # image scan already assumes on this exact runner type.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.enumerate.outputs.images) }}
    steps:
      - name: Sanitise the image ref into a filesystem-safe name
        id: name
        run: |
          safe=$(echo "${{ matrix.image }}" | tr -c 'A-Za-z0-9._-' '_')
          echo "safe=$safe" >> "$GITHUB_OUTPUT"
          # Category is the repository only - tag and/or @sha256 digest
          # stripped - not the full sanitised ref above. Confirmed live
          # (2026-09-02): using the full ref (including version) as the
          # category meant every chart bump orphaned its old findings under
          # a category nothing would ever scan again instead of closing
          # them - 646 stale alerts had accumulated across 11 dead
          # categories by the time this was caught, roughly a fifth of
          # everything "open" in the Security tab. A stable per-repository
          # category is what lets GitHub treat successive scans as the same
          # analysis over time and auto-resolve findings that stop
          # appearing, the same way it already does for _build-image.yml's
          # own two images.
          repo=$(echo "${{ matrix.image }}" | sed -E 's/@sha256:[a-f0-9]+//' | sed -E 's/:[^:/]+$//')
          echo "category=$(echo "$repo" | tr -c 'A-Za-z0-9._-' '_')" >> "$GITHUB_OUTPUT"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        # Scan the architecture the cluster actually runs. Trivy resolves a
        # multi-arch index through go-containerregistry, whose default
        # platform is linux/amd64 regardless of what the runner is - so
        # without this the scan was answering the wrong question twice over:
        #
        #  - the lab's own images are built arm64-only, so there is no amd64
        #    child to select and the scan failed outright. Confirmed live
        #    2026-09-18: all 8 ghcr.io/nineteenseventytwo/* images failed with
        #    "no child with platform linux/amd64 in index", while all 41
        #    multi-arch third-party images passed.
        #  - those 41 passed by scanning their amd64 layers, which is not what
        #    runs here. Different base layers, different CVEs.
        #
        # exit-code 0 does not mask this: those were image-resolution errors,
        # not findings.
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: sarif
          output: "${{ steps.name.outputs.safe }}.sarif"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # report every image, don't let one stop the rest

      # One upload per image, not a single merged upload in `report`: GitHub
      # stopped allowing multiple SARIF runs under the same category in one
      # upload (confirmed against the real failure - "does not support
      # uploading multiple SARIF runs with the same category" - since Trivy
      # gives every run the same default category).
      - name: Upload this image's findings to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "${{ steps.name.outputs.safe }}.sarif"
          category: ${{ steps.name.outputs.category }}

      - uses: actions/upload-artifact@v7
        with:
          name: sarif-${{ steps.name.outputs.safe }}
          path: "${{ steps.name.outputs.safe }}.sarif"
          retention-days: 7

  report:
    needs: scan
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true

      # A count in Slack, not the findings themselves - the Security tab is
      # the actual detail view. The point of this message is "something
      # changed, go look", not a second place to read CVE descriptions.
      - name: Summarise and notify Slack
        run: |
          set -euo pipefail
          total=0
          count=0
          for f in sarif/*.sarif; do
            n=$(jq '[.runs[].results[]] | length' "$f")
            total=$((total + n))
            count=$((count + 1))
          done
          link="https://github.com/${{ github.repository }}/security/code-scanning"
          if [ "$total" -gt 0 ]; then
            text="Weekly image vulnerability scan: ${total} HIGH/CRITICAL, fixed-available findings across ${count} images. Detail: ${link}"
          else
            text="Weekly image vulnerability scan: clean. Zero HIGH/CRITICAL, fixed-available findings across ${count} images."
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg text "$text" '{text: $text}')" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
