---
name: build-images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/build-images.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/build-images.yml"]
  workflow_dispatch:

# Native arm64 on a GitHub-hosted runner: no QEMU emulation, and no load on a
# Pi. Self-hosted runners exist because of network position, not compute
# (§3.3) — nothing about an image build needs to be inside VLAN 20.
permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        image: [ansible-runner, gha-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned version
        id: version
        run: echo "value=$(cat images/${{ matrix.image }}/version.txt)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.image }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Ephemeral runners have no warm layer cache. The fix is a
          # registry-backed cache, not a persistent runner (§3.1).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Trivy scan the built image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.value }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"      # report, do not block; raise once the base is clean

      - name: Smoke test
        if: matrix.image == 'ansible-runner' && github.event_name != 'pull_request'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/ansible-runner:${{ steps.version.outputs.value }}
          docker run --rm "$IMAGE" ansible-playbook --version
          docker run --rm "$IMAGE" kubectl version --client
          docker run --rm "$IMAGE" helm version --short
          docker run --rm "$IMAGE" sops --version
