---
name: image-gha-runner-build

# Publishing is an intentional act, not something every commit on a branch
# should kick off — the path filter means this only fires when version.txt
# itself changes. No workflow_dispatch: image creation stays tied to CI, see
# images/gha-runner/README.md §Versioning.
on:
  push:
    branches-ignore: [main]
    paths: ["images/gha-runner/version.txt"]

# The floor every job in this file gets by default; each job below already
# overrides with exactly what it needs (packages: write to build, packages:
# read to smoke-test), same pattern as lint.yml and deploy-cluster.yml.
permissions:
  contents: read

concurrency:
  group: image-gha-runner-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing in _build-image.yml
    uses: ./.github/workflows/_build-image.yml
    with:
      image: gha-runner

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # make and docker are load-bearing: every deploy workflow shells out to
      # `make <target>` from inside this image, which then runs
      # ansible-runner through the mounted socket. Losing either breaks
      # every deploy.
      - name: Verify the published image
        run: |
          IMAGE="${{ needs.build.outputs.image_ref }}"
          docker run --rm --entrypoint make "$IMAGE" --version
          docker run --rm --entrypoint docker "$IMAGE" --version
          docker run --rm --entrypoint git "$IMAGE" --version
