---
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_LOCAL: "1"

jobs:
  yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.14"}
      - run: pip install yamllint
      - run: make lint-yaml

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.14"}
      - run: pip install "ansible-core==2.21.3" ansible-lint
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: make lint-ansible
      - name: Inventory parses and every host resolves
        run: make lint-inventory

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          make lint-shell

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Values files are valid YAML and charts template cleanly
        run: make lint-helm

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Checkov (IaC misconfiguration)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes,dockerfile,github_actions
          quiet: true
          soft_fail: true      # advisory until the backlog is triaged
          output_format: sarif
          output_file_path: checkov.sarif

      - name: Trivy filesystem scan - secrets and vulnerable pins
        # advisory until the backlog is triaged, same stance as Checkov's
        # soft_fail above. Unlike Checkov, trivy-action has no soft_fail
        # input - continue-on-error is what keeps a HIGH/CRITICAL misconfig
        # finding (there are ~100 already open against main, none related
        # to any one PR) from turning this step, and the SARIF-driven
        # "Trivy" check GitHub derives from it, red on every future PR that
        # happens to touch a file carrying one.
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: .
