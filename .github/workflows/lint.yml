---
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_LOCAL: "1"

jobs:
  yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.14"}
      - run: pip install yamllint
      - run: make lint-yaml

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.14"}
      - run: pip install "ansible-core==2.21.3" ansible-lint
      - run: ansible-galaxy collection install -r ansible/requirements.yml
      - run: make lint-ansible
      - name: Inventory parses and every host resolves
        run: make lint-inventory

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          make lint-shell

  actions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          sudo mv actionlint /usr/local/bin/
          make lint-actions

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Values files are valid YAML and charts template cleanly
        run: make lint-helm

  # No code-scanning upload: this repo is private (ADR-0019), and SARIF
  # upload to a private repo needs GitHub's paid Code Security. What that
  # upload gave us is replaced here: secrets block outright; the IaC and
  # vulnerability backlog is advisory, as it was, and lands in the job
  # summary instead of the Security tab.
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Secrets block, at every severity - a secret has no acceptable level.
      # eightbitsaxlounge carried a live Twitch stream key for seven months
      # behind an advisory, HIGH-only scan; this is the lesson applied here.
      - name: Trivy secret scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      - name: Checkov (IaC misconfiguration, advisory)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes,dockerfile,github_actions
          quiet: true
          soft_fail: true      # advisory until the backlog is triaged
          output_format: cli

      # Advisory, as before: ~100 findings are already open against main and
      # none is related to any one PR. continue-on-error keeps them from
      # failing every PR; the table goes to the job summary.
      - name: Trivy vulnerabilities and misconfiguration (advisory)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          format: table
          output: trivy.txt
          severity: HIGH,CRITICAL
          # `severity` above only filters the vuln scanner - misconfig checks
          # carry their own fixed severity and ignore it. See .trivyignore for
          # why KSV-0039/KSV-0040 are excluded outright.
          trivyignores: .trivyignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## Trivy - vulnerabilities and misconfiguration (advisory)"
            echo
            echo '```'
            if [ -s trivy.txt ]; then head -c 60000 trivy.txt; else echo "no findings"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
