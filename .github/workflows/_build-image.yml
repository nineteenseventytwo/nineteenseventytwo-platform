---
name: _build-image

# Called by each images/<name> image-<name>-build.yml
# with the image name, and does the whole build-and-publish pipeline for it:
# guard against overwriting a different commit's tag, build, push :<version>,
# :sha-<short> and :latest, scan, hand back the pushed ref for the caller's
# own smoke test.
#
# :latest means exactly that — the most recently built image, on whichever
# branch triggered this — not "what's safe to deploy". That's :stable, which
# only moves on main via image-<name>-promote.yml / _promote-image.yml, and
# only by re-tagging a digest this workflow already built and smoke-tested.

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
    outputs:
      image_ref:
        description: "Fully-qualified pushed image ref, e.g. ghcr.io/org/name:1.2.3"
        value: ${{ jobs.build.outputs.image_ref }}

permissions:
  contents: read
  packages: write
  # Keyless cosign signing: id-token lets GitHub mint the short-lived OIDC
  # token cosign presents to Fulcio in place of a private key. Nothing to
  # generate, store, or rotate - the identity is this workflow run itself,
  # and Rekor's transparency log is the audit trail.
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      image_ref: ${{ steps.version.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned version
        id: version
        run: |
          value=$(cat "images/${{ inputs.image }}/version.txt")
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "image_ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:$value" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to publish over a different commit's tag
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}"
          VERSION="${{ steps.version.outputs.value }}"

          existing_sha=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)

          if [ -z "$existing_sha" ]; then
            echo "No existing $IMAGE:$VERSION — first publish of this version."
          elif [ "$existing_sha" = "${{ github.sha }}" ]; then
            echo "$IMAGE:$VERSION already published from this commit — re-run, not a collision."
          else
            cat >&2 <<EOF
          error: $IMAGE:$VERSION already exists, published from a different commit.

            published from: $existing_sha
            this run is:     ${{ github.sha }}

          version.txt collides with something already published — pick a
          different version for images/${{ inputs.image }}/version.txt.
          EOF
            exit 1
          fi

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/${{ inputs.image }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Ephemeral runners have no warm layer cache. The fix is a
          # registry-backed cache, not a persistent runner (§3.1).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}:buildcache,mode=max
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Signs the digest, not any tag - :latest and (after promotion)
      # :stable both point at this exact digest, so one signature covers
      # every tag that will ever alias it. --yes skips cosign's interactive
      # Fulcio-certificate confirmation prompt, which has no TTY to answer it
      # here anyway.
      - name: Sign the image (keyless)
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}"
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Trivy scan the built image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ steps.version.outputs.image_ref }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"      # report, do not block; raise once the base is clean
