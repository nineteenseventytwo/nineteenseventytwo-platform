---
name: _netpol-test-throwaway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: lab-deploy
    steps:
      - run: |
          echo "checking network reachability"
          curl -sf -o /dev/null -w "github.com: %{http_code}\n" https://github.com
          curl -sf -o /dev/null -w "api.github.com: %{http_code}\n" https://api.github.com
          nslookup github.com || true
          sleep 30
