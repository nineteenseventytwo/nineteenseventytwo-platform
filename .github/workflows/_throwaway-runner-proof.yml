---
name: throwaway-runner-proof

# Manual-only proof that the self-hosted runner picks up and completes a job
# — build 0003, Phase B gate. Deliberately has no dependency on Vault or a
# live cluster, unlike every other self-hosted workflow in this repo, so it
# works at exactly the point in a rebuild where the runner exists but nothing
# past it does yet. Delete this file once it has run once — same pattern as
# build 0001's PR #45 and build 0002's PR #114/#115.
on:
  workflow_dispatch:

# Doesn't check out the repo or call the GitHub API — no scope needed at all.
permissions: {}

jobs:
  proof:
    runs-on: [self-hosted, linux, arm64, lab-network]
    steps:
      - run: |
          echo "self-hosted runner picked up and ran this job"
          hostname
          uname -a
          date -u
