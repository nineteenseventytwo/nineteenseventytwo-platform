---
name: deploy-cluster

# checkov:skip=CKV_GHA_7: rebuild toggles a fixed, committed playbook, not what runs or from where. The real boundary is `environment: lab` below.
on:
  push:
    branches: [main]
    paths:
      - "cluster/**"
      - "policy/**"
      - ".github/workflows/deploy-cluster.yml"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Run the full 30-cluster.yml playbook (kubeadm init, CNI, join)"
        type: boolean
        default: false

# Once Argo CD is bootstrapped it reconciles cluster/ from main on its own, so
# the normal path for this workflow is a no-op nudge plus a sync check. The
# rebuild input is the break-glass path that runs the whole playbook.
permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-cluster
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, arm64, lab-network]
    environment: lab
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two credentials, both short-lived on disk: the age key that decrypts
      # group_vars, and the kubeconfig. The SSH key is ansible-console, which
      # lives on this host and never enters GitHub; known_hosts is public and
      # committed at ansible/files/known_hosts.
      - name: Stage credentials
        run: |
          install -d -m 700 "$RUNNER_TEMP/age" "$RUNNER_TEMP/kube"
          printf '%s' "${{ secrets.SOPS_AGE_KEY }}" > "$RUNNER_TEMP/age/keys.txt"
          printf '%s' "${{ secrets.KUBECONFIG }}"   > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/age/keys.txt" "$RUNNER_TEMP/kube/config"

      # This job runs inside the containerized self-hosted runner, as that
      # image's own baked-in user — not as mchellmer, who owns
      # ansible-console. The ansible-runner container the Makefile spawns to
      # rebuild the cluster is a *sibling* container over the shared docker
      # socket, so --user alone can't bridge that identity gap; group
      # membership does instead (ansible-console is group:docker mode:0640 —
      # 20-cicd-host.yml). Only "Rebuild the cluster" needs it: "Nudge Argo CD"
      # mounts a kubeconfig staged by this same job, no cross-identity gap
      # there.
      # The gid of the *host's* docker group, not this container's. These
      # steps run inside the containerized runner, which has its own unrelated
      # docker group (123 here) while the key ansible-runner must read is bind
      # mounted from the host and keeps the host's numeric gid (988). Adding
      # the container-local gid granted a group that owned nothing, so ssh
      # could not read the key and reported "Load key ...: Permission denied"
      # followed by a misleading "Permission denied (publickey)".
      #
      # The docker socket is itself bind mounted from the host, so its gid as
      # seen in here *is* the host's docker gid — and 20-cicd-host.yml
      # group-owns the key by docker for exactly this reason.
      - name: Read the docker group gid
        id: dockergid
        run: |
          echo "value=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_OUTPUT"

      - name: Rebuild the cluster
        if: inputs.rebuild
        env:
          ANSIBLE_RUNNER: ghcr.io/${{ github.repository_owner }}/ansible-runner:stable
          SSH_KEY: /home/mchellmer/.ssh/ansible-console
          DOCKER_GID: ${{ steps.dockergid.outputs.value }}
        run: make deploy-cluster

      - name: Nudge Argo CD and wait for sync
        env:
          ANSIBLE_RUNNER: ghcr.io/${{ github.repository_owner }}/ansible-runner:stable
        run: make argocd-sync-wait

      - name: Shred the staged credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/age" "$RUNNER_TEMP/kube"
