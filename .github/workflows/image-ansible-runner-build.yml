---
name: image-ansible-runner-build

# Publishing is an intentional act, not something every commit on a branch
# should kick off — the path filter means this only fires when version.txt
# itself changes. No workflow_dispatch: image creation stays tied to CI, see
# images/ansible-runner/README.md §Versioning.
on:
  push:
    branches-ignore: [main]
    paths: ["images/ansible-runner/version.txt"]

concurrency:
  group: image-ansible-runner-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      image: ansible-runner

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published image
        run: |
          IMAGE="${{ needs.build.outputs.image_ref }}"
          docker run --rm "$IMAGE" ansible-playbook --version
          docker run --rm "$IMAGE" kubectl version --client
          docker run --rm "$IMAGE" helm version --short
          docker run --rm "$IMAGE" sops --version
