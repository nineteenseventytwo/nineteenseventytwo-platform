---
# 07 Phase 6.4: observe pod egress, do not enforce it. Pod traffic never goes
# through the nodes' Squid proxy, so this sends every pod's DNS through
# Cilium's DNS proxy instead: Hubble's `dns` metric records each name by
# namespace, and tests/egress-observed.sh lists them.
# enableDefaultDeny false: it only allows, and only DNS to kube-dns, so
# selecting a pod never puts it into default-deny.
# Excluded: default and security (no DNS, on purpose) and kube-system.
# What it widens, and why those three: README.md#observing-pod-dns
# Phase 7 replaces it with per-namespace toFQDNs rules. Delete it then.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: observe-dns
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [default, security, kube-system]
  enableDefaultDeny:
    egress: false
    ingress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
