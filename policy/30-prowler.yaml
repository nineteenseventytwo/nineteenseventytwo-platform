---
# Scheduled Prowler scan (ADR-0005 in nineteenseventytwo-cloud). Reads the whole
# account, writes JSON findings to the security account's S3 bucket, and lives in
# its own namespace so its broad 443 egress is contained to this workload alone.
# Findings: README.md#prowler
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prowler
  namespace: security
  annotations:
    # Picked up by pod-identity-webhook, scoped to this namespace (ADR-0014).
    eks.amazonaws.com/role-arn: "arn:aws:iam::972034964468:role/cluster/cluster-prowler"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowler-scan
  namespace: security
  annotations:
    # The image hardcodes uid 1000 — see README.md#uid-1000-is-not-negotiable
    checkov.io/skip1: "CKV_K8S_40=image hardcodes uid 1000, confirmed empirically no other uid can exec it"
spec:
  # Once a day is the whole trade-off ADR-0005 makes explicit: a scheduled
  # scan has a detection window as wide as its interval. Off-peak UTC hour,
  # arbitrary otherwise.
  schedule: "0 5 * * *"
  # SUSPENDED 2026-10-26. A scan peaks at 650-840Mi of real memory, and no
  # node has that to spare: the workers' real usage runs well above their
  # requests (Longhorn's instance managers request 0 and use ~380Mi a node),
  # so a scan that fit worker-1 by requests took the node NotReady for ~3
  # minutes four minutes in. Back on once it has somewhere real to run - see
  # the PR that suspended it for the options.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # A full unrestricted-checks scan against a small account should finish
      # in minutes, not hours - this bounds a hung run rather than tuning for
      # the common case.
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: prowler
        spec:
          serviceAccountName: prowler
          restartPolicy: Never
          # This pod only ever talks to AWS (via the pod-identity-webhook's
          # own injected, separately-audienced token, added regardless of
          # this setting) - the aws provider makes no Kubernetes API calls,
          # so the default API server token has nothing to do here.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prowler
              # Pinned to the arm64 image the manifest list resolves to on
              # this cluster's own nodes (ADR-0011) - confirmed against the
              # registry and a real pull, not assumed from a locally cached
              # one. docker.io/prowlercloud/prowler:stable, 2026-09-01.
              image: docker.io/prowlercloud/prowler@sha256:70a5166d19dcce8a0e6d37b8056412b804863dbd6a24e938fb8c8c7168510598
              imagePullPolicy: Always
              args:
                - aws
                # Without this Prowler scans all 39 enabled regions and
                # OOMKills. See README.md#region-filter-or-it-oomkills
                - --region
                - eu-west-2
                - us-east-1
                # Must be a bare relative name, or the upload silently lands
                # under the wrong S3 prefix. See
                # README.md#--output-directory-must-be-a-bare-relative-name
                - --output-directory
                - findings
                # Required for --output-bucket to upload anything at all.
                # See README.md#--output-bucket-needs---output-formats
                - --output-formats
                - csv
                - json-ocsf
                - html
                - --output-bucket
                - nineteenseventytwo-prowler-517148962038
                # exit 3 means "ran fine, found FAIL results".
                # See README.md#exit-3-is-success
                - --ignore-exit-code-3
                # Decisions, not gaps - see 31-prowler-mutelist.yaml. Muted
                # findings stay in every output, flagged as suppressed.
                - --mutelist-file
                - /home/prowler/mutelist/mutelist.yaml
              # Request 768Mi: scans peak at 650-840Mi. At 512Mi it was
              # under-requested, and once the rest of the cluster requested
              # honestly (2026-10-24) no node had 512Mi left either - every
              # run sat Pending until the 1h deadline killed it, 25-26 Oct.
              resources:
                requests: {cpu: 250m, memory: 768Mi}
                # Headroom over the 2-region scan, not the 39-region OOM.
                limits: {cpu: "1", memory: 2Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: output
                  mountPath: /home/prowler/findings
                - name: mutelist
                  mountPath: /home/prowler/mutelist
                  readOnly: true
          volumes:
            - name: output
              emptyDir:
                sizeLimit: 512Mi
            - name: mutelist
              configMap:
                name: prowler-mutelist
