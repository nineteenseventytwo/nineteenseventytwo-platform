---
# A pod with no resource requests is scheduled as best-effort and is the first
# thing evicted — but it is also invisible to the scheduler's accounting, so it
# can be placed on a node with nothing left to give. On 2 GB nodes that is the
# difference between one unhappy pod and an unresponsive node.
#
# These defaults apply only where a pod does not specify its own.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: monitoring
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        memory: 1Gi
---
# Same rationale as monitoring's LimitRange above, extended to the rest of
# policy/10-default-deny.yaml's namespaces (minus kube-system - see
# 21-resource-quotas.yaml's header for why that one is deliberately excluded).
# Sized per-namespace from live Running-pod usage
# (`kubectl get pods -A --field-selector=status.phase=Running`), not copied
# from monitoring's numbers - longhorn-system and metallb-system in particular
# run several CSI/webhook sidecar containers with no requests/limits of their
# own today, so their defaults need enough headroom that those containers'
# next restart doesn't get an unrealistically small footprint.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: arc-systems
spec:
  limits:
    - type: Container
      default: {cpu: 100m, memory: 128Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 512Mi}
---
# max.memory was 1Gi, a per-container ceiling separate from (and missed by)
# PR #119's fix to controller.resources.limits.memory (1Gi -> 2Gi) and the
# argocd infra-quota's own aggregate limits.memory (also raised in that PR).
# Raising the quota and the component's own limit is not enough on its own -
# a LimitRange's max caps any *single* container regardless of headroom
# elsewhere, and this cap being lower than the controller's actual limit is
# exactly as fatal as the two admission failures PR #119 itself was written
# to explain: `pods "argocd-application-controller-0" is forbidden: maximum
# memory usage per Container is 1Gi, but limit is 2Gi` - confirmed live,
# found only because re-running bootstrap-argocd (needed since Argo CD's own
# Helm release isn't GitOps-managed - a values.yaml change needs a manual
# re-run to actually reach the cluster) surfaced it immediately. 2Gi matches
# the controller's own new limit exactly; raise this again if that value
# ever moves.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: argocd
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 2Gi}
