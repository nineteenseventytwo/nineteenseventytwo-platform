---
# longhorn-system deliberately has no LimitRange, on the same grounds as
# kube-system: it is too critical to constrain with a namespace default.
#
# This block used to live here, and it was patched once already - default.cpu
# 200m -> 500m, because guaranteedInstanceManagerCPU computes an explicit 400m
# request on instance-manager while instance-manager sets no limit of its own,
# and a request above the limit is invalid at admission. That was the CPU
# dimension of the problem. On 2026-09-18 the memory dimension arrived: the
# 256Mi default capped instance-manager, which holds every engine and replica
# process on its node, so it was OOMKilled at runtime and took every volume
# engine down with it. Six volumes faulted at once, repeatedly, on a ~7-minute
# cycle - and unlike the CPU case this failed *silently*, because a 64Mi
# request is admitted happily and only the ceiling is wrong.
#
# Patching the number a third time would just move the next collision. The
# shape is wrong: instance-manager's memory scales with how many volumes a
# node serves, so no fixed namespace default is correct for it. Longhorn's own
# chart sets explicit resources where they belong (longhornManager, longhornUI
# in cluster/longhorn/values.yaml); what is left here is the components that
# must not be capped.
#
# tests/verify-limitrange.sh carries the matching EXEMPT_DELIBERATE entry.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: metallb-system
spec:
  limits:
    - type: Container
      default: {cpu: 100m, memory: 128Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 512Mi}
