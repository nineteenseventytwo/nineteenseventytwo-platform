---
# Tenant: eightbitsaxlounge
#
# Guardrails only. The actual workload manifests (Deployments, Services,
# Ingresses) live in apps/eightbitsaxlounge/ and are reconciled by the same
# Argo CD instance that reconciles this file — see ADR-0012. Keeping the
# guardrails here, applied one sync-wave before the workloads, means a
# namespace always has its quota and default-deny policy before anything is
# ever scheduled into it.
apiVersion: v1
kind: Namespace
metadata:
  name: eightbitsaxlounge-dev
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: tenant
    platform.nineteenseventytwo/tenant: eightbitsaxlounge
---
apiVersion: v1
kind: Namespace
metadata:
  name: eightbitsaxlounge-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: tenant
    platform.nineteenseventytwo/tenant: eightbitsaxlounge
---
# Three nodes with 2 GB each is ~6 GB total, of which the platform itself uses
# roughly half. These numbers are deliberately tight; raise them in a PR with
# the reason, not by editing the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: eightbitsaxlounge-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 768Mi
    limits.memory: 1536Mi
    persistentvolumeclaims: "4"
    requests.storage: 8Gi
    count/deployments.apps: "10"
    services.loadbalancers: "1"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: eightbitsaxlounge-prod
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    persistentvolumeclaims: "6"
    requests.storage: 16Gi
    count/deployments.apps: "10"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: eightbitsaxlounge-dev
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 192Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 512Mi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: eightbitsaxlounge-prod
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 768Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: eightbitsaxlounge-dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-ingress
  namespace: eightbitsaxlounge-dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # ingress-nginx's own entry removed 2026-09-02 - the namespace no longer
    # exists. Nothing here is onboarded to the Gateway yet either (WP-5, the
    # apps/eightbitsaxlounge/ migration, is still deferred) - whichever
    # ingress mechanism that work lands on should add its own entry here
    # rather than assume this one still applies.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Same-namespace traffic. A workload manifest under apps/eightbitsaxlounge/
    # that needs a cross-namespace allow-pair adds its own NetworkPolicy
    # alongside its Deployment — this file only carries the tenant baseline.
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: eightbitsaxlounge-prod
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-ingress
  namespace: eightbitsaxlounge-prod
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # ingress-nginx's own entry removed 2026-09-02 - the namespace no longer
    # exists. Nothing here is onboarded to the Gateway yet either (WP-5, the
    # apps/eightbitsaxlounge/ migration, is still deferred) - whichever
    # ingress mechanism that work lands on should add its own entry here
    # rather than assume this one still applies.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {}
---
# CI-scoped credential for the operations docs/05-migration.md keeps in the
# app repo rather than moving to GitOps - chat-set-environment,
# midi-data-*, midi-request-* - "data/runtime operations against a running
# deployment, not cluster config". Routine deploys are Argo CD's own
# reconciliation of apps/eightbitsaxlounge/, not this ServiceAccount:
# Deployments/Services/Ingresses are deliberately read-only below so this
# credential can't fight that reconciliation loop. Restarting a workload from
# here means deleting its Pod (the "pods: delete" verb) and letting the
# Deployment's own controller recreate it - not patching the Deployment
# directly.
#
# The exact verb set is a reasonable baseline, not a transcript of the actual
# app-repo scripts, which live in eightbitsaxlounge/server and weren't
# available to check against while 8bsl's own migration is on hold. Revisit
# when that migration resumes and the real scripts can be checked against it.
#
# generate-kubeconfig.sh in this same directory turns this ServiceAccount
# into the kubeconfig the app repo's pipeline actually reads - see that
# script for how it gets from here into Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eightbitsaxlounge-ci
  namespace: eightbitsaxlounge-dev
---
# Kubernetes 1.24+ no longer auto-creates a long-lived token Secret for a
# ServiceAccount - this is the explicit opt-in, needed because a CI
# credential has to outlive the ~1h TokenRequest tokens kubectl/client-go
# mint by default for everything else.
apiVersion: v1
kind: Secret
metadata:
  name: eightbitsaxlounge-ci-token
  namespace: eightbitsaxlounge-dev
  annotations:
    kubernetes.io/service-account.name: eightbitsaxlounge-ci
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-ci
  namespace: eightbitsaxlounge-dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    # Read-only: this credential consumes ExternalSecret-materialised
    # Secrets, it never mints its own. Values still pass through Vault.
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-ci
  namespace: eightbitsaxlounge-dev
subjects:
  - kind: ServiceAccount
    name: eightbitsaxlounge-ci
    namespace: eightbitsaxlounge-dev
roleRef:
  kind: Role
  name: tenant-ci
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eightbitsaxlounge-ci
  namespace: eightbitsaxlounge-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: eightbitsaxlounge-ci-token
  namespace: eightbitsaxlounge-prod
  annotations:
    kubernetes.io/service-account.name: eightbitsaxlounge-ci
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-ci
  namespace: eightbitsaxlounge-prod
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-ci
  namespace: eightbitsaxlounge-prod
subjects:
  - kind: ServiceAccount
    name: eightbitsaxlounge-ci
    namespace: eightbitsaxlounge-prod
roleRef:
  kind: Role
  name: tenant-ci
  apiGroup: rbac.authorization.k8s.io
