---
# Tenant: eightbitsaxlounge
#
# Guardrails only. The actual workload manifests (Deployments, Services,
# Ingresses) live in apps/eightbitsaxlounge/ and are reconciled by the same
# Argo CD instance that reconciles this file — see ADR-0012. Keeping the
# guardrails here, applied one sync-wave before the workloads, means a
# namespace always has its quota and default-deny policy before anything is
# ever scheduled into it.
apiVersion: v1
kind: Namespace
metadata:
  name: eightbitsaxlounge-dev
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: tenant
    platform.nineteenseventytwo/tenant: eightbitsaxlounge
---
apiVersion: v1
kind: Namespace
metadata:
  name: eightbitsaxlounge-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: tenant
    platform.nineteenseventytwo/tenant: eightbitsaxlounge
---
# Three nodes with 2 GB each is ~6 GB total, of which the platform itself uses
# roughly half. These numbers are deliberately tight; raise them in a PR with
# the reason, not by editing the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: eightbitsaxlounge-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 768Mi
    limits.memory: 1536Mi
    persistentvolumeclaims: "4"
    requests.storage: 8Gi
    count/deployments.apps: "10"
    services.loadbalancers: "1"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: eightbitsaxlounge-prod
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    persistentvolumeclaims: "6"
    requests.storage: 16Gi
    count/deployments.apps: "10"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: eightbitsaxlounge-dev
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 192Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 512Mi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: eightbitsaxlounge-prod
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 768Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: eightbitsaxlounge-dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-ingress
  namespace: eightbitsaxlounge-dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Same-namespace traffic. A workload manifest under apps/eightbitsaxlounge/
    # that needs a cross-namespace allow-pair adds its own NetworkPolicy
    # alongside its Deployment — this file only carries the tenant baseline.
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: eightbitsaxlounge-prod
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-ingress
  namespace: eightbitsaxlounge-prod
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {}
