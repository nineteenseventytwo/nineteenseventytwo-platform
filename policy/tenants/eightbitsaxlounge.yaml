---
# Tenant: nineteenseventytwo-eightbitsaxlounge
#
# The app repo owns everything INSIDE these namespaces. It does not own the
# namespaces themselves, their quotas, or its own RBAC — that is what makes the
# quota enforceable rather than advisory.
apiVersion: v1
kind: Namespace
metadata:
  name: eightbitsaxlounge-dev
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: tenant
    platform.nineteenseventytwo/tenant: eightbitsaxlounge
---
apiVersion: v1
kind: Namespace
metadata:
  name: eightbitsaxlounge-prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: tenant
    platform.nineteenseventytwo/tenant: eightbitsaxlounge
---
# Three nodes with 2 GB each is ~6 GB total, of which the platform itself uses
# roughly half. These numbers are deliberately tight; raise them in a PR with
# the reason, not by editing the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: eightbitsaxlounge-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 768Mi
    limits.memory: 1536Mi
    persistentvolumeclaims: "4"
    requests.storage: 8Gi
    count/deployments.apps: "10"
    services.loadbalancers: "1"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: eightbitsaxlounge-prod
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    persistentvolumeclaims: "6"
    requests.storage: 16Gi
    count/deployments.apps: "10"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: eightbitsaxlounge-dev
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 192Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 512Mi}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: eightbitsaxlounge-prod
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
      max: {memory: 768Mi}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: eightbitsaxlounge-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: eightbitsaxlounge-prod
---
# Role, not ClusterRole. The app repo's pipeline can manage workloads in its own
# namespace and nothing else — it cannot read Secrets in another tenant, cannot
# create namespaces, and cannot see cluster-scoped resources at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: eightbitsaxlounge-dev
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Deliberately absent: resourcequotas, limitranges, roles, rolebindings.
  # A tenant that can edit its own quota does not have a quota.
  - apiGroups: [""]
    resources: [pods/log, pods/exec, events]
    verbs: [get, list, watch, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: eightbitsaxlounge-prod
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: eightbitsaxlounge-dev
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer}
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: eightbitsaxlounge-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: eightbitsaxlounge-prod
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer}
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: eightbitsaxlounge-prod
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: eightbitsaxlounge-dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-ingress
  namespace: eightbitsaxlounge-dev
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Same-namespace traffic. Cross-namespace allow-pairs are the app repo's to
    # add, in its own manifests, one pair at a time.
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: eightbitsaxlounge-prod
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-ingress
  namespace: eightbitsaxlounge-prod
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {}
