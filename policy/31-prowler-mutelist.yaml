---
# Prowler mutelist: findings that are decisions, not gaps. Mounted into the
# prowler-scan CronJob (30-prowler.yaml) and passed with --mutelist-file.
#
# Muted findings are still written to every output - OCSF status_id
# "Suppressed", CSV muted=True - so nothing is hidden from the record; they
# just stop being the noise that buries a real finding. The first scan after
# seven weeks down (2026-10-22) had 97 FAILs, of which about a dozen were real.
#
# Rules for this file:
#   - scope to the resource whenever the decision is about a resource (the
#     OIDC bucket, gha-tf-apply, the site distribution); account-wide only for
#     services this estate does not use at all
#   - every entry's Description names its reason or ADR
#   - never mute guardduty_no_high_severity_findings: a High is either real or
#     gets its own GuardDuty suppression rule (nineteenseventytwo-cloud
#     security/detection.tf), never a blanket mute here
apiVersion: v1
kind: ConfigMap
metadata:
  name: prowler-mutelist
  namespace: security
data:
  mutelist.yaml: |
    Mutelist:
      Accounts:
        "972034964468":
          Checks:
            # ---- the cluster's public OIDC issuer bucket (cloud ADR-0006) ----
            "s3_bucket_public_access":
              Regions: ["*"]
              Resources: ["nineteenseventytwo-oidc-972034964468"]
              Description: "OIDC discovery bucket is public by design - STS fetches the JWKS anonymously (cloud ADR-0006)."
            "s3_bucket_level_public_access_block":
              Regions: ["*"]
              Resources: ["nineteenseventytwo-oidc-972034964468"]
              Description: "OIDC discovery bucket is public by design (cloud ADR-0006)."
            "s3_bucket_cross_account_access":
              Regions: ["*"]
              Resources: ["nineteenseventytwo-oidc-972034964468"]
              Description: "Public read on two discovery paths only (cloud ADR-0006)."
            "s3_bucket_kms_encryption":
              Regions: ["*"]
              Resources: ["nineteenseventytwo-oidc-972034964468", "nineteenseventytwo-site-972034964468"]
              Description: "SSE-S3 on purpose: KMS breaks anonymous GetObject (OIDC) and needs a key grant for CloudFront OAC (site)."
            "s3_account_level_public_access_blocks":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Account-level block is off for the OIDC bucket's policy; every other bucket sets its own (cloud platform-prod main.tf)."

            # ---- admin roles that are admin roles ----
            "iam_aws_attached_policy_no_administrative_privileges":
              Regions: ["*"]
              Resources: ["AdministratorAccess"]
              Description: "Attached to the SSO PlatformAdmin / break-glass permission sets - human admin access through Identity Center."
            "iam_role_administratoraccess_policy":
              Regions: ["*"]
              Resources: ["AWSReservedSSO_.*"]
              Description: "SSO-provisioned admin roles - human admin access through Identity Center."
            "iam_inline_policy_allows_privilege_escalation":
              Regions: ["*"]
              Resources: ["gha-tf-apply"]
              Description: "The Terraform apply role must manage IAM; bounded by the aws-prod environment and its guardrails policy."
            "iam_inline_policy_no_full_access_to_kms":
              Regions: ["*"]
              Resources: ["gha-tf-apply"]
              Description: "The Terraform apply role manages the account's KMS keys."

            # ---- Config / Security Hub / Inspector: Prowler instead (cloud ADR-0005) ----
            "securityhub_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Security Hub deliberately off - Prowler on a schedule instead (cloud ADR-0005)."
            "securityhub_delegated_admin_enabled_all_regions":
              Regions: ["*"]
              Resources: ["*"]
              Description: "cloud ADR-0005."
            "config_recorder_all_regions_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "AWS Config deliberately off - per-item cost (cloud ADR-0005)."
            "config_delegated_admin_and_org_aggregator_all_regions":
              Regions: ["*"]
              Resources: ["*"]
              Description: "cloud ADR-0005."
            "inspector2_is_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "No EC2, ECR or Lambda workloads in AWS to inspect; images are scanned in-cluster (image-vuln-scan)."

            # ---- GuardDuty protection plans left off (cloud security/detection.tf) ----
            "guardduty_ec2_malware_protection_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Off: per-GB scanning, no EC2 worth scanning (detection.tf)."
            "guardduty_eks_audit_log_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Off: the cluster is on-prem kubeadm, there is no EKS (detection.tf)."
            "guardduty_eks_runtime_monitoring_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Off: no EKS."
            "guardduty_lambda_protection_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Off: no Lambda, and denied by SCP (detection.tf)."
            "guardduty_rds_protection_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Off: no RDS, and denied by SCP (detection.tf)."

            # ---- the website distribution (platform ADR-0018, cloud site.tf) ----
            "cloudfront_distributions_using_waf":
              Regions: ["*"]
              Resources: ["E1ZN7KUN0ONGHL"]
              Description: "Cloudflare's WAF is in front - the sev record is proxied (plan 09 W4)."
            "cloudfront_distributions_logging_enabled":
              Regions: ["*"]
              Resources: ["E1ZN7KUN0ONGHL"]
              Description: "Static personal site; Cloudflare analytics in front, logs would be a metered bucket nobody reads."
            "cloudfront_distributions_geo_restrictions_enabled":
              Regions: ["*"]
              Resources: ["E1ZN7KUN0ONGHL"]
              Description: "Public website."
            "cloudfront_distributions_field_level_encryption_enabled":
              Regions: ["*"]
              Resources: ["E1ZN7KUN0ONGHL"]
              Description: "Static site, GET/HEAD only - no form fields to encrypt."

            # ---- CloudTrail / CIS alarm set: cost against value ----
            "cloudwatch_log_metric_filter_.*":
              Regions: ["*"]
              Resources: ["*"]
              Description: "CIS metric-filter alarms not built; root and break-glass sign-in alerts exist (cloud org-management alarms.tf)."
            "cloudwatch_changes_to_.*":
              Regions: ["*"]
              Resources: ["*"]
              Description: "CIS change alarms not built - no VPC, NACLs or gateways exist (enable_vpc = false)."
            "cloudtrail_s3_dataevents_read_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "S3 data events are per-event cost; management events cover the account."
            "cloudtrail_s3_dataevents_write_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "As above."
            "cloudtrail_insights_exist":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Insights are per-event cost at no useful baseline for this volume."
            "cloudtrail_cloudwatch_logging_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "The org trail goes to S3 in the security account; CloudWatch delivery would duplicate it at cost."

            # ---- S3 hardening out of proportion to the data ----
            "s3_bucket_no_mfa_delete":
              Regions: ["*"]
              Resources: ["*"]
              Description: "MFA delete requires root credentials to manage; versioning and lifecycle are the protection here."
            "s3_bucket_server_access_logging_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "CloudTrail management events cover bucket changes; access logs are another metered bucket."
            "s3_bucket_cross_region_replication":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Single-region by design; the cluster is rebuilt from git."
            "s3_bucket_object_lock":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Not proportionate to the data held."
            "s3_bucket_event_notifications_enabled":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Nothing consumes bucket events."

            # ---- no IAM users (Identity Center only) ----
            "iam_password_policy_.*":
              Regions: ["*"]
              Resources: ["*"]
              Description: "No IAM users exist - humans sign in through Identity Center. Revisit if an IAM user is ever created."

            # ---- services this estate does not use ----
            "bedrock_.*":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Bedrock not in use (deferred: plan 09 W3)."
            "iam_role_access_not_stale_to_bedrock":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Bedrock not in use."
            "sagemaker_.*":
              Regions: ["*"]
              Resources: ["*"]
              Description: "SageMaker not in use."
            "resourceexplorer2_indexes_found":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Resource Explorer not in use."
            "backup_vaults_exist":
              Regions: ["*"]
              Resources: ["*"]
              Description: "AWS Backup not in use - Longhorn backs up to S3 directly."
            "vpc_different_regions":
              Regions: ["*"]
              Resources: ["*"]
              Description: "No VPC exists (enable_vpc = false)."
            "iam_support_role_created":
              Regions: ["*"]
              Resources: ["*"]
              Description: "Support is handled through Identity Center admin access."
