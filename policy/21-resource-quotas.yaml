---
# Sized around Prowler's own CronJob spec (policy/30-prowler.yaml: 250m/512Mi
# requests, 1 CPU/2Gi limits per scan) with headroom above the single
# concurrent scan pod that actually runs - completed Job pods retained by
# successfulJobsHistoryLimit don't count against quota `used`, only
# Running/Pending ones do.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: infra-quota
  namespace: security
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 3Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: infra-quota
  namespace: vault
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.memory: 1Gi
---
# Scaled to zero today (see policy/00-namespaces.yaml's comment: "almost
# nothing should use it") but its dind runners are privileged and can be
# resource-hungry when a scale-set does activate - sized with real headroom
# rather than the near-zero footprint it has at rest. Raise in a PR with the
# reason if a real workload here needs more.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: infra-quota
  namespace: arc-runners
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
