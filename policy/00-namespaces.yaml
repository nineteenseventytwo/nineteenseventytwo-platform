---
# Infra namespaces, created here rather than by CreateNamespace=true so their
# Pod Security Standards labels are set from the first moment they exist.
#
# The apiserver's admission config (ansible/roles/kube_control_plane) enforces
# `baseline` cluster-wide. These labels raise a namespace above that default;
# nothing here lowers it. The four namespaces that genuinely need privileged
# pods — cilium, longhorn, metallb, kube-system — are exempted in the apiserver
# config instead, which is visible and auditable rather than silent.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    # MetalLB's speaker needs NET_RAW to send gratuitous ARP. Exempted in the
    # apiserver admission config; labelled privileged here so the reason is
    # visible where someone would look for it.
    pod-security.kubernetes.io/enforce: privileged
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    # Longhorn mounts block devices from the host. Genuinely privileged.
    pod-security.kubernetes.io/enforce: privileged
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: pod-identity-webhook
  labels:
    # Fully restricted-compliant: non-root on an unprivileged port, no
    # privilege escalation, all capabilities dropped, read-only root.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    # dind runners are privileged by construction. That is why lab-dind is a
    # separate scale set scaled to zero, and why almost nothing should use it.
    pod-security.kubernetes.io/enforce: privileged
    platform.nineteenseventytwo/tier: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: node-exporter-system
  labels:
    # node-exporter reads /proc, /sys and the root filesystem from the host
    # and binds hostPort 9100 on hostNetwork — genuinely privileged, the same
    # class of thing as longhorn-system's block-device mounts above. Split
    # into its own namespace (the monitoring release's default) rather than
    # raising all of monitoring to privileged, so Grafana/Prometheus/
    # Alertmanager/kube-state-metrics keep baseline enforcement. Wired up via
    # prometheus-node-exporter.namespaceOverride in cluster/monitoring/
    # values.yaml. Confirmed live: without this the DaemonSet's pods were
    # rejected outright — "violates PodSecurity baseline:latest: host
    # namespaces, hostPath volumes, hostPort" — zero node-exporter pods ever
    # scheduled, on any node, from first sync.
    pod-security.kubernetes.io/enforce: privileged
    platform.nineteenseventytwo/tier: infra
---
# Prowler's scan pod runs unprivileged (see policy/30-prowler.yaml) - no host
# access, no special capabilities, just outbound HTTPS to AWS's APIs and S3.
# Already scoped into pod-identity-webhook's namespaceSelector alongside
# argocd/vault/longhorn-system - see ADR-0014.
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
---
# Upstream's own install docs default this into kube-system - deliberately
# not followed here, matching this file's own pattern of a dedicated,
# properly-labelled namespace per controller rather than accreting workloads
# into kube-system (the one namespace this repo treats as too critical to
# touch with policy at all, see 10-default-deny.yaml's own header comment).
# The chart's default securityContext is already restricted-PSS-clean.
apiVersion: v1
kind: Namespace
metadata:
  name: kubelet-csr-approver
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
---
# Holds the shared Gateway resource and its Certificates/Secrets only -
# ingress-nginx's replacement. No pods run here: the actual proxying happens
# in cilium-envoy (kube-system), the same as every other Cilium component.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    platform.nineteenseventytwo/tier: infra
