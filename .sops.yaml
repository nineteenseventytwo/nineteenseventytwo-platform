---
# SOPS encrypts *values*, not files, so `git diff` on an encrypted file still
# shows which key changed. Two recipients: your workstation age key, and a CI
# key held as the AGE_KEY GitHub Actions secret.
#
# Generate a key:      age-keygen -o ~/.config/sops/age/keys.txt
# Encrypt a new file:  sops --encrypt --in-place path/to/secrets.sops.yml
# Edit in place:       sops path/to/secrets.sops.yml
creation_rules:
  - path_regex: \.sops\.ya?ml$
    unencrypted_regex: ^(apiVersion|kind|metadata)$
    age: >-
      age1l9mnd5fuj40t6xastz3g9r90semppr8c4auvt8aulq9h32n22acsy0s56y,
      age1zdjc0p3xgqkyatw9yuflflkvglj2fj9t09vhyhhk3muvlc2l9egskg60sd

  # Kubernetes Secret manifests: leave the shape readable, encrypt only data.
  - path_regex: \.sops\.enc\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1l9mnd5fuj40t6xastz3g9r90semppr8c4auvt8aulq9h32n22acsy0s56y,
      age1zdjc0p3xgqkyatw9yuflflkvglj2fj9t09vhyhhk3muvlc2l9egskg60sd
