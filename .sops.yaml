---
# SOPS encrypts *values*, not files, so `git diff` on an encrypted file still
# shows which key changed. Two recipients: your workstation age key, and a CI
# key held as the AGE_KEY GitHub Actions secret.
#
# Generate a key:      age-keygen -o ~/.config/sops/age/keys.txt
# Encrypt a new file:  sops --encrypt --in-place path/to/secrets.sops.yml
# Edit in place:       sops path/to/secrets.sops.yml
#
# Three recipients now, and any ONE of them can decrypt:
#
#   workstation age key   you, at a terminal
#   CI age key            GitHub Actions, as the AGE_KEY secret
#   KMS via IRSA          argocd-repo-server, holding no key at all
#
# The KMS recipient is the reason cluster-argocd-sops exists. It means the
# cluster can decrypt without the age private key ever being mounted into it.
#
# Two consequences worth knowing before the first confused five minutes:
#
#   - Encrypting or editing now needs an `aws sso login` session, because sops
#     encrypts the data key to every recipient. Decrypting still needs only
#     one, so `make deploy-nodes` from a laptop with just the age key is
#     unaffected.
#   - Adding a recipient does not rewrite existing files. Run
#     `sops updatekeys path/to/file` on each encrypted file once, and commit
#     the result, or the cluster cannot decrypt anything encrypted before this
#     change.
creation_rules:
  - path_regex: \.sops\.ya?ml$
    unencrypted_regex: ^(apiVersion|kind|metadata)$
    age: >-
      age1l9mnd5fuj40t6xastz3g9r90semppr8c4auvt8aulq9h32n22acsy0s56y,
      age1zdjc0p3xgqkyatw9yuflflkvglj2fj9t09vhyhhk3muvlc2l9egskg60sd
    kms: "arn:aws:kms:eu-west-2:972034964468:alias/nineteenseventytwo-sops"

  # Kubernetes Secret manifests: leave the shape readable, encrypt only data.
  - path_regex: \.sops\.enc\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: >-
      age1l9mnd5fuj40t6xastz3g9r90semppr8c4auvt8aulq9h32n22acsy0s56y,
      age1zdjc0p3xgqkyatw9yuflflkvglj2fj9t09vhyhhk3muvlc2l9egskg60sd
    kms: "arn:aws:kms:eu-west-2:972034964468:alias/nineteenseventytwo-sops"
