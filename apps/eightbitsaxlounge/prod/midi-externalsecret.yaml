---
# JWT signing key, issuer/audience, and the two registered API clients
# (chat, overlay) live in Vault at kv/tenants/eightbitsaxlounge/midi-prod —
# its own path, not shared with prod, same reasoning as db/state's split
# (a dev compromise should not also be a prod JWT-forgery key leak). This
# is a deliberate change from the pre-migration design, where
# AUTHENTICATION_SECRETKEY/ISSUER/AUDIENCE/CLIENTS_* were a single set of
# GitHub secrets shared across both dev and prod deploys.
#
# device-bypass-key is the one field that IS identical between midi-prod
# and midi-prod: both cluster instances proxy to the same physical Windows
# PC, which accepts a single shared bypass key for both its dev (5000) and
# prod (5001) listeners (midi-pc-deploy.yaml provisions both from one
# ansible run). The GitHub secret MIDI_DEVICE_BYPASS_KEY has been updated
# to match this Vault value so a future deploy-pc run stays in sync.
#
# connection-string is the in-cluster data API base URL — not really a
# secret, but kept here to match the pre-migration Secret's shape
# (avoids a mixed Secret/ConfigMap split for one related settings group).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: midi-auth
  namespace: eightbitsaxlounge-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: eightbitsaxlounge-midi-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret-key
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-prod
        property: secret-key
    - secretKey: issuer
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-prod
        property: issuer
    - secretKey: audience
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-prod
        property: audience
    - secretKey: client-0-id
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-prod
        property: client-0-id
    - secretKey: client-0-secret
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-prod
        property: client-0-secret
    - secretKey: client-1-id
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-prod
        property: client-1-id
    - secretKey: client-1-secret
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-prod
        property: client-1-secret
    - secretKey: connection-string
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-prod
        property: connection-string
    - secretKey: device-bypass-key
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-prod
        property: device-bypass-key
