---
# The allow-pair default-deny-all requires. Four future consumers — chat,
# overlay, midi, data — all reach NATS on 4222; none of them currently
# exist yet (state is second in the migration order, after db), so this
# names label selectors that match nothing yet. Inert, not invalid — same
# shape as db's own allow-pair before `data` existed (apps/README.md).
#
# Port 8222 (monitor) is deliberately NOT opened to any tenant pod: nothing
# in this migration scrapes NATS metrics cross-namespace today. Add it here
# if that changes rather than opening it pre-emptively.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-consumers-to-state
  namespace: eightbitsaxlounge-prod
spec:
  podSelector:
    matchLabels:
      app: eightbitsaxlounge
      component: state
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: eightbitsaxlounge
              component: chat
        - podSelector:
            matchLabels:
              app: eightbitsaxlounge
              component: overlay
        - podSelector:
            matchLabels:
              app: eightbitsaxlounge
              component: midi
        - podSelector:
            matchLabels:
              app: eightbitsaxlounge
              component: data
      ports:
        - protocol: TCP
          port: 4222
