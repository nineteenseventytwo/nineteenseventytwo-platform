---
# Five NATS user passwords in one Vault entry, one ExternalSecret, one
# target Secret — matching the shape the old state-nats-creds Secret had
# (system_pass/overlay_pass/chat_pass/midi_pass/data_pass), which is what
# the StatefulSet's env block already expects via secretKeyRef.
#
# Its own Vault path, not shared with prod (same reasoning as db's split:
# kv/tenants/eightbitsaxlounge/db-dev vs db-prod) — one set of NATS
# credentials covering both environments means a dev compromise hands over
# every prod publish/subscribe permission too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: state-nats-creds
  namespace: eightbitsaxlounge-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: state-nats-creds
    creationPolicy: Owner
  data:
    - secretKey: system_pass
      remoteRef:
        key: tenants/eightbitsaxlounge/state-prod
        property: system_pass
    - secretKey: overlay_pass
      remoteRef:
        key: tenants/eightbitsaxlounge/state-prod
        property: overlay_pass
    - secretKey: chat_pass
      remoteRef:
        key: tenants/eightbitsaxlounge/state-prod
        property: chat_pass
    - secretKey: midi_pass
      remoteRef:
        key: tenants/eightbitsaxlounge/state-prod
        property: midi_pass
    - secretKey: data_pass
      remoteRef:
        key: tenants/eightbitsaxlounge/state-prod
        property: data_pass
