---
# Attaches to the shared Gateway's overlay-https listener by hostname
# match alone (cluster/gateway/00-gateway.yaml) — no sectionName needed
# while hostnames don't overlap (cluster/README.md#one-gateway-one-ip).
# Requires an OPNsense Unbound host override for overlay under
# eightbitsaxlounge.com pointing at the Gateway's pinned LB IP
# (192.168.20.241) — docs/01-network-validation.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: overlay
  namespace: eightbitsaxlounge-prod
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
  hostnames:
    - "overlay.eightbitsaxlounge.com"
  rules:
    - backendRefs:
        - name: eightbitsaxlounge-overlay-service
          port: 80
