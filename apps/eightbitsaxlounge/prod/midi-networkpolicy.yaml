---
# chat is the only in-cluster consumer of midi's HTTP API (confirmed via
# chat/src/services/midi_client.py and chat's midi_device_url config);
# overlay only subscribes to NATS overlay.* topics that midi publishes,
# it never calls midi's HTTP API directly.
#
# The egress-to-data and egress-to-state rules mirror what data's and
# state's own NetworkPolicies already declare on their ingress side
# (allow-midi-to-data, allow-consumers-to-state) — redundant with the
# tenant baseline's same-namespace podSelector:{} rule, kept anyway for
# forward-compatible documentation (established precedent from db/state).
#
# The egress-to-PC rule is the one genuinely load-bearing rule here: it
# crosses outside the cluster (192.168.20.210, F9), which the baseline
# same-namespace policy does not cover. Plain HTTP on port 5001 (prod) —
# M3.s mTLS decision is not applied yet; it needs PC-side config and the
# PC is currently offline. Tracked as a follow-up.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-midi
  namespace: eightbitsaxlounge-prod
spec:
  podSelector:
    matchLabels:
      app: eightbitsaxlounge
      component: midi
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: eightbitsaxlounge
              component: chat
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: eightbitsaxlounge
              component: data
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: eightbitsaxlounge
              component: state
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - ipBlock:
            cidr: 192.168.20.210/32
      ports:
        - protocol: TCP
          port: 5001
