---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eightbitsaxlounge-chat-config
  namespace: eightbitsaxlounge-prod
  labels:
    app: eightbitsaxlounge
    component: chat
data:
  twitch_channel: "the8bitsaxlounge"
  midi_device_url: "http://eightbitsaxlounge-midi-service:8080"
  log_level: "INFO"
  bot_name: "EightBitSaxBot"
  # See dev/chat-configmap.yaml for the full explanation — these were
  # swapped (896950964 is the8bitsaxlounge the broadcaster, 1424580736 is
  # the8bitsaxbot the actual bot account) and the swap broke chat's own
  # startup reconciliation, not just which account posts. Un-swapped here
  # to match dev, ahead of prod coming back online for testing.
  bot_id: "1424580736"
  bot_owner_id: "896950964"
  nats_url: "nats://eightbitsaxlounge-state-client:4222"
  nats_user: "chat"
