---
# Two different Vault paths feed one Secret. client-id/client-secret are
# chat's own Twitch Developer App credentials
# (kv/tenants/eightbitsaxlounge/chat-dev) — one Twitch app shared across
# dev and prod deliberately (it's a single external OAuth registration,
# not a per-environment credential the way JWT signing keys are).
#
# midi-client-id/midi-client-secret instead read from midi's OWN Vault
# path (kv/tenants/eightbitsaxlounge/midi-dev, client-0-id/client-0-secret)
# — provisioned during midi's own migration specifically for chat to use
# (client-0-id there is literally the string "chat-dev"). Not duplicated
# into chat's own path: midi is the system of record for which client
# credentials it accepts, so a future credential rotation only ever
# happens in one place.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-secrets
  namespace: eightbitsaxlounge-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: eightbitsaxlounge-chat-secrets
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: tenants/eightbitsaxlounge/chat-dev
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: tenants/eightbitsaxlounge/chat-dev
        property: client-secret
    - secretKey: midi-client-id
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-dev
        property: client-0-id
    - secretKey: midi-client-secret
      remoteRef:
        key: tenants/eightbitsaxlounge/midi-dev
        property: client-0-secret
