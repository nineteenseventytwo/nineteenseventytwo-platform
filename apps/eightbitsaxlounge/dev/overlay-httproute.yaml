---
# Attaches to the shared Gateway's overlay-dev-https listener
# (cluster/gateway/00-gateway.yaml). sectionName is required: without it the
# route also binds the hostname-less HTTP listener and outranks the HTTPS
# redirect there (cluster/README.md#one-gateway-one-ip).
# Requires an OPNsense Unbound host override for overlay-dev under
# eightbitsaxlounge.com pointing at the Gateway's pinned LB IP
# (192.168.20.241) — docs/01-network-validation.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: overlay
  namespace: eightbitsaxlounge-dev
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      namespace: gateway
      sectionName: overlay-dev-https
  hostnames:
    - "overlay-dev.eightbitsaxlounge.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: eightbitsaxlounge-overlay-service
          port: 80
          weight: 1
