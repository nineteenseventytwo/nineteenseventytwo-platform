---
# Twitch chat bot — subscribes to Twitch EventSub, publishes overlay.*
# updates to NATS, and calls midi's HTTP API to change device effects.
# Migrated from eightbitsaxlounge/chat (ADR-0012). Sixth and last of six
# eightbitsaxlounge services (F4 order: db → state → data → midi →
# overlay → chat).
#
# No Service, no Ingress/HTTPRoute: chat has no in-cluster consumers and
# is never called from outside the cluster — matches the pre-migration
# manifest set, which also had no k8s/service.yaml. Port 8080 (health
# probes) is reached by the kubelet directly against the pod, not via a
# Service. Port 4343 (the one-time Twitch OAuth callback,
# docs/TWITCH_SETUP.md) is reached only via `make port-forward` during
# that one-time setup — never routine traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eightbitsaxlounge-chat
  namespace: eightbitsaxlounge-dev
  labels:
    app: eightbitsaxlounge
    component: chat
  annotations:
    # ADR-0016: requests/limits come from the namespace LimitRange, same
    # reasoning as every other component in this migration.
    checkov.io/skip1: "CKV_K8S_10=requests come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip2: "CKV_K8S_11=limits come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip3: "CKV_K8S_12=requests come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip4: "CKV_K8S_13=limits come from the namespace LimitRange (ADR-0016)"
    # Dockerfile creates a dedicated app user at uid 1000 at build time
    # (useradd --uid 1000), not adjustable here — same class of finding as
    # db/state/data.
    checkov.io/skip5: "CKV_K8S_40=image creates a dedicated app user at uid 1000 at build time; not adjustable here"
spec:
  replicas: 1
  # Recreate, not the RollingUpdate default: tokens-volume below is
  # ReadWriteOnce, and a surge pod scheduled to a different node can't
  # attach it while the old pod still holds it — RollingUpdate's default
  # maxSurge deadlocks the rollout waiting on a volume detach that never
  # comes until the old pod is gone. db's deployment already uses
  # Recreate for the same reason (its own single-writer PVC). Hit live
  # during the chat 7.0.3 rollout on 2026-09-11 — the new pod sat in
  # ContainerCreating until the old ReplicaSet was manually scaled to 0.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eightbitsaxlounge
      component: chat
  template:
    metadata:
      labels:
        app: eightbitsaxlounge
        component: chat
        version: "7.0.3"
    spec:
      # CKV_K8S_38: this bot never calls the k8s API server.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        # runAsGroup: the image's own group, stated rather than inherited.
        # Kubescape C-0013 counts a container with no explicit non-root
        # group as possibly running as group 0 (ADR-0017, 2026-10-27).
        runAsGroup: 1000
      containers:
        - name: twitch-bot
          image: ghcr.io/nineteenseventytwo/eightbitsaxlounge-chat@sha256:2fc1ec39bd1bf35cd7894424c5200c8dec067c88b014cd4108b84a8ced248fe9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # The token database (/app/tokens/tokens.db) is on the PVC below,
            # and a mounted volume stays writable under a read-only root -
            # the note that used to stand here had that backwards. /tmp is
            # an emptyDir for SQLite's and Python's temp files.
            readOnlyRootFilesystem: true
          env:
            - name: TWITCH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: eightbitsaxlounge-chat-secrets
                  key: client-id
            - name: TWITCH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eightbitsaxlounge-chat-secrets
                  key: client-secret
            - name: TWITCH_CHANNEL
              valueFrom:
                configMapKeyRef:
                  name: eightbitsaxlounge-chat-config
                  key: twitch_channel
            - name: TWITCH_BOT_ID
              valueFrom:
                configMapKeyRef:
                  name: eightbitsaxlounge-chat-config
                  key: bot_id
            - name: TWITCH_OWNER_ID
              valueFrom:
                configMapKeyRef:
                  name: eightbitsaxlounge-chat-config
                  key: bot_owner_id
            - name: TWITCH_PREFIX
              value: "!"
            - name: MIDI_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: eightbitsaxlounge-chat-secrets
                  key: midi-client-id
            - name: MIDI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eightbitsaxlounge-chat-secrets
                  key: midi-client-secret
            - name: MIDI_DEVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: eightbitsaxlounge-chat-config
                  key: midi_device_url
            - name: MIDI_API_TIMEOUT
              value: "30"
            - name: MIDI_DEVICE_NAME
              value: "One Series Ventris Reverb"
            - name: BOT_NAME
              valueFrom:
                configMapKeyRef:
                  name: eightbitsaxlounge-chat-config
                  key: bot_name
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: eightbitsaxlounge-chat-config
                  key: log_level
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: eightbitsaxlounge-chat-config
                  key: nats_url
            - name: NATS_USER
              valueFrom:
                configMapKeyRef:
                  name: eightbitsaxlounge-chat-config
                  key: nats_user
            - name: NATS_PASS
              valueFrom:
                secretKeyRef:
                  name: state-nats-creds
                  key: chat_pass
          ports:
            - containerPort: 8080
              name: health
            - containerPort: 4343
              name: oauth
          volumeMounts:
            - name: tokens-volume
              mountPath: /app/tokens
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tokens-volume
          persistentVolumeClaim:
            claimName: eightbitsaxlounge-chat-tokens
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
