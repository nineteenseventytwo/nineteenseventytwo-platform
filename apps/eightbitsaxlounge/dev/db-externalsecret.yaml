---
# COUCHDB_PASSWORD lives in Vault, not here — kv/tenants/eightbitsaxlounge/db-dev
# (docs/04-secrets.md's tenant secret convention, ADR-0012). Target secret
# name and key match the pre-migration manifest's shape exactly
# (secret-db-couchdb / password) so the Deployment's secretKeyRef needed no
# change.
#
# Deliberately its own path, not shared with the other environment: one
# credential covering both means a dev compromise is also a prod
# credential leak, which is the opposite of "dev/prod not both accessible"
# — a goal from the project's own original roadmap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-couchdb
  namespace: eightbitsaxlounge-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: secret-db-couchdb
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: tenants/eightbitsaxlounge/db-dev
        property: password
