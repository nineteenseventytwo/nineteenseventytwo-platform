---
# Go CRUD API — the RESTful abstraction over CouchDB. Migrated from
# eightbitsaxlounge/data (ADR-0012). The only in-cluster consumer is midi
# (ConnectionStrings:EightBitSaxLoungeDataLayer in
# EightBitSaxLoungeMidiDataService.cs) — chat and overlay do not call this
# API. Stateless: no PVC, no fsGroup concern.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eightbitsaxlounge-data
  namespace: eightbitsaxlounge-dev
  labels:
    app: eightbitsaxlounge
    component: data
  annotations:
    # ADR-0016: requests/limits come from the namespace LimitRange, same
    # reasoning as db — this component has no reason to differ.
    checkov.io/skip1: "CKV_K8S_10=requests come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip2: "CKV_K8S_11=limits come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip3: "CKV_K8S_12=requests come from the namespace LimitRange (ADR-0016)"
    checkov.io/skip4: "CKV_K8S_13=limits come from the namespace LimitRange (ADR-0016)"
    # Same precedent as db/state: uid 1000 is baked into the image at
    # build time (Dockerfile's own adduser -u 1000), not adjustable here.
    checkov.io/skip5: "CKV_K8S_40=image creates a dedicated app user at uid 1000 at build time; not adjustable here"
    # No file-based alternative — COUCHDB_PASSWORD is read from the
    # environment by main.go directly, same finding as db.
    checkov.io/skip6: "CKV_K8S_35=COUCHDB_PASSWORD read from the environment directly; no file-based alternative exists in this codebase"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eightbitsaxlounge
      component: data
  template:
    metadata:
      labels:
        app: eightbitsaxlounge
        component: data
        version: "2.0.2"
    spec:
      # CKV_K8S_38: a stateless CRUD API doesn't call the API server.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Required alongside runAsNonRoot: the image's own USER directive
        # is the name `app`, not a numeric uid — same class of finding as
        # db and state. uid 1000 is what the Dockerfile's own
        # `adduser -u 1000` creates.
        runAsUser: 1000
      containers:
        - name: data
          image: ghcr.io/nineteenseventytwo/eightbitsaxlounge-data@sha256:b1f35ef3396bedd407866874842828a4f5cafab6981dca7c8056a79db0c6bc54
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
            # Unlike db/state, this binary writes nothing to its own
            # filesystem at runtime — confirmed live with
            # `docker run --read-only`, no crash, server starts cleanly.
            # A real fix, not a skip.
            readOnlyRootFilesystem: true
          env:
            - name: COUCHDB_ENDPOINT
              value: eightbitsaxlounge-db-service:5984
            - name: COUCHDB_USER
              value: admin
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-db-couchdb
                  key: password
          ports:
            - containerPort: 8080
              name: http
          # startupProbe/livenessProbe/readinessProbe all hit /health, and
          # /health calls CouchDB's own /_up (go/handlers.go's
          # HealthCheckHandler) - by design, since data genuinely isn't
          # ready to serve while db is unreachable. That coupling is right
          # for readiness, wrong for liveness: db-deployment.yaml gives its
          # own /_up startupProbe 120s (failureThreshold: 60) precisely
          # because a Recreate-strategy StatefulSet/Deployment on Longhorn
          # can take that long to come back - confirmed live, ~70-80s
          # during the 2026-09-12 dev/prod bring-up. data's startupProbe
          # only allowed 40s (failureThreshold: 20) for the exact same
          # dependency, so a cold db start inside db's own accepted window
          # was already tripping data's tighter one and getting it killed
          # before db had even finished - the root cause behind this
          # component's historically high restart count. Matched to db's
          # own threshold here.
          #
          # livenessProbe removed rather than loosened: a livenessProbe
          # checking a downstream dependency is the wrong Kubernetes
          # pattern regardless of the threshold - it means kubelet kills
          # and restarts an otherwise-perfectly-healthy data pod every time
          # db blips, when the correct behavior is readinessProbe alone
          # pulling data out of Service routing until db recovers, with no
          # restart at all. There's no separate liveness-only endpoint in
          # this codebase yet (HealthCheckHandler is the only one, and it
          # always calls CheckHealth()) - adding one is the more complete
          # fix and is a real, if small, code change; omitting the probe
          # entirely is the immediate, no-code-change fix for the
          # cascading-restart symptom. CKV_K8S_8 (liveness probe should be
          # configured) is soft_fail in this repo's own lint.yml, so this
          # doesn't need a checkov skip annotation, but the reasoning is
          # worth having in-repo either way.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
